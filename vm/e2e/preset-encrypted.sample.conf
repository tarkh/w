# W Linux unattended install preset — E2E sample, encrypted path (LUKS2 + Limine).
#
# Same format as preset-plain.sample.conf (see lib/tui.sh answers_load). encrypt=yes
# switches the whole boot stack: LUKS2 root + Limine + limine-snapper-sync
# instead of plain btrfs + GRUB. An unattended encrypted install auto-enrolls
# TPM2 unlock (modules/limine.sh limine_enroll_tpm) so the headless boots don't
# hang at the passphrase prompt — vm/e2e.sh --encrypted attaches a swtpm TPM
# via start.sh --tpm for exactly that. Secure Boot has no preset key at all: it
# needs firmware in Setup Mode plus a manual UEFI toggle, so it is a post-install
# step behind Hub → Security, out of E2E scope. vm/e2e.sh copies this to vm/e2e/preset-encrypted.conf
# (gitignored) on first run and appends its generated ssh_authorized_key line;
# edit that copy, not this sample, to vary a local test run.
#
# A preset install WIPES the target disk without confirmation.
lang=en
keymap=us
locale=en_US.UTF-8
mode=edge
edge_repo=https://github.com/tarkh/w
disk=/dev/vda
encrypt=yes
luks_pass=w
hostname=w-e2e
timezone=Europe/Moscow
root_pass=w
user=w
user_pass=w
packs='containers'
# Fleet (site) overlay — optional, empty = no fleet. Points at a small git repo of
# /etc/w/{site-defaults.d,policy.d} files; site_profile picks the directory inside it.
# Seeded into /etc/w/update.conf at firstboot; see modules/site.sh.
#site_repo=https://git.example.com/w-site.git
#site_ref=main
#site_profile=default
