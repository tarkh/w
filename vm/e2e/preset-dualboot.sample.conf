# Dual-boot E2E scenario (vm/e2e.sh --dualboot --encrypted): W goes into the free space next to
# the fake "Windows" vm/fake-windows.sh lays onto the VM disk before S1 — its own ESP
# + LUKS2 root, Limine, TPM2 — and S3 proves the foreign partitions are byte for byte
# what they were. Packs off: this scenario tests the disk, not the bundles.
lang=en
keymap=us
locale=en_US.UTF-8
mode=edge
edge_repo=https://github.com/tarkh/w
disk=/dev/vda
disk_mode=free
encrypt=yes
luks_pass=w
hostname=w-e2e
timezone=Europe/Moscow
root_pass=w
user=w
user_pass=w
packs=''
