# Dual-boot E2E, plain stack (vm/e2e.sh --dualboot): W goes into the free space next
# to the fake "Windows" vm/fake-windows.sh lays onto the VM disk before S1 — its own
# ESP + btrfs root, GRUB (removable + NVRAM entry) — and S3 proves the foreign
# partitions are byte for byte what they were. The encrypted twin: preset-dualboot.
# Packs off: this scenario tests the disk and the boot menu, not the bundles.
lang=en
keymap=us
locale=en_US.UTF-8
mode=edge
edge_repo=https://github.com/tarkh/w
disk=/dev/vda
disk_mode=free
encrypt=no
hostname=w-e2e
timezone=Europe/Moscow
root_pass=w
user=w
user_pass=w
packs=''
