# W Linux unattended install preset — E2E sample, plain path (btrfs + GRUB).
#
# Format = install.conf (key=value, values %q-quoted where needed; see
# lib/tui.sh answers_load). Keys are the steps.conf vars plus lang /
# ssh_authorized_key. vm/e2e.sh copies this to vm/e2e/preset-plain.conf
# (gitignored) on first run and appends its generated ssh_authorized_key line;
# edit that copy, not this sample, to vary a local test run. The encrypted
# LUKS2+Limine scenario lives in preset-encrypted.sample.conf (e2e.sh --encrypted).
#
# A preset install WIPES the target disk without confirmation.
lang=en
keymap=us
locale=en_US.UTF-8
# Edge is the only channel a user can pick (install.sh mode_list offers nothing
# else while the stable server side is deferred), so both E2E scenarios run it —
# testing a channel no install can produce buys nothing. What varies between the
# two presets is the boot stack, not the transport.
#
# edge_repo is the knob for WHICH edge: the shipped default is the public GitHub
# release channel, and a development run points it at the dev-edge repo instead
# (private GitLab, credentials only in the gitignored working copy of this file).
# That is the whole scheme — develop against dev-edge, publish to edge. Note the
# consequence for this gate: whatever this URL names is what gets installed, so
# an unpublished change is only exercised by pointing it at dev-edge. See
# .claude/library/publishing.md.
mode=edge
edge_repo=https://github.com/tarkh/w
disk=/dev/vda
encrypt=no
hostname=w-e2e
timezone=Europe/Moscow
root_pass=w
user=w
user_pass=w
packs=''
# Fleet (site) overlay — optional, empty = no fleet. Points at a small git repo of
# /etc/w/{site-defaults.d,policy.d} files; site_profile picks the directory inside it.
# Seeded into /etc/w/update.conf at firstboot; see modules/site.sh.
#site_repo=https://git.example.com/w-site.git
#site_ref=main
#site_profile=default
