# Arch Linux ISO — pinned version for W Linux bootstrap
# Update ARCH_ISO_VERSION and ARCH_ISO_SHA256 when upgrading base ISO.
# SHA256 source: https://archlinux.org/download/

ARCH_ISO_VERSION="2026.06.01"
ARCH_ISO_FILE="archlinux-${ARCH_ISO_VERSION}-x86_64.iso"
ARCH_ISO_URL="https://geo.mirror.pkgbuild.com/iso/${ARCH_ISO_VERSION}/${ARCH_ISO_FILE}"
ARCH_ISO_SHA256="https://archlinux.org/iso/${ARCH_ISO_VERSION}/sha256sums.txt"

# OVMF (UEFI firmware) — standard Arch Linux package path
OVMF_CODE="/usr/share/ovmf/x64/OVMF_CODE.4m.fd"
OVMF_VARS="/usr/share/ovmf/x64/OVMF_VARS.4m.fd"
# Secure Boot capable firmware (SMM build). Used by `vm/start.sh --secureboot`
# together with a q35+smm machine. VARS template starts in Setup Mode (empty PK)
# so the guest can enroll its own keys via `w-secureboot setup` (sbctl).
OVMF_CODE_SECBOOT="/usr/share/ovmf/x64/OVMF_CODE.secboot.4m.fd"
# swtpm state dir for the emulated TPM 2.0 (`vm/start.sh --tpm`). Requires the
# host `swtpm` package. Lets the guest enroll LUKS into TPM2 (systemd-cryptenroll).
SWTPM_DIR="/tmp/w-swtpm"

# VM disk
VM_DISK="vm/w-base.qcow2"
VM_DISK_SIZE="40G"
VM_RAM="4G"
VM_CPUS="4"
