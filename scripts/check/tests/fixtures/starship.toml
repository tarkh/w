# W Linux — Starship prompt (W-Terminal: GUI/truecolor-first).
# Layout is static and lives here. The [palettes.w] block between the markers is
# regenerated by w-style from the active theme (`w-style apply shell`) as exact
# truecolor hex; Starship re-reads this file every prompt, so a theme switch
# recolors the prompt live. Edit layout here; never edit between the markers.
# Glyphs require a Nerd Font (JetBrainsMono Nerd Font, set by the font axis).

add_newline = true
palette = "w"

format = """
$directory$git_branch$git_status$fill$cmd_duration$nodejs$python$rust$golang
$character"""

[fill]
symbol = " "

[directory]
style = "dir bold"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
read_only = "  "
read_only_style = "error"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "git"
format = "[$symbol$branch]($style) "

[git_status]
style = "git"
format = "([\\[$all_status$ahead_behind\\]]($style)) "

[cmd_duration]
min_time = 500
style = "muted"
format = "[ $duration]($style)  "

[nodejs]
symbol = " "
style = "string"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style = "string"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "string"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "string"
format = "[$symbol($version )]($style)"

[character]
success_symbol = "[❯](accent bold)"
error_symbol = "[❯](error bold)"
vimcmd_symbol = "[❮](accent bold)"

# >>> W palette (generated by w-style — do not edit between the markers)
[palettes.w]
accent = "#91619b"
cmd = "#a526bf"
dir = "#a485a4"
git = "#91619b"
string = "#a197a4"
muted = "#5a4a63"
error = "#e34666"
# <<< W palette
