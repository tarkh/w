# W-Packs bundle: 3d — 3D creation: Blender (modelling, sculpting, shading,
# animation, Cycles/EEVEE rendering), with the W assistant able to build and
# edit scenes in a running Blender over MCP.
#
# Scope is deliberately "3D content creation". Parametric CAD (FreeCAD), 3D
# printing (slicers) and game engines (Godot) are different workflows with
# different users — future bundles of their own if ever, not ballast here
# (the same "nothing redundant" bar that kept Blender out of `graphics`).
#
# AI: the assistant DRIVES Blender over MCP (mcp-for-blender, PyPI, pinned) —
# registered through the mcp.d channel, so goose / Claude Code / Codex get it at
# launch with whatever model the w-ai profile names; the pack holds no key.
# Image-to-3D generation (TRELLIS.2 on the local ComfyUI service) is a planned
# second phase — see pack-3d.md "Незакрытое".
#
# Shell-sourced by w-pack (meta_field) and the installer TUI (packs_list) in an
# isolated subshell — every multi-word value MUST be quoted, or the line parses
# as a command. See packs.md / pack-3d.md.

NAME="3d"
DESC="3D creation: Blender with an AI assistant bridge, themed by W"
SCOPE="mixed"          # packages + GPU runtime (root) + per-user MCP bridge
DEPS=""                # no prerequisite bundles (comfyui is a soft companion, later)
WEIGHT="heavy"         # ~2.5 GiB: Blender is ~380 MiB, its dependency tree
                       # (USD, OpenVDB, OSL, oneAPI runtime libs, …) the rest;
                       # plus the Cycles GPU runtime of this machine's vendor.
                       # The user layer adds one uv tool (~60 MiB) — no models
INSTALLER="on"         # "will I do 3D on this machine" is an install-time question
