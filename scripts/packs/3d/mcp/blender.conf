# 3d bundle — MCP server drop-in (deployed to /usr/share/w/ai/mcp.d/ by w-pack,
# read by w-ai at every host launch; format in w-ai's mcp_dropins()).
#
# mcp-for-blender (ahujasid, MIT, PyPI; pinned in setup-user.sh): scene/object
# inspection, Python inside the running Blender, viewport screenshots, bpy/node
# reference lookups, GLB/FBX export, Poly Haven / Poly Pizza / Sketchfab assets.
# The Blender half — an add-on that listens on localhost:9876 — is copied and
# enabled by the W startup module (w_integration.py), so it is there as soon as
# Blender starts.
#
# Started through `env`, because mcp.d has no environment field:
#   DISABLE_TELEMETRY=true   — upstream counts usage by default; W sends nothing.
#   BLENDER_MCP_SAFE_MODE=1  — upstream's AST allowlist for model-written code:
#     bpy/bmesh/mathutils and pure stdlib only; no os/subprocess/socket, no
#     add-on or extension installs, no handlers/drivers. Rendering, saving,
#     opening, import/export stay allowed. A guard against prompt injection from
#     downloaded asset metadata, not a sandbox (pack-3d.md). To lift it for your
#     account, put a copy of this file without it into ~/.config/w/ai/mcp.d/.
COMMAND="env"
ARGS="DISABLE_TELEMETRY=true BLENDER_MCP_SAFE_MODE=1 ~/.local/bin/mcp-for-blender"
REQUIRES="~/.local/bin/mcp-for-blender"
DESCRIPTION="Blender 3D: inspect and build scenes, run bpy code inside the running Blender, viewport screenshots, render, GLB/FBX export, Poly Haven assets"
