# W-Packs bundle: bitwarden — the Bitwarden desktop app, wired into W's slots.
#
# W does not ship a password manager and takes no position on which one you use.
# What it ships is the SLOTS one plugs into: the polkit prompt that biometric
# unlock speaks to, the Secret Service that holds its unlock key, the clipboard
# filter that keeps copied passwords out of the history, and the SSH agent
# indirection (w-ssh). This bundle is only the wiring — install it if Bitwarden is
# the manager you happen to use; the slots work the same for any other.
#
# Shell-sourced by w-pack (meta_field) in an isolated subshell — every multi-word
# value MUST be quoted, or the line parses as a command. See packs.md / w-ssh.md.

NAME="bitwarden"
DESC="Bitwarden desktop: SSH agent, biometric unlock and tray autostart wired into W"
SCOPE="mixed"          # package (root) + per-account agent selection and autostart
DEPS=""                # no prerequisite bundles
WEIGHT="light"         # one Electron app from extra
INSTALLER="off"        # userspace-only: the choice of password manager is not an
                       # install-time decision, and W ships no default one
