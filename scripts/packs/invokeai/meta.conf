# W-Packs bundle: invokeai — InvokeAI, the canvas-first local image generator,
# running as a W service with its own web interface.
#
# Single-app bundle, the sibling of `comfyui`: same shape (service account, a
# relocatable engine tree, the machine-wide `ai-models` store), a different
# front-end — a layered canvas and gallery instead of a node graph. The two are
# independent: neither depends on the other, and both read the same weights.
# See pack-invokeai.md.
#
# Userspace-only (`INSTALLER=off`), for the same reason as `comfyui`: gigabytes,
# a GPU-specific PyTorch build, and a choice made while using the machine.
#
# Shell-sourced by w-pack (meta_field) in an isolated subshell — every multi-word
# value MUST be quoted, or the line parses as a command. See packs.md.

NAME="invokeai"
DESC="InvokeAI: local image generation with a canvas, gallery and web interface"
SCOPE="mixed"          # service + model store (root) + group membership (user)
DEPS=""                # no prerequisite bundles
WEIGHT="heavy"         # a PyTorch/CUDA-or-ROCm virtualenv is 5-10 GB before a
                       # single model is downloaded
INSTALLER="off"        # userspace-only: never offered in the TUI checklist
