# sysusers.d fragment for the `invokeai` W-Pack — the service account and the
# group that owns the shared model store.
#
#   invokeai  the service account. Owns the engine tree, runs the unit — its own
#             blast radius, separate from any other generative service.
#   w-ai      the SHARED group over the model store (ai-models.DIR, mode 2775).
#             Also declared by the comfyui pack: sysusers is idempotent, so
#             whichever pack arrives first creates it and the second is a no-op,
#             and removing one pack never strands the other's group.
#
# video/render carry the GPU device nodes (/dev/dri/renderD*, /dev/kfd on AMD):
# without them the service silently falls back to the CPU.
#
# The home directory is the vendor default of `invokeai ROOT`; setup.sh runs
# `usermod -d` when the admin points ROOT somewhere else.

g w-ai -
u invokeai - "InvokeAI service (W)" /var/lib/w/invokeai
m invokeai w-ai
m invokeai video
m invokeai render
