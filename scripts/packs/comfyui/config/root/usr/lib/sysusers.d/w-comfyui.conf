# sysusers.d fragment for the `comfyui` W-Pack — the service account and the
# group that owns the shared model store. Declarative on purpose: setup.sh only
# calls `systemd-sysusers`, so re-running it is a no-op and the account's shape
# is reviewable in one file instead of a chain of useradd flags.
#
# TWO identities, not one, and the split is the whole design:
#
#   comfyui  the service account. Owns the engine tree, runs the unit. Per-app,
#            so a second generative service later gets its own account and its
#            own blast radius.
#   w-ai     the SHARED group over the model store (/var/lib/w/ai-models, mode
#            2775). Every AI service that reads those weights joins it, and so
#            does every human who wants to drop a checkpoint in by hand —
#            setup-user.sh adds the account that installed the bundle. This is
#            what makes one download serve every app on the machine.
#
# video/render carry the GPU device nodes (/dev/dri/renderD*, /dev/kfd on AMD):
# without them the service silently falls back to the CPU, which is the single
# most confusing failure this bundle can have.
#
# The home directory is the vendor default of `comfyui ROOT`; setup.sh runs
# `usermod -d` when the admin points ROOT somewhere else.

g w-ai -
u comfyui - "ComfyUI service (W)" /var/lib/w/comfyui
m comfyui w-ai
m comfyui video
m comfyui render
