# W-Packs bundle: comfyui — ComfyUI, the local generative-media engine, running
# as a W service with its own web interface.
#
# Single-app bundle, like `bitwarden` and `telegram`: the app IS the direction.
# It was scoped as a direction-named `ai-image` bundle at first and renamed —
# "image" undersells it (ComfyUI generates video, audio and 3D through the same
# graph), and the bundle installs exactly one program, so naming it after a
# category would promise alternatives that are not in the box. What genuinely IS
# direction-wide — where the model weights live — is not in this bundle at all:
# it is the `ai-models` subsystem in the base system, which the next generative
# app (InvokeAI, say) reads without depending on this pack. See pack-comfyui.md.
#
# Userspace-only (`INSTALLER=off`), for the same reason as `ai-extra`: tens of
# gigabytes, a GPU-specific PyTorch build, and a "do I actually want this" that
# only gets answered while using the machine — never mid-install off the ISO.
#
# Shell-sourced by w-pack (meta_field) in an isolated subshell — every multi-word
# value MUST be quoted, or the line parses as a command. See packs.md.

NAME="comfyui"
DESC="ComfyUI: local image and video generation, backend plus web interface"
SCOPE="mixed"          # service + model store (root) + group membership (user)
DEPS=""                # no prerequisite bundles
WEIGHT="heavy"         # a PyTorch/CUDA-or-ROCm virtualenv is 7-10 GB before a
                       # single model is downloaded
INSTALLER="off"        # userspace-only: never offered in the TUI checklist
