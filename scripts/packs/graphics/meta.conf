# W-Packs bundle: graphics — 2D creative work: raster editing and photo
# retouching (GIMP), vector drawing and design (Inkscape), digital painting
# (Krita) plus the G'MIC filter suite for GIMP. All four from the official
# `extra` repo.
#
# Scope is deliberately 2D. The Ф4 roadmap once said "2D/3D" for this bundle;
# Blender (3D, 385 MiB) and darktable/RawTherapee (RAW photo development) are
# different workflows with different users and belong to future bundles of
# their own (`3d`, `photo`) — a one-gigabyte "everything about pictures" pack
# fails the "nothing redundant" bar.
#
# AI: two layers, both on W's existing wiring, no key of its own. (1) The W
# assistant DRIVES the editors over MCP — the bundle registers an Inkscape MCP
# server (mcpinkscape, PyPI) and a GIMP one (gimpmcp, pinned release) through
# the mcp.d channel, so goose / Claude Code / Codex get them at launch with
# whatever model the w-ai profile names, local Ollama or cloud. (2) Generative
# editing inside Krita (krita-ai-diffusion) rides the local ComfyUI backend of
# the future `ai-image` bundle — not wired here yet (the plugin's Krita 6 port
# is merged upstream but unreleased as of 2026-09; see pack-graphics.md).
#
# Shell-sourced by w-pack (meta_field) and the installer TUI (packs_list) in an
# isolated subshell — every multi-word value MUST be quoted, or the line parses
# as a command. See packs.md / pack-graphics.md.

NAME="graphics"
DESC="Graphics and design: GIMP, Inkscape, Krita, G'MIC filters, AI assistant bridges"
SCOPE="mixed"          # packages (root) + per-user configs and MCP servers
DEPS=""                # no prerequisite bundles (ai-image is a soft companion, later)
WEIGHT="heavy"         # ~950 MiB installed across four large apps, one pacman
                       # pass, repo-only; the user layer adds one uv tool (~40 MiB)
                       # and a 10 KiB GIMP plug-in — no models, no runtimes
INSTALLER="on"         # offered in the TUI checklist: "will I draw, edit photos
                       # or design on this machine" is an install-time question
