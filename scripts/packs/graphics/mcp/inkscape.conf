# graphics bundle — MCP server drop-in (deployed to /usr/share/w/ai/mcp.d/ by
# w-pack, read by w-ai at every host launch; format in w-ai's mcp_dropins()).
#
# mcpinkscape (PyPI, tspspi): typed vector-drawing tools — create/inspect/edit
# SVG documents offline, render snapshots, export SVG/PNG/PDF, and drive the
# focused Inkscape window through its own CLI actions. Installed per account by
# setup-user.sh (`uv tool install`), so REQUIRES = the binary: an account that
# never ran `w-pack setup graphics` does not get a server that would die at
# spawn. Config: ~/.config/mcpinkscape.conf (manifest, class user).
COMMAND="mcpinkscape"
ARGS=""
