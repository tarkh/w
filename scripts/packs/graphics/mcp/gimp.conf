# graphics bundle — MCP server drop-in (deployed to /usr/share/w/ai/mcp.d/ by
# w-pack, read by w-ai at every host launch; format in w-ai's mcp_dropins()).
#
# gimpmcp (Shriinivas, pinned release, AGPL-3.0): a GIMP 3 plug-in that owns
# org.gimp.mcp.Bridge on the session bus once started from Filters →
# Development → "MCP D-Bus - Start", plus this server half that turns three
# tools (execute_gimp_code, get_gimp_info, get_gimp_viewport_screenshot) into
# gdbus calls. Run with the system python3 (python-mcp from extra) straight
# from the plug-in directory setup-user.sh unpacked it into — no venv.
COMMAND="python3"
ARGS="~/.config/GIMP/3.0/plug-ins/gimpmcp/gimpmcp/gimp_mcp_server.py"
REQUIRES="~/.config/GIMP/3.0/plug-ins/gimpmcp/gimpmcp/gimp_mcp_server.py"
