# W Linux — rootless container storage (containers bundle).
# Seeded once by W-Packs; your edits survive re-install (user-class in manifest).
#
# native overlay driver: the kernel provides rootless overlay (no fuse-overlayfs
# mount_program), and btrfs reflink keeps the store lean — no subvolume blow-up.
# The store lives under ~/.local/share/containers, which setup.sh carves out as a
# nested btrfs subvolume so it is excluded from @home snapshots (snapshots.md).
[storage]
driver = "overlay"
