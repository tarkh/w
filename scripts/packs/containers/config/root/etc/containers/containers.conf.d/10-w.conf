# W Linux — containers bundle drop-in (managed by W-Packs, do not edit).
# Podman reads /etc/containers/containers.conf.d/*.conf over the packaged defaults.
#
# DNS coexistence with systemd-resolved (DoT/Quad9 on :53, see security.md):
# aardvark-dns forwards container queries to the host resolver on an alternate
# port instead of :53, so the resolved stub — and DoT — stay intact.
[network]
dns_bind_port = 20053
