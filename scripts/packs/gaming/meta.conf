# W-Packs bundle: gaming — Steam, Proton tooling, Lutris and Heroic launchers.
#
# W ships no game launcher by default the same way it ships no browser
# preference beyond Firefox — this bundle is the product's answer to "I want
# to play games on W". Direction, not a single tool: Steam covers ~80% of a
# typical library, Lutris is the official catch-all for everything else
# (GOG/Amazon/emulation/native installers) via community scripts, and Heroic
# is added on top because Lutris's own Epic integration is fragile — Heroic
# talks to Epic/GOG's native APIs directly. Three launchers, one bundle: they
# share the same Proton/Wine/MangoHud/gamemode machine-layer underneath.
#
# `pre.sh` exists because steam/umu-launcher/lib32-* live in the `multilib`
# repository, which is off by default on Arch — enabling it and syncing it is
# a prerequisite `pkgs.txt` cannot express (setup.sh runs too late: the vendor
# lib32 GPU package has to land BEFORE steam resolves its virtual
# `lib32-vulkan-driver` dependency, or the non-interactive resolver picks
# lib32-nvidia-utils alphabetically first — broken Vulkan on AMD/Intel). See
# w-gpu-lib.sh / package-gpu.md for the detection this bundle reuses.
#
# Deliberately NOT in this bundle's core (see gaming-plan.md §0 for the full
# list and reasoning): sysctl tweaks gamemode already covers itself
# (vm.max_map_count, split_lock_mitigate), bottles/dxvk-bin/vkbasalt/goverlay/
# steamtinkerlaunch (power-user territory, not a product default),
# xpadneo-dkms/game-devices-udev (steam-devices is Steam's own hard-dep),
# Flatpak-Steam, gamescope-session, HDR/VRR (monitor policy, not a pack's).
#
# Shell-sourced by w-pack (meta_field) and the installer TUI (packs_list) in
# an isolated subshell — every multi-word value MUST be quoted, or the line
# parses as a command. See packs.md / pack-gaming.md.

NAME="gaming"
DESC="Gaming: Steam, Proton tooling, Lutris and Heroic launchers, MangoHud overlay"
SCOPE="mixed"        # multilib+packages (root) + gamemode group + per-user library exclusion
DEPS=""               # no prerequisite bundles
WEIGHT="heavy"        # ~4-5 GiB: Steam runtime + 32-bit stack + Wine + two launchers
# INSTALLER=on: i18n key p_gaming (i18n/installer.json), ai/SKILL.md and user
# documentation landed in gaming-plan.md Session 5 — the bundle is now a
# normal TUI checklist entry like any other product pack.
INSTALLER="on"
AUDIENCE="user"        # ordinary product bundle (not maintainer-hidden)
