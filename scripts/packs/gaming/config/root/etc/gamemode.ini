; gaming bundle — gamemoded config (managed by W, manifest-owned).
;
; inhibit_screensaver/disable_splitlock are left at their upstream defaults,
; spelled out explicitly rather than omitted: THIS is why W does not also ship
; the sysctl tweaks some guides recommend (vm.max_map_count is already
; 1048576 on Arch; kernel.split_lock_mitigate is handled right here, and the
; kernel default disable_splitlock=1 already matches). Two knobs, one owner —
; see pack-gaming.md for the rejected-tweaks list.
;
; renice/ioprio only take effect for accounts in the `gamemode` group — that
; membership is granted by setup-user.sh (Session 4), not here; until then
; gamemoded silently skips the privileged bump (its own documented fallback).
;
; [custom] bridges gamemoded into w-power: the start/end hooks are run AS THE
; USER (gamemoded is a user-session daemon), so w-power profile is reachable
; with no polkit involved. See /usr/lib/w/w-gamemode-hook.
[general]
inhibit_screensaver=1
disable_splitlock=1
renice=10
ioprio=0

[custom]
start=/usr/lib/w/w-gamemode-hook start
end=/usr/lib/w/w-gamemode-hook end
script_timeout=10
