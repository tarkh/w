# W-Packs bundle: virt — desktop virtualization (libvirt + QEMU/KVM + GUIs).
#
# Desktop virtualization as a product feature: run Windows, other Linux distros,
# appliances from ISO — libvirt as the manager, QEMU/KVM as the hypervisor,
# virt-manager for power users and GNOME Boxes for one-click VM creation. The
# bundle is deliberately light and product-shaped — it is the user's VM stack,
# not a developer VM harness. The dev-VM dependencies (swtpm, and the virtio
# display / firmware modules that qemu-desktop already pulls transitively) are
# added on top by the `w-dev` bundle via DEPS="virt", because that is the
# machine developing W itself, not this user's desktop.
#
# Network is the main risk and needs no migration here, unlike containers:
# libvirt's default network is a NAT bridge (virbr0) with dnsmasq bound to the
# bridge IP (192.168.122.1), NOT to 0.0.0.0:53. systemd-resolved keeps the stub
# on 127.0.0.53 with DoT/Quad9 — untouched. firewalld (always present on W) is
# libvirt's firewall backend (zones `libvirt`/`libvirt-routed`), so no raw
# iptables-nft and no dns_bind_port-style workaround (pack-virt.md).
#
# Storage: the default image pool /var/lib/libvirt/images lives under the root
# subvolume `@` (not `@home`). It is deliberately NOT excluded as a nested
# btrfs subvolume: a nested subvolume under `@` breaks root rollback
# (snapshots.md — the /var/lib/machines /var/lib/portables defect). It stays a
# plain directory and rides root snapshots (snap-pac only, NUMBER_LIMIT=20) —
# the same compromise already accepted for those two siblings. A top-level
# subvolume is a base-layout decision, not a pack's.
#
# Theming: virt-manager and Boxes are plain GTK3 apps (gtk-vnc, spice-gtk,
# vte3) — they follow w-gtk via the 200-gtk / 300-appearance axes. No external
# theme files, no tokens of their own → no wstyle/ axis of their own.
#
# Shell-sourced by w-pack (meta_field) and the installer TUI (packs_list) in an
# isolated subshell — every multi-word value MUST be quoted, or the line parses
# as a command. See packs.md / pack-virt.md.

NAME="virt"
DESC="Desktop virtualization: libvirt + QEMU/KVM, virt-manager, GNOME Boxes"
SCOPE="mixed"          # packages (root) + system env.d + per-user group membership
DEPS=""                # no prerequisite bundles (w-dev DEPS="virt" layers on top)
WEIGHT="heavy"         # ~600 MiB installed across libvirt + qemu-desktop + GUIs
INSTALLER="on"         # offered in the TUI checklist: "will I run VMs?"
AUDIENCE="user"        # ordinary product bundle
