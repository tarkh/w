# W-Packs bundle: dev — development environment. Tenants: the Zed editor (GUI code
# editor, native Wayland/GPU, Arch `extra`), the git tooling (delta + lazygit +
# ownership of ~/.gitconfig) and mise (per-project runtime versions), all wired into
# W's theme, config-ownership, session-env and AI layers.
#
# Shell-sourced by w-pack (meta_field) and the installer TUI (packs_list) in an
# isolated subshell — every multi-word value MUST be quoted, or the line parses as
# a command. See packs.md / pack-dev.md.

NAME="dev"
DESC="Development environment: Zed editor, git tooling (delta, lazygit), mise"
SCOPE="mixed"          # packages (root) + config (user home) + system env/shell drop-ins
DEPS=""                # no prerequisite bundles
WEIGHT="medium"        # ~340 MiB installed, repo packages only (mise downloads
                       # toolchains later, on demand, into ~/.local/share/mise)
INSTALLER="on"         # offered in the TUI checklist (a GUI editor is a sane
                       # install-time choice, unlike the userspace-only ai-extra)
