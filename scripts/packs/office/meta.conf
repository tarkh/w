# W-Packs bundle: office — documents, spreadsheets, presentations, PDF work and
# notes. Tenants: the LibreOffice suite (official `extra`, gtk3 VCL so it rides
# the w-style gtk/appearance axes), PDF tooling beyond the base-system viewer
# (pdfarranger for page surgery, xournalpp for annotation/handwriting — both
# GTK3, both auto-themed), the Obsidian markdown knowledge base (official `extra`
# package; freeware — see the comment below) and the metric-compatible font pair
# that keeps foreign docx/xlsx/pptx layouts intact (ttf-liberation for
# Arial/Times/Courier, ttf-carlito for Calibri).
#
# Deliberately NOT a second office suite: OnlyOffice lives only in the AUR (a
# .deb repackage) and duplicates what LibreOffice already covers, so it fails
# both the "extra repo" and the "nothing redundant" bar. Evince is redundant with
# the base-system zathura; Calligra/Gnumeric/AbiWord are suite duplicates.
#
# Obsidian is freeware under its own licence (LicenseRef-Obsidian), not FOSS —
# the first non-FOSS pick in a curated bundle. It is legal and clean because the
# bundle ships only the package NAME: the binary is fetched by the user's pacman
# from Arch's servers under Obsidian's own licence, and W (GPL-3.0-or-later)
# never copies or redistributes it — packs are not baked into the ISO, packages
# install over the network at install/apply time. Same channel the GPU module
# already uses for proprietary NVIDIA drivers. Marked freeware here so the
# choice stays visible.
#
# Shell-sourced by w-pack (meta_field) and the installer TUI (packs_list) in an
# isolated subshell — every multi-word value MUST be quoted, or the line parses
# as a command. See packs.md / pack-office.md.

NAME="office"
DESC="Office and documents: LibreOffice, PDF tools (pdfarranger, xournalpp), Obsidian notes"
SCOPE="mixed"          # packages (root) + one managed session-env drop-in
DEPS=""                # no prerequisite bundles
WEIGHT="medium"        # ~600 MiB installed (LibreOffice dominates), one pacman
                       # pass, repo-only; no runtimes or model downloads
INSTALLER="on"         # offered in the TUI checklist: "will I work with
                       # documents on this machine" is exactly an install-time
                       # question
