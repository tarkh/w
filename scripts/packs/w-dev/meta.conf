# W-Packs bundle: w-dev — the toolchain for developing W Linux itself.
#
# The one bundle that is NOT product software. Every other pack answers "what do
# you want this machine to do for you"; this one answers "this machine builds W".
# It exists because W is now developed ON W: the dev box runs the dev-edge channel
# and is therefore a user machine too, and the things `scripts/check.sh` needs
# (shellcheck, ruff, bats) are not on a stock W install. Without a declaration
# they would be installed by hand, one at a time, and become exactly the untracked
# residue the pack layer was built to prevent — nothing would list them, nothing
# would remove them, and nothing would remember why they are there.
#
# Distinct from the `dev` bundle on purpose. `dev` is a development ENVIRONMENT
# for its user (Zed, git tooling, mise) and is a perfectly ordinary product; this
# is W's own build and verification toolchain. Different audiences, different
# lifecycles, no reason for a Zed user to carry a test runner for a distro.
#
# AUDIENCE=maintainer keeps it out of every catalogue (installer checklist, Hub,
# AI tools) until it is installed — see bundle_hidden() in w-pack. `sudo w-pack
# install w-dev` is the only door, and that is the intent: a user browsing packs
# should never be offered W's build tooling, and a maintainer already knows the
# name. Its being listed once installed is not an oversight but the point.
#
# Shell-sourced by w-pack (meta_field) in an isolated subshell — every multi-word
# value MUST be quoted, or the line parses as a command. See packs.md /
# pack-w-dev.md.

NAME="w-dev"
DESC="W's own development toolchain: static checks, unit tests, release tooling"
SCOPE="machine"        # packages + one pacman database; no per-user layer at all
DEPS="virt"            # the development VM (vm/start.sh) needs libvirt/QEMU;
                       # `virt` gives the desktop stack, this bundle layers the
                       # dev-VM-only extras on top — see pack-w-dev.md §Фаза 2
WEIGHT="heavy"         # ~1.1 GiB installed (ISO-build AUR toolchain: go +
                       # jdk-openjdk + gradle), repo-only, one pacman pass
INSTALLER="off"        # mandatory with AUDIENCE=maintainer (gated by check.sh):
                       # no catalogue offers this bundle, the TUI least of all
AUDIENCE="maintainer"  # not a product — tooling for developing W itself
