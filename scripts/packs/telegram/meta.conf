# W-Packs bundle: telegram — Telegram Desktop (official `extra` package) with a
# w-style theme axis that renders the active W theme into Telegram's own
# palette format. A single-app bundle, like `bitwarden`: the app IS the
# direction.
#
# Why not a "messengers" bundle (analysed 2026-09-12, see pack-telegram.md):
# office tools complement each other (docx → LibreOffice, PDF → pdfarranger,
# notes → Obsidian — one domain, distinct jobs), but messengers are
# ALTERNATIVES by network — you use the one your contacts are on. A bundle of
# Telegram + Signal + Discord would push ~550 MiB of Electron apps of which a
# given person needs one, failing the "nothing redundant" bar; and only
# Telegram can take W's palette at all (Signal: dark/light only; Discord:
# custom themes violate its ToS; Element: niche). Other messengers, if ever
# wanted, are their own single-app bundles.
#
# Shell-sourced by w-pack (meta_field) and the installer TUI (packs_list) in an
# isolated subshell — every multi-word value MUST be quoted, or the line parses
# as a command. See packs.md / pack-telegram.md.

NAME="telegram"
DESC="Telegram Desktop messenger, themed by W"
SCOPE="mixed"          # one package (root) + a per-account theme file
DEPS=""                # no prerequisite bundles
WEIGHT="light"         # ~136 MiB installed, repo-only, one pacman pass; the
                       # Qt6 stack it needs is already there for Quickshell
INSTALLER="on"         # offered in the TUI checklist: "will I chat on Telegram
                       # on this machine" is an install-time question, and the
                       # bundle has no side effects on the account beyond a
                       # theme file (unlike bitwarden, which re-wires the SSH
                       # agent and is therefore kept out of the checklist)
