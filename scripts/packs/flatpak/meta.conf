# W-Packs bundle: flatpak — sandboxed third-party GUI apps: Flatpak + Flathub, the
# Bazaar store, Flatseal, and the W theme carried INTO the sandbox.
#
# Opt-in, not base: Flatpak is a whole second software ecosystem (its own runtimes,
# its own store, gigabytes of them) and a machine that installs everything from the
# repos never needs it. What W keeps in the base either way is the SLOT the sandbox
# plugs into — the portals, the unprivileged user namespaces the kernel policy
# deliberately leaves on, and the w-style axes that build the sandbox's GTK3 theme
# extensions and mirror its icons. Those are no-ops until this bundle lands.
#
# Shell-sourced by w-pack (meta_field) and the installer TUI (packs_list) in an
# isolated subshell — every multi-word value MUST be quoted, or the line parses as
# a command. See packs.md / pack-flatpak.md.

NAME="flatpak"
DESC="Sandboxed third-party apps: Flatpak + Flathub, the Bazaar store, Flatseal"
SCOPE="mixed"          # packages (root) + system remote/override + per-user icon mirror
DEPS=""                # no prerequisite bundles
WEIGHT="heavy"         # Flatseal pulls a freedesktop runtime; Qt apps pull the KDE one
INSTALLER="on"         # offered in the TUI checklist (unchecked by default, like every
                       # bundle) — "do I want the Flatpak ecosystem" is exactly an
                       # install-time question, unlike the userspace-only bundles
