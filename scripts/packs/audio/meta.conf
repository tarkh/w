# W-Packs bundle: audio — music production on W's PipeWire stack: Ardour 9
# (the open DAW, the pack's centre), qpwgraph for routing, Audacity for quick
# edits, a plugin starter set (Surge XT synth, LSP mixing/mastering suite,
# Dragonfly reverb), and the two system pieces every pro-audio app needs: the
# JACK API on PipeWire (pipewire-jack, swapped in for jack2 by pre.sh) and
# realtime scheduling (the `realtime` group).
#
# Theming: Ardour paints itself, so it gets its own axis (400-ardour, a colour
# theme generated from W's palette); Audacity draws its own light/dark theme,
# which 400-audacity follows W's appearance with; qpwgraph rides the qt axis.
#
# AI: Ardour ships its own MCP surface (streamable HTTP on 127.0.0.1:4820),
# registered here by URL — but it stays OFF until the user enables it in
# Ardour: it listens on every interface, unauthenticated, with no Origin check
# (pack-audio.md).
#
# Shell-sourced by w-pack (meta_field) and the installer TUI (packs_list) in an
# isolated subshell — every multi-word value MUST be quoted, or the line parses
# as a command. See packs.md / pack-audio.md.

NAME="audio"
DESC="Music production: Ardour DAW, PipeWire routing, plugin starter set, AI assistant bridge"
SCOPE="mixed"          # packages + jack swap (root) + realtime group (per user)
DEPS=""                # comfyui (YuE) is a soft companion, not wired yet
WEIGHT="heavy"         # ~660 MiB in one pacman pass, repo-only: Surge XT's
                       # wavetable/patch library alone is ~370 MiB, Ardour ~105
INSTALLER="on"         # "will I make music on this machine" is an install-time question
