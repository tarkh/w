# audio bundle — MCP server drop-in (deployed to /usr/share/w/ai/mcp.d/ by w-pack,
# read by w-ai at every host launch; format in w-ai's mcp_dropins()).
#
# Ardour's own MCP surface ("MCP HTTP Server (Experimental)", Ardour 9.8+):
# ~95 tools — session/transport, tracks and buses, sends, plugins and their
# parameters, markers, regions, MIDI notes from JSON. Served by Ardour itself
# over streamable HTTP, so the drop-in is a URL, not a command.
#
# OFF by default, on purpose: the surface listens on every interface (not just
# loopback), with no authentication and no Origin check — while it is on, any
# web page open in a browser can drive the session (a text/plain POST needs no
# CORS preflight; verified). The user turns it on in Ardour when they want the
# assistant in the session: Edit → Preferences → Control Surfaces → "MCP HTTP
# Server (Experimental)", and off again afterwards (pack-audio.md, ai/SKILL.md).
# Until then a host that connects at launch simply finds nothing on the port.
URL="http://127.0.0.1:4820/mcp"
REQUIRES="ardour9"
DESCRIPTION="Ardour DAW: session, tracks, plugins, mixer, markers, regions and MIDI notes of the running Ardour (only while its MCP surface is enabled in Preferences → Control Surfaces)"
