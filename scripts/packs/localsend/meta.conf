# W-Packs bundle: localsend — LocalSend (AirDrop-alike file transfer over the
# LAN), themed with W's accent colour, wired into Nemo's right-click menu, and
# allowed through firewalld's `home` zone on its standard port.
#
# Single-app bundle, like `telegram`: LocalSend has no substitutable alternative
# with the same reach (official apps on Linux, Windows, macOS, Android AND iOS,
# all interoperating over one open protocol) — Warpinator is Linux-only, KDE
# Connect's iOS port is comparatively unstable. The app IS the direction.
#
# Shell-sourced by w-pack (meta_field) and the installer TUI (packs_list) in an
# isolated subshell — every multi-word value MUST be quoted, or the line parses
# as a command. See packs.md / pack-localsend.md.

NAME="localsend"
DESC="LocalSend: AirDrop-like file transfer to phones/laptops, themed by W"
SCOPE="mixed"          # one package (root) + firewalld service (root) + a
                       # per-account accent-colour seed
DEPS=""                # no prerequisite bundles
WEIGHT="light"         # single prebuilt binary (~60 MiB installed), no compile
INSTALLER="on"         # offered in the TUI checklist: "will I move files
                       # between my own devices" is an install-time question,
                       # same reasoning as telegram — no side effects beyond a
                       # firewalld rule scoped to the trusted `home` zone
