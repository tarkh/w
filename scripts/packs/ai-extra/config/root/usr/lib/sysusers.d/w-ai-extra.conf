# sysusers.d fragment for the `ai-extra` W-Pack — the group that owns the shared
# model store (`ai-models DIR`). Ollama keeps its models in $DIR/ollama, owned by
# its own vendor account, so no membership is declared here: only the group, so
# the store gets its contract owner (root:w-ai 2775) even when this pack is the
# first AI pack on the machine. Same line as w-comfyui.conf / w-invokeai.conf.

g w-ai -
