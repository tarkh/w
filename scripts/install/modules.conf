# modules.conf — W Linux module registry: the single source of truth for WHICH
# modules exist, WHEN they run, and WHAT must run before them.
#
# Sibling of steps.conf (the installer's declarative step map). Everything that
# used to live in four hand-kept copies — apply.sh's source block / ALL_MODULES /
# case dispatch / usage(), install.sh's source block, w-sync's ORDER array, and
# sync-map's install-only --skip list — is derived from this file now. The last of
# those had already drifted (eight flags missing from w-sync's ORDER) before this
# file existed; that is the failure mode it removes.
#
# One row per (module, phase). '#' lines and blanks ignored. Fields are
# '|'-separated and trimmed:
#
#   name  — module identity. A modules/<name>.sh may exist (most do); pseudo-modules
#           (rootfs, yay, packages, bootloader, snapper) live inside apply.sh itself.
#   phase — WHEN it runs. See the block headers below.
#   fn    — the bash function to call. Must be defined in modules/<name>.sh or,
#           for a pseudo-module, in apply.sh / install.sh.
#   flag  — the apply.sh CLI flag, or '-' for none.
#   label — the firstboot progress-TUI label (the "@@WFB i n label@@" marker), or '-'.
#   after — ordering constraints: modules of the SAME phase that must run before this
#           one. '-' = none, '*' = after every other module of the phase (LAST).
#
# ORDER IS CURATED, NOT DERIVED. The row order inside a phase block is the order
# things actually run, and it encodes decisions the dependency graph does not
# express. `after` only CONSTRAINS it — the systemd `After=` distinction, not
# `Requires=`. check/modules.sh proves the curated order is a valid linearization
# of the graph, that the graph is acyclic, and that every consumer agrees with this
# file. So a wrong `after` is a red check, never a silently reordered install.
#
# Adding a module = write modules/<name>.sh + one row here (+ a sync-map rule only
# if its config paths need routing beyond the file drop).

# ── phase: install ─────────────────────────────────────────────────────────────
# Session 1 — runs from the ISO against the mounted target (chroot/$MNT), driven by
# install.sh's main(). apply.sh neither sources nor dispatches these; sync-map routes
# the install-only ones to --skip, since they cannot affect an installed machine.
# limine and bootloader+grub are the two mutually exclusive bootloader branches
# (encrypted / plain), so their relative order is nominal.
#
# name       | phase   | fn             | flag | label | after
base         | install | mod_base       | -    | -     | -
plymouth     | install | mod_plymouth   | -    | -     | base
limine       | install | mod_limine     | -    | -     | base plymouth
bootloader   | install | mod_bootloader | -    | -     | base plymouth
grub         | install | mod_grub       | -    | -     | bootloader
network      | install | mod_network    | -    | -     | base
wifi         | install | mod_wifi       | -    | -     | network
zram         | install | mod_zram       | -    | -     | base
snapshots    | install | mod_snapshots  | -    | -     | base
# Packages the finished target as-is and enables the service that resumes the job
# on reboot — nothing may follow it.
firstboot    | install | mod_firstboot  | -    | -     | *

# ── phase: apply / manual ──────────────────────────────────────────────────────
# Session 2 and every re-apply — runs on the live system as root. The two phases
# share one ordered stream (w-sync replays a selected subset in exactly this
# sequence), and differ in one thing:
#   apply  — part of `--all` / `--dev`, in the order below.
#   manual — the flag exists, but `--all` never runs it: apply_bootloader picks grub
#            or limine per install type instead.
#
# name       | phase  | fn               | flag             | label              | after
rootfs        | apply  | apply_rootfs     | --rootfs         | Rootfs overlay     | -
yay           | apply  | install_yay      | --yay            | yay                | rootfs
packages      | apply  | install_packages | --packages       | Packages           | rootfs yay
# Straight after packages, and for the same reason it is a module at all: it is a
# package transaction (the locale's Firefox langpack / dictionary / man pages),
# so it belongs where the network and the sync db are already known good.
langpack      | apply  | mod_langpack     | --langpack       | Language profile   | rootfs packages
plymouth      | apply  | apply_plymouth   | --plymouth       | Plymouth           | rootfs packages
# Before the bootloader module, on purpose: this rebuild takes the GRUB fallback
# because limine-mkinitcpio-hook is not installed yet (see apply_plymouth).
bootloader    | apply  | apply_bootloader | -                | Bootloader         | rootfs packages plymouth
grub          | manual | mod_grub         | --grub           | -                  | rootfs packages plymouth
limine        | manual | mod_limine       | --limine         | -                  | rootfs packages plymouth
# Sets initramfs MODULES and rebuilds through w-mkinitcpio, which is bootloader-aware.
gpu           | apply  | mod_gpu          | --gpu            | GPU drivers        | rootfs packages bootloader
wallpaper     | apply  | mod_wallpaper    | --wallpaper      | Wallpaper          | rootfs packages
windowblind   | apply  | mod_windowblind  | --windowblind    | Window blind       | rootfs packages
greeter       | apply  | mod_greeter      | --greeter        | Greeter            | rootfs packages
hyprland      | apply  | mod_hyprland     | --hyprland       | Hyprland           | rootfs packages
polkit        | apply  | mod_polkit       | --polkit         | Polkit             | rootfs packages
hyprlock      | apply  | mod_hyprlock     | --hyprlock       | Lock screen        | rootfs packages
quickshell    | apply  | mod_quickshell   | --quickshell     | Quickshell         | rootfs packages
power         | apply  | mod_power        | --power          | Power management   | rootfs packages
# Wires the boot light into the initramfs (stamped rebuild) — bootloader-aware, same
# reason as gpu.
kbdlight      | apply  | mod_kbdlight     | --kbdlight       | Keyboard backlight | rootfs packages bootloader
nightlight    | apply  | mod_nightlight   | --nightlight     | Night light        | rootfs packages
session       | apply  | mod_session      | --session        | Session memory     | rootfs packages
# The per-user login step (w-userdirs.service) is a unit shipped by rootfs.
userdirs      | apply  | mod_userdirs     | --userdirs       | Home folders       | rootfs packages
update        | apply  | mod_update       | --update         | Updater            | rootfs packages
applets       | apply  | mod_applets      | --applets        | Tray applets       | rootfs packages
sensors       | apply  | mod_sensors      | --sensors        | Sensors            | rootfs packages
openrgb       | apply  | mod_openrgb      | --openrgb        | RGB lighting       | rootfs packages
files         | apply  | mod_files        | --files          | Files              | rootfs packages
printing      | apply  | mod_printing     | --printing       | Printing           | rootfs packages
shell         | apply  | mod_shell        | --shell          | Shell              | rootfs packages
firefox       | apply  | mod_firefox      | --firefox        | Firefox            | rootfs packages
screencapture | apply  | mod_screencapture| --screencapture  | Screen capture     | rootfs packages
sudo          | apply  | mod_sudo         | --sudo           | sudo-rs            | rootfs packages
firewall      | apply  | mod_firewall     | --firewall       | Firewall           | rootfs packages
dns           | apply  | mod_dns          | --dns            | DNS                | rootfs packages
time          | apply  | mod_time         | --time           | Network time       | rootfs packages
harden        | apply  | mod_harden       | --harden         | Hardening          | rootfs packages
# Owns the greetd PAM stack (keyring auto-unlock), so greetd has to be installed.
keyring       | apply  | mod_keyring      | --keyring        | Keyring            | rootfs packages greeter
fwupd         | apply  | mod_fwupd        | --fwupd          | Firmware updates   | rootfs packages
logs          | apply  | mod_logs         | --logs           | Log retention      | rootfs packages
mirrors       | apply  | mod_mirrors      | --mirrors        | Package mirrors    | rootfs packages
# Late by contract: it re-renders every subsystem's theme axis, so those subsystems
# must already be deployed — and its Plymouth axis rebuilds the initramfs once more,
# this time on the real bootloader.
style         | apply  | mod_style        | --style          | Style              | rootfs packages plymouth bootloader hyprland quickshell greeter
uv            | apply  | mod_uv           | --uv             | uv (Python)        | rootfs packages
# Data-driven (defaults/home-subvols): carves the per-account cache paths that ride
# outside @home snapshots. After packages so the tools whose paths it carves exist;
# nothing depends on it — a carve is a directory that happens to be a subvolume.
homesubvol    | apply  | mod_homesubvol   | --homesubvol     | Home subvolumes    | rootfs packages
ai            | apply  | mod_ai           | --ai             | AI integration     | rootfs packages
updatesys     | apply  | mod_updatesys    | --updatesys      | Update client      | rootfs packages
# After the update client, which seeds /etc/w/update.conf (SITE_REPO lives there);
# mod_site re-renders whatever the overlay touches itself, so its position relative
# to power/dns/time/logs does not matter.
site          | apply  | mod_site         | --site           | Site overlay       | rootfs packages updatesys
reset         | apply  | mod_reset        | --reset          | Config reset tool  | rootfs packages
packs         | apply  | mod_packs        | --packs          | Packs framework    | rootfs packages
# LAST on purpose: creating the root snapper config here (not first) keeps the whole
# apply snapshot-free — snap-pac has no `root` config to snapshot during the package
# installs above, so the only post-install snapshot is the `initial` anchor.
snapper       | apply  | fix_snapper      | --snapper        | Snapper            | *

# ── phase: dev ─────────────────────────────────────────────────────────────────
# Dev-VM only. Never in --all, never in the ISO build, never routed by w-sync
# (sync-map skips modules/devtools.sh explicitly). `--dev` = --all + this.
#
# name       | phase | fn           | flag        | label | after
devtools     | dev   | mod_devtools | --devtools  | -     | -
