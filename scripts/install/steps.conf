# W Linux installer — declarative step map (the wizard "orchestrator").
#
# One row per question. Fields are '|'-separated; '#' lines and blanks ignored.
# The engine (lib/tui.sh) iterates rows by index, renders a widget per `type`,
# stores the answer in ANSWERS[var], supports Back/Next, and skips a row whose
# `condition` evaluates false. Adding an option = one row here + a consumer.
#
#   id       — stable identifier (also used by the Review hub)
#   type     — widget: input | password | menu | yesno
#   var      — key written to ANSWERS[] (and serialized to install.conf)
#   title    — i18n key resolved via t() for the window title
#   prompt   — i18n key resolved via t() for the body text
#   options  — for `menu`: a function name printing "tag desc tag desc …"
#   validate — a function name called as `fn "$value"`; non-zero → re-ask
#   condition— a bash test; row shown only when it succeeds (reads ANSWERS[])
#
# id       | type     | var        | title            | prompt            | options     | validate    | condition
network    | network  | wifi       | s_net_title      | s_net_prompt      |             |             | net_has_wifi
keymap     | menu     | keymap     | s_keymap_title   | s_keymap_prompt   | km_list     | v_keymap    |
locale     | menu     | locale     | s_locale_title   | s_locale_prompt   | locale_list |             |
computer   | menu     | computer_type | s_computer_title | s_computer_prompt | computer_type_list |      |
mode       | menu     | mode       | s_mode_title     | s_mode_prompt     | mode_list   |             |
edge_repo  | input    | edge_repo  | s_edge_title     | s_edge_prompt     |             | v_edge_repo | [[ ${ANSWERS[mode]:-stable} == edge ]]
disk       | menu     | disk       | s_disk_title     | s_disk_prompt     | disk_list   |             |
encrypt    | yesno    | encrypt    | s_encrypt_title  | s_encrypt_prompt  |           |             |
luks_pass  | password | luks_pass  | s_luks_title     | s_luks_prompt     |           |             | [[ ${ANSWERS[encrypt]:-no} == yes ]]
hostname   | input    | hostname   | s_host_title     | s_host_prompt     |           | v_nonempty  |
timezone   | timezone | timezone   | s_tz_title       | s_tz_prompt       | tz_zone_list | v_timezone  |
root_pass  | password | root_pass  | s_root_title     | s_root_prompt     |           |             |
user       | input    | user       | s_user_title     | s_user_prompt     |           | v_nonempty  |
user_pass  | password | user_pass  | s_userpass_title | s_userpass_prompt |           |             |
packs      | checklist| packs      | s_packs_title    | s_packs_prompt    | packs_list  |             | packs_available
