s_edge_prompt=Подставлен официальный репозиторий W — нажмите Enter, чтобы принять, или замените своим форком (для приватного нужен логин в URL). Он клонируется сейчас для проверки доступа.
s_disk_title=Выбор диска
s_disk_prompt=Выберите целевой диск установки.\n\nНа следующем шаге — стереть диск целиком или поставить W в свободное место.
s_diskmode_title=Способ установки
s_diskmode_prompt=Свободное место — все существующие разделы (например, Windows) остаются нетронутыми; стирание УДАЛИТ ВСЕ ДАННЫЕ на диске.\n\nНет пункта «свободное место»? Сначала сожмите том Windows в «Управлении дисками»: от 40 ГиБ (40960 МБ в окне «Сжать»). BitLocker: заранее сохраните ключ восстановления.
