# ── Done ─────────────────────────────────────────────────────────────────────
done_title=Установка завершена.
done_reboot=Извлеките установочный носитель, затем перезагрузитесь.\n  Остальная настройка завершится сама при первой загрузке.
done_luks_notice=Диск зашифрован: при следующей загрузке нужно ввести пароль\n  расшифровки, заданный при установке, — без него W\n  не запустится.
done_secureboot_notice=Secure Boot и авторазблокировку диска через TPM2 (загрузка\n  без ввода пароля) включает Хаб → Security в установленной\n  системе — в этом порядке.
done_mok_notice=Secure Boot включён. Остался один шаг: при следующей загрузке\n  само откроется синее меню «Shim UEFI key management». Оно\n  добавит в прошивку ключ W (без него W не запустится) и удалит\n  отпечаток установщика — он больше не нужен. Оба шага\n  спрашивают код ниже:\n\n    1. Enroll MOK → Continue → Yes → введите код\n    2. Delete MOK → Continue → Yes → тот же код (если есть)\n    3. Reboot
done_mok_disk=Secure Boot включён. Прошивка этого компьютера не приняла\n  запрос установщика, поэтому ключ W добавьте сами — один раз,\n  код не нужен. При следующей загрузке появится «Verification\n  failed», затем синее меню «Shim UEFI key management».\n  Нажмите любую клавишу в течение 10 секунд:\n\n    1. Enroll key from disk → W_EFI → EFI → W → W-MOK.cer\n    2. Continue → Yes → Reboot\n\n  Не успели — просто перезагрузитесь, меню появится снова.\n  Никогда не выбирайте «Reset MOK» — он стирает все ключи.
done_mok_code=Одноразовый код:
done_mok_fallback=Код при вводе не отображается. Уложитесь в 5 минут, иначе\n  компьютер перезагрузится и запрос пропадёт. Никогда не\n  выбирайте «Reset MOK» — он стирает все ключи.\n\n  Запрос пропал? После «Verification failed» нажмите любую\n  клавишу в течение 10 с, затем: Enroll key from disk → W_EFI →\n  EFI → W → W-MOK.cer → Continue → Yes → Reboot (без кода).
done_sb_tpm_notice=После этого диск открывается сам (TPM2); пароль понадобится,\n  только если изменится цепочка загрузки.
done_sb_luks_notice=Пароль диска по-прежнему спрашивается при каждой загрузке.\n  Авторазблокировку через TPM2 можно добавить позже:\n  sudo w-crypt enroll-tpm
reboot=Перезагрузить

