firstboot_title=Настройка завершена.
firstboot_done=Автоматическая перезагрузка через несколько секунд.\n  Нажмите «Перезагрузить», чтобы продолжить сейчас.
firstboot_failed=Ошибка настройки при первой загрузке. Проверьте лог:
