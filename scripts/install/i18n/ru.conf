s_net_title=Wi-Fi
s_net_prompt=Выберите сеть Wi-Fi для подключения (нужно, чтобы скачать пакеты сейчас и после перезагрузки), или пропустите при проводном подключении:
s_keymap_title=Раскладка клавиатуры
s_keymap_prompt=Выберите консольную раскладку клавиатуры.\n\nЭтой раскладкой вводится пароль-фраза диска при каждой загрузке — выберите ту, что соответствует вашей физической клавиатуре.
s_locale_title=Системная локаль
s_locale_prompt=Выберите язык/локаль системы (LANG). Английский всегда остаётся запасным.
s_computer_title=Тип компьютера
s_computer_prompt=Это ноутбук или десктоп?\n\nОт этого зависит профиль питания: ноутбук получает таймеры простоя/сна с учётом батареи, действия крышки и авто-переключение схемы питания; десктоп — мягкие дефолты без батарейных настроек. Ниже — автоопределение, позже сменить можно через 'w-power mode'.
s_computer_laptop=Ноутбук
s_computer_desktop=Десктоп
s_mode_title=Канал обновлений
s_mode_prompt=Как эта система будет получать обновления W?\n\nEdge = отслеживать git-репозиторий W и тянуть обновления напрямую, со снапшотом перед каждым. На время беты это единственный канал.\n\nStable (подписанный пакет из репозитория W) пока недоступен.
s_mode_stable=Stable
s_mode_edge=Edge
