LABEL arch
TEXT HELP
Boot the W Linux install medium on BIOS.
It allows you to install W Linux or perform system maintenance.
ENDTEXT
MENU LABEL W Linux install medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 systemd.show_status=auto rd.systemd.show_status=auto rd.udev.log_level=3 vt.global_cursor_default=0

# Verbose boot — no Plymouth splash, full kernel/systemd log on the console.
# Useful for diagnosing boot failures on real hardware (see installer.md).
LABEL archverbose
TEXT HELP
Boot the W Linux install medium on BIOS with verbose (non-splash) console output.
ENDTEXT
MENU LABEL W Linux install medium (%ARCH%, BIOS) ^verbose
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the W Linux install medium on BIOS with speakup screen reader.
It allows you to install W Linux or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL W Linux install medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on
