# Adds the plymouth hook to archiso's own HOOKS line (same "after kms" placement
# apply.sh's mod_plymouth uses on the installed target — see package-plymouth.md).
# Sorts after archiso.conf (zz- prefix) so mkinitcpio picks up this full HOOKS=
# override rather than the upstream one.
HOOKS=(base udev microcode modconf kms plymouth memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
