# W Linux ISO — live console font.
#
# Without this the VT runs the kernel's built-in default8x16 (256 glyphs, Latin
# only) and the kernel silently maps every missing character onto a Latin
# look-alike — so the installer's own language menu rendered "Русский" as
# "Russkiy". The menu is drawn BEFORE a language is chosen, so the per-language
# `_console_font` in scripts/install/i18n/*.conf cannot fix it: by the time we
# know the language, the transliterated menu is already on screen.
#
# LatArCyrHeb-16 ships with `kbd` (always present, on the ISO and on an installed
# system alike) and covers Latin + Cyrillic + Hebrew + Arabic — every language
# the installer dictionaries currently offer. scripts/install.sh loads the same
# font best-effort as well, for the case where the installer is run from an
# already-installed machine's VT rather than from this image.
#
# KEYMAP is deliberately absent: the live layout stays us until the wizard's
# keymap step calls loadkeys (v_keymap in scripts/install/lib/system.sh).
FONT=LatArCyrHeb-16
