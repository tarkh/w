# release.conf — W Linux release manifest (metadata, NOT the update trigger).
#
# update-system.md axis 1+2. The trigger is the git tag (edge) / pkgver (stable),
# never a hand-written number here. This file only carries per-release metadata that
# w-sync reads AFTER pulling, to decide how to apply:
#
#   REQUIRES_REBOOT     yes → w-sync offers a reboot once the apply finishes.
#   REQUIRES_FULL_APPLY yes → w-sync runs `apply.sh --all` instead of a selective
#                             apply (use when a change spans modules in ways the
#                             sync-map cannot capture).
#   MIN_FROM_VERSION    hard floor for the stable channel (phase 7 migrations);
#                       edge ignores it. Below it, an update refuses rather than
#                       partially migrating.
#
# Signing, cumulative alpm migrations and drift detection land in phase 7.

REQUIRES_REBOOT=no
REQUIRES_FULL_APPLY=no
MIN_FROM_VERSION=0.1.0
