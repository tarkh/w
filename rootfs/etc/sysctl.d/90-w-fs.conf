# W Linux — filesystem hardening (security.md, point A)
# Toggled as a whole by `w-kernel harden on|off`.

# Block symlink/hardlink TOCTOU attacks in world-writable dirs (e.g. /tmp).
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
# Block unprivileged writes to FIFOs/regular files in sticky world-writable dirs.
fs.protected_fifos = 2
fs.protected_regular = 2
