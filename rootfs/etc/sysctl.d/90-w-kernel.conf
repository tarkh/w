# W Linux — kernel hardening (security.md, point A)
# Toggled as a whole by `w-kernel harden on|off`. Raw values here = source of truth.

# Hide kernel pointers from unprivileged users (defeats KASLR-leak primitives).
kernel.kptr_restrict = 2
# Restrict dmesg to root — kernel log leaks addresses and crash details.
kernel.dmesg_restrict = 1
# Disable kexec — blocks loading a replacement kernel at runtime.
kernel.kexec_load_disabled = 1
# ptrace only on direct children (yama) — blocks cross-process memory scraping.
kernel.yama.ptrace_scope = 1
# No unprivileged BPF — large kernel attack surface.
kernel.unprivileged_bpf_disabled = 1
# Hide perf subsystem from unprivileged users.
kernel.perf_event_paranoid = 3
# Full ASLR.
kernel.randomize_va_space = 2

# NOTE: unprivileged user namespaces are intentionally NOT disabled here —
# bubblewrap/Flatpak require them (security.md point Г). Do not add
# kernel.unprivileged_userns_clone=0.
