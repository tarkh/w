# W Linux — DNS-over-TLS reliability (security.md, point Е). Owned by mod_dns,
# NOT part of the `w-kernel harden` profile: this is plumbing, not hardening.
#
# systemd-resolved opens its DoT streams with TCP Fast Open (the TLS ClientHello
# rides inside the SYN). On some paths (seen on a MacBook's BCM4360/wl Wi-Fi
# behind a home router, 2026-09) such streams finish the handshake and then
# blackhole every client byte: the kernel never notices (the SYN-ACK did arrive,
# so TFO blackhole detection does not fire) and ~1 stream in 5 still works, so
# resolved never degrades the server to plain DNS — every lookup just times out
# (pacman: "Resolving timed out after 10000 milliseconds" on every mirror).
# Nothing else on a W desktop uses client-side TFO, so it is off system-wide.
net.ipv4.tcp_fastopen = 0
