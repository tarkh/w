# W Linux — pinned Firefox profile (apply.sh --firefox).
# A single, fixed profile `w.default` so the W theme axis writes userChrome.css to a
# deterministic path (~/.mozilla/firefox/w.default/chrome/). The session env sets
# MOZ_LEGACY_PROFILES=1 (env-hyprland) so Firefox honours this Default=1 selection
# instead of creating its own per-install `*.default-release`.
[General]
StartWithLastProfile=1
Version=2

[Profile0]
Name=W
IsRelative=1
Path=w.default
Default=1
