# W Linux — hyprlock lock screen
#
# Brand colors + scale-aware geometry come from the active theme: w-style renders
# hyprlock-colors.conf ($w_lock_* variables) from the theme's theme.conf/font.conf
# and the primary output's live scale (see 100-hyprlock/module.sh). Edit colors
# there, not here. hyprlock reads this config fresh on every lock, so a theme or
# scale change is picked up at the next lock automatically (no reload needed).
source = ~/.config/hypr/hyprlock-colors.conf

# ── General ───────────────────────────────────────────────────────────────────
general {
  hide_cursor = true
  # Background screenshot capture: 0 = GPU-accelerated (fast, default). NEVER set
  # 1 (CPU readback) — it stalls on high-res outputs (4K). The screencopy grab and
  # the dual-Kawase blur both stay on the GPU, so the lock appears instantly.
  screencopy_mode = 0
  # Draw widgets immediately instead of waiting on resources — snappier lock.
  immediate_render = true
  fail_timeout = 2000
}

# ── Authentication ────────────────────────────────────────────────────────────
# Password (PAM) is always enabled and always works. Fingerprint runs in PARALLEL
# via fprintd over D-Bus (hyprlock's native integration, not PAM) — it activates
# only once a finger is enrolled (`fprintd-enroll`); with no reader/enrollment the
# thread stays silent and the password path is unaffected. See package-hyprlock.md.
auth {
  pam:enabled = true
  pam:module = hyprlock
  fingerprint:enabled = true
  fingerprint:ready_message = Scan fingerprint or enter password
  fingerprint:present_message = Scanning fingerprint…
}

# ── Animations ────────────────────────────────────────────────────────────────
# The lock fades in over the live frame: the background is a blurred screenshot,
# so fadeIn reads as the workspace softly going blurry. Mirrored on fadeOut.
animations {
  enabled = true
  bezier = wOut, 0.16, 1, 0.3, 1
  animation = fadeIn, 1, 3, wOut
  animation = fadeOut, 1, 3, wOut
}

# ── Background ────────────────────────────────────────────────────────────────
# Per-monitor screenshot taken at lock, GPU-blurred (dual-Kawase). `blur_passes`
# is kept small for a light blur and an instant appearance even on 4K. The fallback
# color ($w_lock_bg) shows only if the screenshot is unavailable.
background {
  monitor =
  path = screenshot
  color = $w_lock_bg
  blur_passes = 2
  blur_size = 6
  noise = 0.0117
  contrast = 0.9
  brightness = 0.8
  vibrancy = 0.17
  vibrancy_darkness = 0.05
}

# ── Clock ─────────────────────────────────────────────────────────────────────
# monitor = $w_lock_primary scopes this to the primary output only (see
# hyprlock-colors.conf) — background stays on every screen, but the interactive/
# informational widgets don't mirror onto secondary monitors.
label {
  monitor = $w_lock_primary
  text = $TIME
  color = $w_lock_text
  font_size = $w_lock_clock_size
  font_family = $w_lock_font_family
  shadow_passes = 2
  shadow_size = 4
  shadow_color = rgba(0, 0, 0, 0.6)
  position = $w_lock_clock_pos
  halign = center
  valign = center
}

# ── Date ──────────────────────────────────────────────────────────────────────
label {
  monitor = $w_lock_primary
  text = cmd[update:60000] date +"%A, %d %B"
  color = $w_lock_text_dim
  font_size = $w_lock_date_size
  font_family = $w_lock_font_family
  shadow_passes = 2
  shadow_size = 3
  shadow_color = rgba(0, 0, 0, 0.6)
  position = $w_lock_date_pos
  halign = center
  valign = center
}

# ── Password input ────────────────────────────────────────────────────────────
# Minimal field in the brand colors. capslock_color warns when Caps Lock is on so
# a wrong-case password doesn't silently fail; check/fail colors signal auth state.
input-field {
  monitor = $w_lock_primary
  size = $w_lock_field_size
  outline_thickness = $w_lock_field_outline
  rounding = $w_lock_rounding
  dots_size = 0.22
  dots_spacing = 0.3
  dots_center = true

  inner_color = $w_lock_inner
  outer_color = $w_lock_outer
  font_color = $w_lock_font
  font_family = $w_lock_font_family
  check_color = $w_lock_check
  fail_color = $w_lock_fail
  capslock_color = $w_lock_caps

  fade_on_empty = false
  placeholder_text = <i>Password</i>
  fail_text = <i>$FAIL ($ATTEMPTS)</i>

  position = $w_lock_field_pos
  halign = center
  valign = center
}

# ── Keyboard layout ───────────────────────────────────────────────────────────
# Shows which layout is active (us/ru) so the password is typed in the right one.
label {
  monitor = $w_lock_primary
  text = $LAYOUT[en, ru]
  color = $w_lock_text_dim
  font_size = $w_lock_layout_size
  font_family = $w_lock_font_family
  shadow_passes = 2
  shadow_size = 3
  shadow_color = rgba(0, 0, 0, 0.6)
  position = $w_lock_layout_pos
  halign = center
  valign = center
}
