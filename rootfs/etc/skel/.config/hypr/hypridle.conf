# W Linux — GENERATED by w-power (idle set: ac). Do NOT edit; change timers with
# 'w-power idle <ac|bat> <display|lock|suspend> <sec>' (or the Hub Power panel), or set
# the machine mode with 'w-power mode <laptop|desktop>'. See w-power.md.
#
# This is the desktop-preset baseline shipped in /etc/skel; w-power re-renders the live
# file per machine mode at first boot (apply.sh --power) and whenever timers change.

general {
  # Single hyprlock instance; lock the session on idle and before sleep. The
  # scope keeps the lock screen out of hypridle's cgroup, so restarting hypridle
  # cannot kill it — see the same line (and the reasoning) in w-power's renderer.
  # The DPMS-on before hyprlock ensures a valid screenshot (not black) when the
  # display was already blanked. The plain-hyprlock fallback runs only when the
  # scope launcher itself failed (rc=1), never when hyprlock ran and died
  # (rc >= 128): a crash on exit must not re-lock the session just unlocked.
  # The flags come from 'w-power _lock-flags': a lock that happens inside a
  # suspend already in flight gets --no-fade-in, so the freeze cannot land
  # mid-animation and replay the rest of it over the woken desktop. The answer
  # is validated rather than trusted: anything unexpected becomes empty, which
  # is the behaviour from before the flag existed.
  lock_cmd = f=$(w-power _lock-flags 2>/dev/null); [ "$f" = --no-fade-in ] || f=; hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && sleep 0.1 && pidof hyprlock || systemd-run --user --scope --unit=w-lock --quiet --collect hyprlock $f || [ $? -ge 128 ] || hyprlock $f
  # Lock before sleep. hypridle holds its own logind delay inhibitor and, in
  # mode 3, releases it only once the compositor reports the session locked —
  # which hyprlock does only AFTER its screenshot is captured (immediate_render
  # = false in hyprlock.conf). Never wrap this in systemd-inhibit: logind refuses
  # new delay inhibitors once the sleep is in flight, and the refused wrapper
  # never runs its command. See the same lines (and the reasoning) in w-power.
  inhibit_sleep = 3
  before_sleep_cmd = loginctl lock-session
  # Turn DPMS back on after waking (avoids a dead screen until a keypress).
  after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Turn the display off after 900 s of inactivity; back on when activity resumes.
listener {
  timeout = 900
  on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
  on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Blank the display 30 s after a MANUAL lock ($mod+L). A manual lock follows activity,
# so the idle clock starts at the lock — this catches it where the idle blank above
# can't. Gated on hyprlock so 30 s of ordinary idle never blanks: acts only while locked.
listener {
  timeout = 30
  on-timeout = pidof hyprlock && hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
  on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
