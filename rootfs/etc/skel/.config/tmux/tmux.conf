# W Linux — tmux. Behaviour only; colors are rendered by the w-style `tmux` axis
# into w-colors.conf (sourced at the end). Truecolor passthrough so the W palette
# survives inside tmux.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,ghostty:Tc,xterm-ghostty:Tc"

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g history-limit 50000
setw -g mode-keys vi

set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-left " #S "
set -g status-right " %a %d %b  %H:%M "

# Theme colors (generated by w-style; -q so a fresh checkout without a render
# still starts cleanly).
source-file -q ~/.config/tmux/w-colors.conf
