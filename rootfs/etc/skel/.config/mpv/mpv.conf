# W Linux — mpv behaviour. Colours, OSD tint and the audio spectrogram
# visualizer come from the theme via the included fragment (rendered by
# `w-style apply mpv` → ~~/w-theme.conf). Edit behaviour here; never colours.

# ── Video output ──────────────────────────────────────────────────────────────
# gpu-next is high-quality by default (no gpu-hq profile needed).
vo=gpu-next
gpu-context=wayland
hwdec=auto-safe

# ── UI / session ──────────────────────────────────────────────────────────────
osc=yes
keep-open=yes
save-position-on-quit=yes
cursor-autohide=1000
force-window=yes

# ── Audio ─────────────────────────────────────────────────────────────────────
volume=100
volume-max=130

# Theme fragment: OSD palette + brand-coloured audio spectrogram (auto-profile).
# `~~/` is mpv's own config directory (~/.config/mpv).
include=~~/w-theme.conf
