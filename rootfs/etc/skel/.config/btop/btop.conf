# W Linux — btop. Behaviour only; the theme is rendered by the w-style `btop`
# axis into themes/w.theme. theme_background=False keeps btop transparent over
# the Ghostty blur.
color_theme = "w"
theme_background = False
truecolor = True
force_tty = False
vim_keys = True
rounded_corners = True
graph_symbol = "braille"
update_ms = 1500
