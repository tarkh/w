# W Linux — Foot terminal (fallback terminal; Ghostty is the primary surface).
# Colours + background opacity live in themes/w, generated by w-style from the
# active theme's theme.conf / effects.conf. `include` is a GLOBAL directive: it
# must precede every [section] header (foot parses it as a section key otherwise),
# so the generated palette/opacity is pulled in first, here at the top.
include=~/.config/foot/themes/w

# ── Font (family + size patched by `w-style apply font` from the theme's font.conf) ──
# JetBrainsMono Nerd Font carries the powerline + icon glyphs used by the prompt/eza.
[main]
font=JetBrainsMono Nerd Font:size=11
# Breathing room — matches Ghostty's window-padding-x/y (10x6).
pad=10x6 center
# Point size is authoritative; don't rescale by monitor DPI (keeps parity with Ghostty).
dpi-aware=no

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes
