# W Linux — greeter idle management (greetd login session).
#
# Runs inside the minimal greeter Hyprland (exec-once in /etc/greetd/hyprland.lua),
# separate from the user session's hypridle (~/.config/hypr/hypridle.conf). The login
# screen has nothing to lock — there is no unlocked session yet — so this config does
# ONE thing: blank the display after idle to save power while the greeter waits, and
# restore it on activity. No lock_cmd / before_sleep_cmd on purpose.

general {
  # Wake the display on resume without needing an extra keypress.
  after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Blank the displays after 2 minutes of inactivity at the login screen; restore on
# any input. Tune the timeout (seconds) to taste.
listener {
  timeout = 120
  on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
  on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
