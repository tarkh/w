<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  W Linux — per-language fallback bindings. Shipped verbatim by apply_rootfs.

  NOT theme material, which is why this is a static file and not something
  w-style renders: /etc/fonts/local.conf is the THEME's font axis (it carries
  W_FONT_UI / W_FONT_MONO and is rewritten on every theme switch), while the
  rules below are script-coverage hygiene that is true for every theme.

  ── Why this file exists (measured on a ru VM, 2026-09-10) ──

  With noto-fonts-cjk installed and nothing else said, EVERY CJK language
  resolved to `Noto Sans CJK KR`:

      fc-match -s "sans-serif:lang=ja"    → Noto Sans CJK KR
      fc-match -s "sans-serif:lang=zh-cn" → Noto Sans CJK KR

  That is not a missing-glyph bug — the text renders — but Han characters are
  UNIFIED in Unicode while their printed forms are not, so Japanese and Chinese
  came out drawn in Korean shapes. Native readers see that immediately. The
  package ships no language ordering of its own (conf.avail carries only the
  generic 46/66-noto-{sans,serif}.conf), so the binding has to be stated here.

  Arabic had a smaller version of the same problem: the winner was `Noto Kufi
  Arabic`, a display face, where body text wants `Noto Sans Arabic`.

  ── Why `prepend_first`, and not plain `prepend` ──

  This cost a live debugging round, so it is written down. `mode="prepend"`
  inserts before the element that SATISFIED the test — here the literal
  `sans-serif` token — while `<alias><prefer>` prepends before that same token
  too. fontconfig's own 65-nonlatin.conf already prefers `Noto Sans CJK KR` (it
  is the hangul entry of one big list), and it sorts before this file, so with a
  plain `prepend` our JP/SC/TC families landed BEHIND KR and nothing changed:
  every CJK language still matched face index 1 of the shared .ttc. Measured, not
  assumed — `fc-match -f "idx=%{index} %{family}\n" "sans-serif:lang=ja"` said
  `idx=1 Noto Sans CJK KR` before, `idx=0 Noto Sans CJK JP` after.

  `prepend_first` puts the family at the very front of the list instead. Arabic
  happened to work either way (Noto Sans Arabic is its own file, not a face in a
  shared collection), which is exactly the kind of half-success that hides the
  bug — hence the per-language verification above.

  Latin and Cyrillic are untouched: these rules only fire on a pattern that
  carries the matching lang, so `sans-serif:lang=en|ru` still resolves to Inter
  and `monospace` to JetBrains Mono (verified on the same run). Numbered 65 so it
  sits with the other script-ordering files, after 60-latin.conf.
-->
<fontconfig>

  <!-- Han unification: bind each language to its own regional subfamily. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="weak"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="weak"><string>Noto Serif CJK JP</string></edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="weak"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="weak"><string>Noto Serif CJK KR</string></edit>
  </match>

  <!-- Simplified Chinese: mainland + Singapore. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="weak"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="weak"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-sg</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="weak"><string>Noto Sans CJK SC</string></edit>
  </match>

  <!-- Traditional Chinese: Taiwan, and Hong Kong which has its own subfamily. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="weak"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="weak"><string>Noto Serif CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="weak"><string>Noto Sans CJK HK</string></edit>
  </match>

  <!-- Arabic script: the body face, not the Kufi display face. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="weak"><string>Noto Sans Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>fa</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="weak"><string>Noto Sans Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ur</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="weak"><string>Noto Sans Arabic</string></edit>
  </match>

</fontconfig>
