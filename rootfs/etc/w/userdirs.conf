# /etc/w/userdirs.conf — W Linux standard home folders: the ADMIN layer.
#
# This file holds DEVIATIONS ONLY. W's own defaults live one layer below, in
# /usr/share/w/defaults/userdirs.conf, and the update overwrites that file freely
# because nobody's edits are in it — which is exactly how improved defaults
# reach an installed machine. Anything set here wins over it, and the update
# never touches this file (ownership class `override` in userdirs.manifest).
#
#   vendor  /usr/share/w/defaults/userdirs.conf   shipped, W-owned, overwritten
#   admin   THIS FILE                             this machine's defaults
#   user    ~/.config/w/userdirs.conf             where the setting normally goes
#
# Inspect the result and where every value came from:  w-conf cat userdirs
#
# The one key is user-scope (see userdirs.schema): the folders belong to one
# account and are renamed by that account's own login step, so the GUI and the
# CLI write the USER layer, not this one. Setting it here gives the machine a
# different starting point for users who have not chosen for themselves; it
# does not lock anything. To mandate a value across a fleet, use policy.d
# (`w-conf` explains the lock to whoever runs into it).
#
# WHICH folders exist and what they are called is not here at all — that is
# xdg-user-dirs' own /etc/xdg/user-dirs.defaults, shipped by W.
