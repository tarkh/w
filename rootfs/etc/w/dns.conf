# /etc/w/dns.conf — W Linux dns: the ADMIN layer.
#
# DEVIATIONS ONLY. W's own defaults live one layer below, in
# /usr/share/w/defaults/dns.conf, which every update overwrites freely because
# nobody's edits are in it — that is how improved defaults and new keys reach an
# installed machine. Anything set here wins over them, and the update never
# touches this file (ownership class `override`).
#
#   vendor  /usr/share/w/defaults/dns.conf   W-owned, overwritten by updates
#   admin   THIS FILE                        this machine's decisions
#
# See the effective result and where each value came from:  w-conf cat dns
# Which keys a user may override: /usr/share/w/defaults/dns.schema
#
# Switch with `sudo w-dns provider <name>` / `sudo w-dns on|strict|off`.
# Add a site-specific resolver as DNS_<name>="IP#tls-hostname …" here — it merges
# with the vendor catalog instead of replacing it, and survives every update.
