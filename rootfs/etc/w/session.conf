# /etc/w/session.conf — W Linux session memory: the ADMIN layer.
#
# This file holds DEVIATIONS ONLY. W's own defaults live one layer below, in
# /usr/share/w/defaults/session.conf, and the update overwrites that file freely
# because nobody's edits are in it — which is exactly how improved defaults
# reach an installed machine. Anything set here wins over it, and the update
# never touches this file (ownership class `override` in session.manifest).
#
#   vendor  /usr/share/w/defaults/session.conf   shipped, W-owned, overwritten
#   admin   THIS FILE                            this machine's defaults
#   user    ~/.config/w/session.conf             where the settings normally go
#
# Inspect the result and where every value came from:  w-conf cat session
#
# All four keys are user-scope (see session.schema): the subsystem reads one
# user's window list, writes one user's snapshot and runs one user's daemon, so
# the GUI and the CLI write the USER layer, not this one — nothing here needs
# root and nothing here needs polkit. Setting a key in this file gives the
# machine a different starting point for users who have not chosen for
# themselves; it does not lock anything. To actually mandate a value across a
# fleet (a kiosk that must always come up clean, say), use policy.d — that layer
# locks the setters, this one does not.
#
# Prefer the CLI over hand-editing: `w-session mode restore` also restarts the
# snapshot daemon, so the change takes effect now instead of at the next login.
#
# To change the DISTRO defaults (what every machine gets), edit the vendor file
# in rootfs/usr/share/w/defaults/session.conf — not this file. See w-session.md.
