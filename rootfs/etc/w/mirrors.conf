# /etc/w/mirrors.conf — W Linux package mirrors: the ADMIN layer.
#
# DEVIATIONS ONLY. W's own defaults live one layer below, in
# /usr/share/w/defaults/mirrors.conf, which every update overwrites freely because
# nobody's edits are in it — that is how improved defaults and new keys reach an
# installed machine. Anything set here wins over them, and the update never
# touches this file (ownership class `override`).
#
#   vendor  /usr/share/w/defaults/mirrors.conf   W-owned, overwritten by updates
#   admin   THIS FILE                            this machine's decisions
#
# See the effective result and where each value came from:  w-conf cat mirrors
#
# Change it with `sudo w-mirrors set <key> <value>` rather than by hand — that
# validates the value and tells you what the next ranking run will do with it.
#
# NOTE: this file is the policy, not the list. The list itself is
# /etc/pacman.d/mirrorlist, which `w-mirrors rank` rebuilds from this policy.
