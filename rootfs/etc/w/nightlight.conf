# /etc/w/nightlight.conf — W Linux night light: the ADMIN layer.
#
# This file holds DEVIATIONS ONLY. W's own defaults live one layer below, in
# /usr/share/w/defaults/nightlight.conf, and the update overwrites that file
# freely because nobody's edits are in it — which is exactly how improved
# defaults reach an installed machine. Anything set here wins over it, and the
# update never touches this file (ownership class `override` in
# nightlight.manifest).
#
#   vendor  /usr/share/w/defaults/nightlight.conf   shipped, W-owned, overwritten
#   admin   THIS FILE                               this machine's defaults
#   user    ~/.config/w/nightlight.conf             where the settings normally go
#
# Inspect the result and where every value came from:  w-conf cat nightlight
#
# All six keys are user-scope (see nightlight.schema), so the GUI and the CLI
# write the USER layer, not this one — nothing here needs root, and nothing here
# needs polkit. Setting a key in this file gives the machine a different starting
# point for users who have not chosen for themselves; it does not lock anything.
# To actually mandate a value across a fleet, use policy.d — that layer locks the
# setters, this one does not.
#
# Prefer the CLI over hand-editing: `w-nightlight mode schedule` also re-renders
# ~/.config/hypr/hyprsunset.conf and restarts the daemon, which is where the
# setting actually takes effect.
#
# To change the DISTRO defaults (what every machine gets), edit the vendor file in
# rootfs/usr/share/w/defaults/nightlight.conf — not this file. See w-nightlight.md.
