# /etc/w/crypt.conf — W Linux crypt: the ADMIN layer.
#
# DEVIATIONS ONLY. W's own defaults live one layer below, in
# /usr/share/w/defaults/crypt.conf, which every update overwrites freely because
# nobody's edits are in it — that is how improved defaults and new keys reach an
# installed machine. Anything set here wins over them, and the update never
# touches this file (ownership class `override`).
#
#   vendor  /usr/share/w/defaults/crypt.conf   W-owned, overwritten by updates
#   admin   THIS FILE                        this machine's decisions
#
# See the effective result and where each value came from:  w-conf cat crypt
# Which keys a user may override: /usr/share/w/defaults/crypt.schema
#
# Change it with a `w-crypt` command where one exists; after a hand edit re-run the
# relevant `w-crypt` command so the change is actually enrolled.
