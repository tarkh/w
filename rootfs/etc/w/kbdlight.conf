# /etc/w/kbdlight.conf — W Linux keyboard backlight: the ADMIN layer.
#
# This file holds DEVIATIONS ONLY. W's own defaults live one layer below, in
# /usr/share/w/defaults/kbdlight.conf, and the update overwrites that file freely
# because nobody's edits are in it — which is exactly how improved defaults reach
# an installed machine. Anything set here wins over it, and the update never
# touches this file (ownership class `override` in kbdlight.manifest).
#
#   vendor  /usr/share/w/defaults/kbdlight.conf   shipped, W-owned, overwritten
#   admin   THIS FILE                             this machine's decisions
#   user    ~/.config/w/kbdlight.conf             per-user key step
#
# Inspect the result and where every value came from:  w-conf cat kbdlight
# Which keys a user may override is declared in
# /usr/share/w/defaults/kbdlight.schema.
#
# Prefer the CLI over hand-editing — `sudo w-kbdlight boot 50` also rebuilds the
# initramfs, which is the only place the boot level actually lives.
#
# To change the DISTRO defaults (what every machine gets), edit the vendor file in
# rootfs/usr/share/w/defaults/kbdlight.conf — not this file. See w-kbdlight.md.
#
# Turning the light off after N seconds of inactivity is NOT here: it is a link of
# the idle policy and lives in the power subsystem —
#   sudo w-power idle ac  kbdlight 120
#   sudo w-power idle bat kbdlight 30
