# /etc/w/logs.conf — W Linux logs: the ADMIN layer.
#
# DEVIATIONS ONLY. W's own defaults live one layer below, in
# /usr/share/w/defaults/logs.conf, which every update overwrites freely because
# nobody's edits are in it — that is how improved defaults and new keys reach an
# installed machine. Anything set here wins over them, and the update never
# touches this file (ownership class `override`).
#
#   vendor  /usr/share/w/defaults/logs.conf   W-owned, overwritten by updates
#   admin   THIS FILE                        this machine's decisions
#
# See the effective result and where each value came from:  w-conf cat logs
# Which keys a user may override: /usr/share/w/defaults/logs.schema
#
# Change it with `sudo w-logs keep <days>` / `sudo w-logs limit <size>` rather than
# by hand — those validate the value and re-render every logging node.
