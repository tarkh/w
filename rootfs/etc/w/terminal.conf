# /etc/w/terminal.conf — W Linux terminal: the ADMIN layer.
#
# DEVIATIONS ONLY. W's own defaults live one layer below, in
# /usr/share/w/defaults/terminal.conf, which every update overwrites freely because
# nobody's edits are in it — that is how improved defaults and new keys reach an
# installed machine. Anything set here wins over them, and the update never
# touches this file (ownership class `override`).
#
#   vendor  /usr/share/w/defaults/terminal.conf   W-owned, overwritten by updates
#   admin   THIS FILE                        this machine's decisions
#
# See the effective result and where each value came from:  w-conf cat terminal
# Which keys a user may override: /usr/share/w/defaults/terminal.schema
#
# Set the machine-wide terminal here; a USER picks their own with `w-term set <name>`,
# which writes ~/.config/w/terminal.conf and wins over this file.
