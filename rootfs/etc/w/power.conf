# /etc/w/power.conf — W Linux power policy: the ADMIN layer.
#
# This file holds DEVIATIONS ONLY. W's own defaults live one layer below, in the
# generated /usr/share/w/defaults/power.conf (written by w-power from the preset
# table for this machine's MODE), and the update overwrites that file freely
# because nobody's edits are in it — which is exactly how improved defaults reach
# an installed machine. Anything set here wins over it, and the update never
# touches this file (ownership class `override` in power.manifest).
#
#   vendor  /usr/share/w/defaults/power.conf   generated, W-owned, overwritten
#   admin   THIS FILE                          this machine's decisions
#   user    ~/.config/w/power.conf             per-user idle overrides
#
# Inspect the result and where every value came from:  w-conf cat power
# Which keys a user may override is declared in /usr/share/w/defaults/power.schema.
#
# Prefer the CLI over hand-editing (it validates, re-renders logind/hypridle and
# re-applies the charge limit): `sudo w-power lid ac lock`, `sudo w-power
# charge-limit 80`, `sudo w-power mode laptop`, `sudo w-power power-key menu`.
# After a hand edit run `sudo w-power apply`.
#
# To change the DISTRO defaults (what every machine gets), edit preset_sys() /
# preset_idle() in rootfs/usr/bin/w-power — not this file. See w-power.md.

# Machine mode — the preset selector (laptop|desktop). mod_power sets it once at
# first boot from the installer answer / chassis detection; `w-power mode` changes
# it later. It lives here rather than in the vendor layer because it is a fact
# about THIS machine — and because it is the input that generates that layer.
MODE=desktop
