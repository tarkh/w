# /etc/w/ai.conf — W Linux AI assistant: the ADMIN layer.
#
# DEVIATIONS ONLY — the machine-wide choices. W's defaults (including the
# PROVIDER_ENV_* map and every per-tool W_AI_TOOL_* switch) live one layer below
# in /usr/share/w/defaults/ai.conf, which the update overwrites freely; this file
# the update never touches.
#
#   vendor  /usr/share/w/defaults/ai.conf   W-owned, overwritten by updates
#   admin   THIS FILE                       this machine's decisions (root)
#   user    ~/.config/w/ai.conf             per-user (written by `w-ai profile use`)
#   user    ~/.config/w/ai-features.conf    ai-extra toggles, survive a profile switch
#
# Effective result and the origin of every value:  w-conf cat ai
# Who may set what: /usr/share/w/defaults/ai.schema
#
# Prefer the CLI: `w-ai profile use <name>` (per user), `w-ai key set <provider>`
# (keyring, never a file). Set a machine-wide provider/model here only if every
# account on this machine should default to it.
#
# Secrets NEVER live in this file.
