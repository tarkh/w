# ╔════════════════════════════════════════════════════════════════════════════╗
# ║  W Linux — Theme Source of Truth                                            ║
# ║  Single place that defines every color in the system.                      ║
# ║  Edit here, then run `w-style apply all` to propagate everywhere.           ║
# ╚════════════════════════════════════════════════════════════════════════════╝
#
# Consumed by `w-style`, which renders this into every subsystem:
#   Hyprland · Ghostty · GRUB · Plymouth
#
# This file is also the STRUCTURAL TEMPLATE for generated themes: `w-theme new`
# extracts a palette from a wallpaper and emits exactly this token set with the
# pigments replaced, so anything added here reaches generated themes too.
#
# ── Tier contract (enforced by `check.sh --theme`) ────────────────────────────
#   W_PALETTE_*   Tier 1 — raw pigments. The ONLY place hex literals may appear
#                 (a pigment may also alias an earlier pigment, e.g. the ANSI
#                 magenta of this theme is the brand vivid). Every pigment must
#                 have at least one consumer — no dead ink.
#   W_<ROLE>      Tier 2 — semantic roles. Reference Tier 1 only, never raw hex.
#                 Nesting is expressed by suffixes:
#                   W_SURFACE → W_SURFACE_VARIANT → W_SURFACE_DIM
#                   W_PRIMARY → W_PRIMARY_CONTAINER
#   W_<COMPONENT>_*  Tier 3 — component tokens (terminal ANSI, Quickshell, GTK…).
#                 Reference Tier 2 (preferred), a sibling Tier 3 token, or a
#                 Tier 1 pigment where no semantic role exists for it (the ANSI
#                 hue wheel and the shell syntax roles are exactly that case).
#
# ── Pigment naming ───────────────────────────────────────────────────────────
# Names denote ROLE, not hue, and stay correct in a light theme:
#   SURFACE_0..3   background ramp, 0 = canvas … 3 = most raised
#   ACCENT / VIVID brand accent and secondary accent (each ±_CONTAINER/_SOFT/_INK)
#                  _CONTAINER FILLS a shape, _INK is DRAWN ON one (outline, label,
#                  icon) and is held at 4.5:1 against the raised card. One pigment
#                  cannot do both jobs: a container sits close to its surface by
#                  design, which is exactly what makes it illegible as a line.
#   TEXT_*         foreground tones, BRIGHT → TEXT → DIM → FAINT
#   DANGER_*       critical axis, deliberately off-brand
#   HUE_*          the ANSI hue wheel (RED/GREEN/YELLOW/BLUE/CYAN/MAGENTA ±BRIGHT)
# So "SURFACE_0" is near-black in this dark theme and would be near-white in a
# light one — the name never lies about which end of the ramp it is.
#
# Rule: edit pigments in Tier 1 to reskin the whole system at once;
#       edit a single role/component token for surgical tuning.
#
# Values are CSS-style hex (`#rrggbb`). Keep them quoted.


# ╔════════════════════════════════════════════════════════════════════════════╗
# ║  META — appearance (light/dark)                                             ║
# ╚════════════════════════════════════════════════════════════════════════════╝
# Declares whether this is a dark or light theme. Rendered by `w-style apply
# appearance` into GTK settings.ini and the XDG appearance portal (gsettings
# color-scheme) so GTK apps, browsers and Electron honour prefers-color-scheme.
# Values: dark | light.
W_APPEARANCE="dark"


# ╔════════════════════════════════════════════════════════════════════════════╗
# ║  TIER 1 — PALETTE (raw pigments)                                            ║
# ╚════════════════════════════════════════════════════════════════════════════╝

# ── Absolutes ─────────────────────────────────────────────────────────────────
W_PALETTE_BLACK="#000000"                # absolute background
W_PALETTE_WHITE="#ffffff"                # absolute foreground

# ── Surface ramp (canvas → most raised) ───────────────────────────────────────
W_PALETTE_SURFACE_0="#09000e"            # canvas — app/terminal background
W_PALETTE_SURFACE_1="#140020"            # recessed / disabled surface
W_PALETTE_SURFACE_2="#200030"            # default surface / track
W_PALETTE_SURFACE_3="#2e0045"            # raised surface (cards, popovers)

# ── Accent (brand — the logo purple) ──────────────────────────────────────────
W_PALETTE_ACCENT_CONTAINER="#643670"     # logo dark — accent container
W_PALETTE_ACCENT="#91619b"               # logo light — primary accent
W_PALETTE_ACCENT_SOFT="#a485a4"          # muted lavender
W_PALETTE_ACCENT_INK="#a170ab"           # accent DRAWN ON a surface (4.5:1 vs SURFACE_3)

# ── Vivid (secondary accent — magenta) ────────────────────────────────────────
W_PALETTE_VIVID_CONTAINER="#741b86"      # deep magenta
W_PALETTE_VIVID="#a526bf"                # vivid magenta — status / error
W_PALETTE_VIVID_SOFT="#ff80ff"           # soft magenta highlight
W_PALETTE_VIVID_INK="#c44bdf"            # vivid DRAWN ON a surface (4.5:1 vs SURFACE_3)

# ── Text tones (bright → faint) ───────────────────────────────────────────────
W_PALETTE_TEXT_BRIGHT="#e8e2ea"          # emphasised text
W_PALETTE_TEXT="#a197a4"                 # primary text / inactive
W_PALETTE_TEXT_DIM="#8a7a8e"             # secondary / disabled text
W_PALETTE_TEXT_FAINT="#5a4a63"           # comments / autosuggestions

# ── Danger (critical — red-shifted, deliberately off-brand to alarm) ──────────
W_PALETTE_DANGER_CONTAINER="#3d0f1d"     # dark crimson — danger container surface
W_PALETTE_DANGER="#e34666"               # vivid crimson — danger accent / border
W_PALETTE_DANGER_SOFT="#ffd6dd"          # light crimson — text on danger

# ── Hue wheel (terminal ANSI 1–6 / 9–14) ──────────────────────────────────────
#    Muted against the dark purple base but kept distinguishable for tool output.
#    Magenta is the brand pigment itself — that tie is expressed here, once.
W_PALETTE_HUE_RED="#c0506b"
W_PALETTE_HUE_GREEN="#7e9b6b"
W_PALETTE_HUE_YELLOW="#c9a26b"
W_PALETTE_HUE_BLUE="#6d7bb5"
W_PALETTE_HUE_CYAN="#6fa3a8"
W_PALETTE_HUE_MAGENTA="$W_PALETTE_VIVID"
W_PALETTE_HUE_RED_BRIGHT="#d96a82"
W_PALETTE_HUE_GREEN_BRIGHT="#97b683"
W_PALETTE_HUE_YELLOW_BRIGHT="#e0bd86"
W_PALETTE_HUE_BLUE_BRIGHT="#8a98d0"
W_PALETTE_HUE_CYAN_BRIGHT="#8bc0c5"
W_PALETTE_HUE_MAGENTA_BRIGHT="#c46bd6"


# ╔════════════════════════════════════════════════════════════════════════════╗
# ║  TIER 2 — SEMANTIC ROLES (reference Tier 1 only)                            ║
# ╚════════════════════════════════════════════════════════════════════════════╝

# ── Background ────────────────────────────────────────────────────────────────
W_BG="$W_PALETTE_BLACK"                       # root background
W_SHADOW="$W_PALETTE_BLACK"                    # drop shadows
W_APP_BG="$W_PALETTE_SURFACE_0"               # App windows bg
W_APP_DIM="$W_PALETTE_VIVID_CONTAINER"        # dimmed app

# ── Surface (layered backgrounds) ─────────────────────────────────────────────
W_SURFACE="$W_PALETTE_SURFACE_2"              # default surface / track
W_SURFACE_VARIANT="$W_PALETTE_SURFACE_3"      # raised surface (cards, popovers)
W_SURFACE_DIM="$W_PALETTE_SURFACE_1"          # recessed / disabled surface

# ── Content (text & icons on surfaces) ────────────────────────────────────────
W_ON_SURFACE="$W_PALETTE_TEXT"                # primary text
W_ON_SURFACE_VARIANT="$W_PALETTE_TEXT_DIM"    # secondary text
W_ON_SURFACE_BRIGHT="$W_PALETTE_TEXT_BRIGHT"  # emphasised text (bright terminal white)
W_ON_SURFACE_FAINT="$W_PALETTE_TEXT_FAINT"    # comments / autosuggestions
# Brand hues as CONTENT on a surface — a button outline, a tab label, a shell
# icon. Distinct from W_PRIMARY/W_ACCENT_ALT, which are free to be fills.
W_ON_SURFACE_ACCENT="$W_PALETTE_ACCENT_INK"   # accent as an outline / label
W_ON_SURFACE_VIVID="$W_PALETTE_VIVID_INK"     # vivid as an icon / marker

# ── Primary (brand accent) ────────────────────────────────────────────────────
W_PRIMARY="$W_PALETTE_ACCENT"                 # active accent (borders, fills)
W_PRIMARY_CONTAINER="$W_PALETTE_ACCENT_CONTAINER" # accent container (selection, buttons)
W_PRIMARY_SOFT="$W_PALETTE_ACCENT_SOFT"       # muted accent (paths, hints)
W_ON_PRIMARY="$W_PALETTE_WHITE"               # text on primary
W_ON_PRIMARY_CONTAINER="$W_PALETTE_WHITE"     # text on primary container

# ── Secondary accent (the vivid axis, used where primary would read as chrome) ─
W_ACCENT_ALT="$W_PALETTE_VIVID"               # commands, callouts
W_ACCENT_ALT_SOFT="$W_PALETTE_VIVID_SOFT"     # highlights on the vivid axis

# ── Status (error / attention) ────────────────────────────────────────────────
W_ERROR="$W_PALETTE_VIVID"                    # error / destructive
W_ON_ERROR="$W_PALETTE_WHITE"                 # text on error
W_ON_ERROR_CONTAINER="$W_PALETTE_VIVID_SOFT"  # text on error container

# ── Danger (critical alerts — red-shifted container that stands apart) ─────────
W_DANGER="$W_PALETTE_DANGER"                    # critical accent / border
W_DANGER_CONTAINER="$W_PALETTE_DANGER_CONTAINER" # critical surface
W_ON_DANGER_CONTAINER="$W_PALETTE_DANGER_SOFT"  # text on critical surface


# ╔════════════════════════════════════════════════════════════════════════════╗
# ║  TIER 3 — COMPONENT TOKENS                                                  ║
# ╚════════════════════════════════════════════════════════════════════════════╝

# ── Terminal — base (Ghostty, foot) ───────────────────────────────────────────
W_TERM_BG="$W_APP_BG"                             # terminal background
W_TERM_FG="$W_ON_SURFACE"                      # default text
W_TERM_CURSOR="$W_PRIMARY"                      # cursor block
W_TERM_CURSOR_TEXT="$W_APP_BG"                      # glyph under cursor
W_TERM_SELECTION_BG="$W_PRIMARY_CONTAINER"      # selection highlight
W_TERM_SELECTION_FG="$W_ON_PRIMARY_CONTAINER"   # text in selection

# ── Terminal — ANSI normal (0–7) ──────────────────────────────────────────────
#    Slots 0/7 ride the surface/text roles; 1–6 come from the Tier 1 hue wheel.
W_TERM_ANSI_BLACK="$W_SURFACE"                 # 0  (visible on pure black)
W_TERM_ANSI_RED="$W_PALETTE_HUE_RED"           # 1
W_TERM_ANSI_GREEN="$W_PALETTE_HUE_GREEN"       # 2
W_TERM_ANSI_YELLOW="$W_PALETTE_HUE_YELLOW"     # 3
W_TERM_ANSI_BLUE="$W_PALETTE_HUE_BLUE"         # 4
W_TERM_ANSI_MAGENTA="$W_PALETTE_HUE_MAGENTA"   # 5  (brand)
W_TERM_ANSI_CYAN="$W_PALETTE_HUE_CYAN"         # 6
W_TERM_ANSI_WHITE="$W_ON_SURFACE"              # 7

# ── Terminal — ANSI bright (8–15) ─────────────────────────────────────────────
W_TERM_ANSI_BRIGHT_BLACK="$W_ON_SURFACE_FAINT"          # 8
W_TERM_ANSI_BRIGHT_RED="$W_PALETTE_HUE_RED_BRIGHT"      # 9
W_TERM_ANSI_BRIGHT_GREEN="$W_PALETTE_HUE_GREEN_BRIGHT"  # 10
W_TERM_ANSI_BRIGHT_YELLOW="$W_PALETTE_HUE_YELLOW_BRIGHT" # 11
W_TERM_ANSI_BRIGHT_BLUE="$W_PALETTE_HUE_BLUE_BRIGHT"    # 12
W_TERM_ANSI_BRIGHT_MAGENTA="$W_PALETTE_HUE_MAGENTA_BRIGHT" # 13
W_TERM_ANSI_BRIGHT_CYAN="$W_PALETTE_HUE_CYAN_BRIGHT"    # 14
W_TERM_ANSI_BRIGHT_WHITE="$W_ON_SURFACE_BRIGHT"         # 15

# ── Window manager — Hyprland ─────────────────────────────────────────────────
W_HYPR_BORDER_ACTIVE="$W_PRIMARY"              # focused window border
W_HYPR_BORDER_INACTIVE="$W_SURFACE"            # unfocused window border
W_HYPR_BG="$W_BG"                              # compositor background

# ── Window group tabs (Hyprland groupbar) ─────────────────────────────────────
# Tabs render as pill plaques (see geometry.conf for their shape). The inactive
# pill matches the bar/card surface and the active pill reuses the launcher's
# selection accent, so a focused tab reads as "selected" without harsh contrast.
W_HYPR_GROUP_BORDER_ACTIVE="$W_HYPR_BORDER_ACTIVE"    # focused group outline (= window border)
W_HYPR_GROUP_BORDER_INACTIVE="$W_HYPR_BORDER_INACTIVE" # unfocused group outline
W_HYPR_TAB_INACTIVE_BG="$W_SURFACE_VARIANT"          # inactive tab pill = bar/card background
W_HYPR_TAB_ACTIVE_BG="$W_PRIMARY_CONTAINER"          # active tab pill = launcher selection accent
W_HYPR_TAB_INACTIVE_FG="$W_ON_SURFACE"               # inactive tab title
W_HYPR_TAB_ACTIVE_FG="$W_ON_PRIMARY_CONTAINER"       # active tab title

# ── Boot — GRUB ───────────────────────────────────────────────────────────────
W_GRUB_BG="$W_BG"                              # menu background
W_GRUB_ITEM="$W_ON_SURFACE"                    # menu item text
W_GRUB_ITEM_SELECTED="$W_ON_PRIMARY"           # selected item text
W_GRUB_SELECT_BG="$W_PRIMARY_CONTAINER"        # selected item plaque

# ── Boot — Plymouth ───────────────────────────────────────────────────────────
W_PLYMOUTH_BG="$W_BG"                          # splash background
W_PLYMOUTH_BAR="$W_PRIMARY"                    # progress bar fill
W_PLYMOUTH_BAR_BG="$W_SURFACE"                 # progress bar track

# ── Lock screen — hyprlock ────────────────────────────────────────────────────
#    Rendered to ~/.config/hypr/hyprlock-colors.conf as hyprlock $variables
#    (rgba(RRGGBBAA) + font family). NOT live by design: hyprlock reads its config
#    fresh on every lock, so a theme switch is picked up at the next lock — no
#    signal/reload needed. Tokens reference Tier 2 roles → every theme recolors the
#    lock identically. The background is a GPU-blurred screenshot (set in
#    hyprlock.conf), so these tokens style only the chrome: input field + labels.
W_LOCK_INNER="$W_SURFACE"                       # password box inner fill
W_LOCK_OUTER="$W_PRIMARY"                        # input outline / accent border
W_LOCK_FONT="$W_ON_SURFACE"                      # typed dots / text in the field
W_LOCK_PLACEHOLDER="$W_ON_SURFACE_VARIANT"      # placeholder + failed-attempt text
W_LOCK_CHECK="$W_PRIMARY_CONTAINER"             # accent while verifying auth
W_LOCK_FAIL="$W_ERROR"                           # accent on auth failure
W_LOCK_CAPS="$W_ON_ERROR_CONTAINER"             # accent when Caps Lock is on
W_LOCK_TEXT="$W_ON_SURFACE"                      # clock / greeting (primary)
W_LOCK_TEXT_DIM="$W_ON_SURFACE_VARIANT"         # date / layout (secondary)
W_LOCK_BG="$W_BG"                                # fallback fill before screenshot

# ── UI shell — Quickshell (launcher + future components) ──────────────────────
#    Rendered to ~/.config/quickshell/w/core/colors.json. The Colors.qml singleton
#    reads it via FileView{watchChanges}, so a running shell recolors live (no
#    signal). Tokens reference Tier 2 roles → every theme recolors identically.
#    Backdrop tint opacity is applied in QML (Launcher.qml), not baked here.
W_QS_BACKDROP="$W_SURFACE_DIM"                  # full-screen tint hue behind launcher
W_QS_SURFACE="$W_SURFACE_VARIANT"               # launcher card background
W_QS_INPUT_BG="$W_SURFACE"                       # search field background
W_QS_TEXT="$W_ON_SURFACE"                         # primary text (app names)
W_QS_MUTED="$W_ON_SURFACE_VARIANT"              # secondary text / placeholder
W_QS_ACCENT="$W_PRIMARY_CONTAINER"               # selected row background (a FILL)
W_QS_ACCENT_FG="$W_ON_PRIMARY_CONTAINER"         # selected row text
W_QS_ACCENT_INK="$W_ON_SURFACE_ACCENT"           # accent as INK: button outline, tab label
W_QS_BORDER="$W_PRIMARY"                          # card border accent
W_QS_ICON_TINT="$W_ON_SURFACE_VIVID"               # brand color the shell's icons are drawn in
W_QS_DANGER_BG="$W_DANGER_CONTAINER"              # critical notification background
W_QS_DANGER_FG="$W_ON_DANGER_CONTAINER"           # critical notification text
W_QS_DANGER_BORDER="$W_DANGER"                     # critical notification border

# ── Qt — qt5ct (Qt5) + qt6ct (Qt6) + KDE apps (kdeglobals KColorScheme) ────────
#    Rendered to a brand QPalette colour scheme + conf in ~/.config/{qt5ct,qt6ct}/
#    (both backends share the format). QT_QPA_PLATFORMTHEME=qt5ct:qt6ct routes each
#    Qt version to its backend. KDE/KF apps (Dolphin, Ark) ignore the QPalette and
#    colour from KColorScheme, so the SAME tokens are rendered to ~/.config/kdeglobals
#    too. NOT live: read once at app startup, so only apps launched after a switch
#    recolor (running ones need a restart). Tokens reference Tier 2 roles → every
#    theme (dark or light) recolors Qt identically.
#
#    W_QT_STYLE selects the Qt WIDGET ENGINE per theme: "fusion" (built into
#    qt-base, honours the QPalette below) or "kvantum" (SVG engine, reads our
#    ~/.config/Kvantum/w/w.kvconfig coloured from the SAME W_QT_* tokens). Both
#    artifacts are always rendered; this flag only flips `style=` in the *ct.conf,
#    so w-theme set switches the engine live for apps started afterwards. Needs
#    QT_QPA_PLATFORMTHEME=qt5ct:qt6ct so both Qt versions read their *ct.conf.
W_QT_STYLE="kvantum"                              # qt widget engine: fusion | kvantum
W_QT_WINDOW_BG="$W_SURFACE"                       # window/dialog background
W_QT_WINDOW_FG="$W_ON_SURFACE"                    # window text
W_QT_VIEW_BG="$W_APP_BG"                          # list/text input background
W_QT_VIEW_FG="$W_ON_SURFACE"                      # text on views
W_QT_BUTTON_BG="$W_SURFACE_VARIANT"               # button / raised surface
W_QT_BUTTON_FG="$W_ON_SURFACE"                    # button text
W_QT_SELECTION_BG="$W_PRIMARY_CONTAINER"          # highlighted selection bg
W_QT_SELECTION_FG="$W_ON_PRIMARY_CONTAINER"       # highlighted selection text
W_QT_TOOLTIP_BG="$W_SURFACE_VARIANT"              # tooltip background
W_QT_TOOLTIP_FG="$W_ON_SURFACE"                   # tooltip text
W_QT_ACCENT="$W_PRIMARY"                          # focus/hover/link decoration
W_QT_NEGATIVE="$W_ERROR"                          # error/destructive foreground
W_QT_INACTIVE="$W_ON_SURFACE_VARIANT"             # disabled / secondary text

# ── GTK3/4 — libadwaita / libhandy (named colors) ─────────────────────────────
#    Rendered to ~/.config/gtk-{3,4}.0/gtk.css as @define-color overrides of the
#    Adwaita (GTK3) and libadwaita (GTK4) named colors, so general GTK apps pick
#    up brand colors (dark/light still comes from W_APPEARANCE). NOT live: gtk.css
#    is read at app startup, so only GTK apps launched after a switch recolor.
#    Tokens reference Tier 2 roles → every theme recolors GTK identically.
W_GTK_WINDOW_BG="$W_SURFACE"                       # window / dialog background
W_GTK_WINDOW_FG="$W_ON_SURFACE"                    # window text
W_GTK_VIEW_BG="$W_APP_BG"                              # content views (lists, fields)
W_GTK_VIEW_FG="$W_ON_SURFACE"                      # text on views
W_GTK_HEADERBAR_BG="$W_SURFACE_VARIANT"            # header/title bar, sidebars
W_GTK_HEADERBAR_FG="$W_ON_SURFACE"                 # header bar text
W_GTK_CARD_BG="$W_SURFACE_VARIANT"                 # cards, popovers, menus
W_GTK_CARD_FG="$W_ON_SURFACE"                      # card text
W_GTK_ACCENT_BG="$W_PRIMARY"                       # accent fill (buttons, selection)
W_GTK_ACCENT_FG="$W_ON_PRIMARY"                    # text on accent
W_GTK_DESTRUCTIVE_BG="$W_ERROR"                    # destructive action
W_GTK_DESTRUCTIVE_FG="$W_ON_ERROR"                 # text on destructive
W_GTK_DISABLED_FG="$W_ON_SURFACE_VARIANT"          # insensitive / secondary text
W_GTK_BORDER="$W_SURFACE_VARIANT"                  # widget / window borders

# ── Icons — system icon theme (Papirus-Dark) ─────────────────────────────────
#    Rendered by the `icons` axis. W_ICON_THEME is the icon-theme NAME written into
#    gtk-3/4 settings.ini + kdeglobals + Qt (one name serves GTK3/GTK4/Qt/Quickshell).
#    It is the REAL theme "Papirus-Dark" (NOT a brand meta-theme): Qt's icon loader
#    rejects inheritance-only meta-themes (empty Directories=), silently falling back
#    to breeze; only a real theme with its own icons is honoured. Papirus-Dark natively
#    inherits
#    breeze-dark,hicolor, so genuine gaps fill from breeze-dark (monochrome, matching).
#    A light theme names Papirus-Light here instead (see config-appearance.md).
#    W_ICON_FOLDER is the Papirus folder-color VARIANT (papirus-folders retints the
#    Papirus-Dark folders/places to it) — SYSTEM-scope, applied only as root
#    when setting the system theme; a per-user `w-theme set` does not touch folders.
#    W_DIR_HUE is the yazi directory hue (hex): drives yazi's [filetype] dir rule.
#    Decoupled from the icon theme; the shell owns its own W_SHELL_DIR. Defined
#    BEFORE the yazi tokens that reference it (sourced top-to-bottom).
W_ICON_THEME="Papirus-Dark"
W_ICON_FOLDER="white"
W_DIR_HUE="$W_PRIMARY"

# ── Shell — terminal syntax + prompt (Starship + zsh-syntax-highlighting + LS) ─
#    Rendered by the `shell` axis into ~/.config/w/shell-colors.zsh + the Starship
#    [palettes.w] block as EXACT truecolor hex. W-Terminal is GUI/truecolor-first:
#    Ghostty in Hyprland is the primary surface, so every role is a precise theme
#    pigment (ANSI 16 is only the SSH/dumb-terminal fallback). A theme switch
#    recolors OPEN terminals live — the .zshrc precmd hook re-sources this file and
#    Starship re-reads its palette each prompt. Tones map to this theme's pigments
#    so the terminal stays in the theme's spirit (here: monochrome purple/magenta).
W_SHELL_ACCENT="$W_PRIMARY"                  # prompt symbol ❯ / fzf pointer
W_SHELL_CMD="$W_ACCENT_ALT"                  # command / builtin / alias (the action)
W_SHELL_FUNCTION="$W_ACCENT_ALT"             # shell functions
W_SHELL_KEYWORD="$W_PRIMARY"                 # reserved words (if/for/while)
W_SHELL_DIR="$W_PRIMARY_SOFT"                # paths / directories / assignments
W_SHELL_STRING="$W_ON_SURFACE"               # quoted strings / arguments
W_SHELL_NUMBER="$W_ACCENT_ALT_SOFT"          # numbers / globs / history expansion
W_SHELL_OPTION="$W_ON_SURFACE_VARIANT"       # -flags / --options
W_SHELL_OPERATOR="$W_ON_SURFACE_VARIANT"     # | > ; && separators / redirections
W_SHELL_COMMENT="$W_ON_SURFACE_VARIANT"      # # comments (italic)
W_SHELL_GIT="$W_PRIMARY"                     # git / vcs segment
W_SHELL_ERROR="$W_DANGER"                    # errors / unknown tokens / nonzero exit
W_SHELL_MUTED="$W_ON_SURFACE_FAINT"          # autosuggestion / cmd duration / 2ndary

# ── CLI file manager — yazi ───────────────────────────────────────────────────
#    Rendered to ~/.config/yazi/theme.toml. NOT live: yazi reads its theme at
#    startup, so a switch applies to newly launched yazi instances. Tokens
#    reference Tier 2 roles → every theme recolors yazi identically.
W_YAZI_CWD="$W_PRIMARY"                            # current-directory path (header)
W_YAZI_HOVERED_BG="$W_PRIMARY_CONTAINER"           # cursor row background
W_YAZI_HOVERED_FG="$W_ON_PRIMARY_CONTAINER"        # cursor row text
W_YAZI_FIND="$W_ERROR"                              # search-match highlight
W_YAZI_BORDER="$W_PRIMARY"                          # pane / input borders
W_YAZI_MARKER_SELECTED="$W_PRIMARY"                # selection marker bar
W_YAZI_MARKER_CUT="$W_ERROR"                        # cut marker bar
W_YAZI_MARKER_COPIED="$W_PRIMARY_CONTAINER"        # yank marker bar
W_YAZI_MODE_NORMAL_BG="$W_PRIMARY"                 # NORMAL mode indicator bg
W_YAZI_MODE_NORMAL_FG="$W_ON_PRIMARY"              # NORMAL mode indicator text
W_YAZI_MODE_SELECT_BG="$W_ERROR"                   # SELECT mode indicator bg
W_YAZI_MODE_SELECT_FG="$W_ON_ERROR"                # SELECT mode indicator text
W_YAZI_MODE_UNSET_BG="$W_PRIMARY_CONTAINER"        # UNSET mode indicator bg
W_YAZI_MODE_UNSET_FG="$W_ON_PRIMARY_CONTAINER"     # UNSET mode indicator text
W_YAZI_FILE_DIR="$W_DIR_HUE"                       # directory listing (shared dir hue)
