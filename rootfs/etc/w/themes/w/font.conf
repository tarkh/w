# W Linux — theme font axis (baseline for theme `w`).
#
# Optional per-theme file: themes/<name>/font.conf. A theme that omits it inherits
# this `w` baseline (resolve_theme_file in w-style), exactly like motion.conf.
#
# Rendered by `w-style apply font`:
#   user-scope  (no root) → ~/.config fontconfig + GTK settings.ini + ghostty +
#                           Quickshell font.json
#   system-scope (root)   → /etc/fonts/local.conf + GRUB PF2
W_FONT_UI="Inter"
W_FONT_MONO="JetBrainsMono Nerd Font"
W_FONT_UI_SIZE=11
W_FONT_MONO_SIZE=11
W_FONT_GRUB_SIZE=16
