# ╔════════════════════════════════════════════════════════════════════════════╗
# ║  W Linux — Motion Source of Truth                                           ║
# ║  Single place that defines transition speeds + easing for the whole system. ║
# ║  Edit here, then run `w-style apply motion` to propagate everywhere.         ║
# ╚════════════════════════════════════════════════════════════════════════════╝
#
# Consumed by `w-style` (subsystem `motion`), which renders this into:
#   Hyprland  → ~/.config/hypr/animations.conf   (durations in DECISECONDS = ms/100)
#   Quickshell → ~/.config/quickshell/w/core/motion.json (durations in MILLISECONDS)
#
# Per-theme with inheritance: a theme without its own motion.conf falls back to
# the `w` baseline (this file). Durations are milliseconds; the easing is a single
# cubic-bezier shared by Hyprland (`bezier`) and Quickshell (`easing.bezierCurve`).
#
# Rule: keep Hyprland and Quickshell visually in sync by changing values HERE
#       only — never hand-tune animations.conf or motion.json (they are renders).

# ── Durations (milliseconds) ──────────────────────────────────────────────────
W_MOTION_FAST=180     # quick feedback (launcher backdrop tint fade, hovers)
W_MOTION_BASE=300     # default — Hyprland windows/fade/workspaces, launcher card
W_MOTION_SLOW=400     # layer surfaces (Hyprland `layers`, crossfade blind)

# ── Easing (shared cubic-bezier control points: x1,y1,x2,y2) ───────────────────
#    Hyprland calls this curve `snap`. Quickshell appends the (1,1) end point.
W_MOTION_BEZIER="0.25, 0.1, 0.25, 1.0"
