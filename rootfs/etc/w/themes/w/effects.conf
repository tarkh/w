# W Linux — theme effects axis (baseline for theme `w`).
#
# Optional per-theme file: themes/<name>/effects.conf. A theme that omits it
# inherits this `w` baseline (resolve_theme_file in w-style), exactly like
# motion.conf / geometry.conf / font.conf.
#
# Single place for surface TRANSLUCENCY and BLUR across W's surfaces. Three
# distinct concepts — do not conflate:
#   ① Window opacity (compositor, focus-driven) — Hyprland fades the WHOLE window
#      (text + widgets + bg) by focus state. Active vs inactive vs fullscreen.
#   ② Shell surface opacity (Quickshell) — our bar/popups/menus: translucent
#      background, opaque content. Plus the dim scrim of full-screen overlays.
#   ③ App window background translucency (toolkits) — translucent window BACKGROUND
#      of foreign apps, widgets stay opaque. Qt/Kvantum + GTK4/libadwaita reliably;
#      GTK3 best-effort (depends on the app honouring CSS alpha). NOT: Qt Fusion.
#
# Rendered by `w-style apply effects`:
#   Hyprland   → ~/.config/hypr/effects.conf  ($w_opacity_*/$w_blur_*), sourced top-level
#   Quickshell → ~/.config/quickshell/w/core/effects.json  (surfaceOpacity/scrimOpacity)
# Concept ③ is consumed by the qt + gtk + ghostty axes (they load this file, like W_FONT_*):
#   Qt/Kvantum → [General] translucent_windows + reduce_window_opacity
#   GTK4/GTK3  → alpha on libadwaita window_bg_color / view_bg_color
#   Ghostty    → background-opacity (own knob W_FX_TERM_OPACITY below)
#
# Opacities are 0.0–1.0 (1.0 = fully opaque). Blur size/passes are Hyprland units.

# ── ① Window opacity (Hyprland, focus-driven; fades whole window incl. text) ───
W_FX_WINDOW_OPACITY_ACTIVE=1.0       # focused window (1.0 = opaque)
W_FX_WINDOW_OPACITY_INACTIVE=1.0     # unfocused windows (more translucent)
W_FX_WINDOW_OPACITY_FULLSCREEN=1.0   # fullscreen always opaque (video safety)

# ── Blur (Hyprland; behind translucent windows AND opted-in shell layers) ──────
W_FX_BLUR_ENABLED=true
W_FX_BLUR_SIZE=4
W_FX_BLUR_PASSES=3
W_FX_BLUR_IGNORE_ALPHA=0.3           # layers: skip blur where surface alpha is below
                                     # this (tracks fades; keep below shell opacities)

# ── ② Shell surfaces (Quickshell) ─────────────────────────────────────────────
W_FX_SURFACE_OPACITY=0.75             # translucent card/bar/menu backgrounds
W_FX_SCRIM_OPACITY=0.45              # dim tint of full-screen overlays (launcher/powermenu)

# The bar's own chrome — its background plaque and outline — kept apart from the
# cards above because it is a THEME LOOK, not a translucency level: the blocks on
# the bar carry their own (more solid) zone background, so dropping both of these
# to 0.0 leaves them floating as separate islands, the way a rice theme wants,
# WITHOUT thinning the menus, popups and greeter card that ride SURFACE_OPACITY.
# Defaults alias SURFACE_OPACITY, so a theme that only dials the cards still moves
# the bar with them; an "islands" theme overrides just this pair. Declared after
# the token they alias (the file is sourced top-to-bottom).
# Border WIDTH is shape and lives in geometry.conf (W_GEO_BAR_BORDER) — this is
# only its alpha, so a theme with an outline can fade it without losing it.
W_FX_BAR_OPACITY="$W_FX_SURFACE_OPACITY"  # the bar's background plaque (0.0 = islands)
W_FX_BAR_BORDER_OPACITY=1.0          # the bar's outline (0.0 = invisible border)

# ── ③ App window background translucency (Qt/Kvantum + GTK4; GTK3 best-effort) ─
W_FX_APP_BG_OPACITY=0.85             # 1.0 = opaque app backgrounds; <1 = frosted
W_FX_APP_BG_GTK3=true                # best-effort GTK3 (apps that honour CSS alpha);
                                     # set false if non-cooperating GTK3 apps darken

# ── ③ Terminal (Ghostty) — own knob so the terminal can differ from other apps ─
# Ghostty renders its own translucency (background-opacity: bg only, text opaque),
# consumed by the `ghostty` axis. Separate token because a terminal usually wants a
# different (often higher) opacity than GUI apps for readability.
W_FX_TERM_OPACITY=0.85               # Ghostty background opacity (1.0 = opaque)
