# W Linux — theme geometry axis (baseline for theme `w`).
#
# Optional per-theme file: themes/<name>/geometry.conf. A theme that omits it
# inherits this `w` baseline (resolve_theme_file in w-style), exactly like
# motion.conf / font.conf.
#
# Single place for the interface geometry that is genuinely SHARED across W's own
# surfaces — the compositor (Hyprland windows) and the Quickshell shell. Edit here,
# then run `w-style apply geometry` to propagate everywhere.
#
# Rendered by `w-style apply geometry`:
#   Hyprland   → ~/.config/hypr/geometry.lua   (gaps_in/gaps_out/border/rounding + tabs)
#   Quickshell → ~/.config/quickshell/w/core/geometry.json  (radius/radiusSm/padding/gap/
#                border + the whole `bar` block below)
#   hyprlock   → lock card rounding (next lock)   ·   greeter → same json (next login)
#
# NOT covered (deliberately): per-widget shape inside GTK/Qt toolkits (their metrics
# are baked per-toolkit and not live) and GRUB/Plymouth (absolute bitmap layouts).
# All values are pixels.

# ── Window geometry (Hyprland) ────────────────────────────────────────────────
W_GEO_WINDOW_ROUNDING=14    # corner radius of tiled/floating windows
W_GEO_GAPS_IN=4            # gap between adjacent windows
W_GEO_GAPS_OUT=8           # gap between windows and the screen edge
W_GEO_WINDOW_BORDER=2      # window border thickness

# ── Window group tabs (Hyprland groupbar) ─────────────────────────────────────
# Height and corner radius of the tab pills are set independently. For a clean
# stadium pill keep rounding at half the height (e.g. 20/10); a rounding below that
# gives a rounded rectangle, above it a pointed lemon — so don't exceed height/2.
W_GEO_TAB_HEIGHT=20        # tab pill height
W_GEO_TAB_ROUNDING=10      # tab pill corner radius (≤ height/2 for a clean pill)
W_GEO_TAB_GAP=4            # gap below the pills (pill → window content)
W_GEO_TAB_GAP_IN=4         # gap between adjacent tab pills

# ── Shell geometry (Quickshell + lock/greeter cards) ──────────────────────────
W_GEO_RADIUS=14           # large surfaces: popups, menus, cards, notifications, lock card
W_GEO_RADIUS_SM=8         # small/inner elements: buttons, workspace pills, thumbnails
W_GEO_PADDING=12          # base inner padding of cards/popups
W_GEO_GAP=6               # base spacing between elements
W_GEO_BORDER=1            # outer border (outline) of shell cards/popups

# ── Status bar (Quickshell) ───────────────────────────────────────────────────
# The bar's SHAPE lives here; its composition (which blocks, what they do) and its
# colors stay in the user-owned ~/.config/quickshell/w/config/bar.json. Every value
# below is the bar's default geometry — writing the same key back into bar.json still
# wins for that one element, so a theme sets the character and the user tunes details.
#
# Radii take a whole number of pixels (0 = sharp corners) or the keyword `pill`
# = half the element's height, i.e. an even stadium rounding that tracks the bar
# height automatically. Everything else is a whole number of pixels.
W_GEO_BAR_POSITION=top       # top | bottom — screen edge the bar is anchored to
W_GEO_BAR_HEIGHT=32          # bar height
W_GEO_BAR_MARGIN_EDGE=6      # gap between the bar and the edge it is anchored to
W_GEO_BAR_MARGIN_SIDE=8      # gap between the bar and the left/right screen edges

W_GEO_BAR_RADIUS=pill        # corner radius of the bar surface itself
W_GEO_BAR_RADIUS_ZONE=pill   # corner radius of a block's zone background
W_GEO_BAR_RADIUS_BUTTON=pill # corner radius of buttons inside workspaces/apps/tray

W_GEO_BAR_PADDING_V=2        # bar inner padding, top/bottom (air above/below the blocks)
W_GEO_BAR_PADDING_H=2        # bar inner padding, left/right (inset of the first/last block)
W_GEO_BAR_PADDING_ZONE_V=0   # zone inset from the content band, top/bottom (0 = full height)
W_GEO_BAR_PADDING_ZONE_H=7   # zone inner padding, left/right
W_GEO_BAR_PADDING_GROUP=2    # button-strip zones (workspaces/apps/tray), all four sides

W_GEO_BAR_GAP=4              # gap between blocks inside a bar zone (start/center/end)
W_GEO_BAR_GAP_ITEM=2         # gap between nested blocks inside a `zone` block
W_GEO_BAR_GAP_BUTTON=4       # gap between buttons inside workspaces/apps/tray

W_GEO_BAR_BORDER=0           # outline of the bar surface (0 = none)
W_GEO_BAR_BORDER_ZONE=0      # outline of a block's zone background (0 = none)
W_GEO_BAR_BORDER_BUTTON=0    # outline of buttons inside workspaces/apps/tray (0 = none)

# true = a block's (and a folded zone's) minimum width can never be less than its
# height, with its content centered — keeps small pill/circle buttons round instead
# of oval. false = minimum width follows content only, as before.
W_GEO_BAR_MIN_SQUARE=true
