# W Linux — Kvantum SVG colour map. Repaints the neutral base default.svg from the
# active theme: each line is "W_QT_* token = source hexes it should replace".
# w-style resolves the token to the theme colour and substitutes every listed hex
# (case-insensitive, word-boundary anchored). The base is a flat (low-gradient)
# Breeze-derived sheet: greys form W surface tiers by luminance; the blue family
# splits into selection FILLS (W_QT_SELECTION_BG) and bright focus/checkbox/handle
# accents (W_QT_ACCENT, = the W brand primary). Tune visually as needed.

# ── Surfaces (dark → light) ───────────────────────────────────────────────────
W_QT_VIEW_BG=#000,#101010,#1e1e1e,#282828,#2b2b2b,#2e2e2e
W_QT_WINDOW_BG=#2d2d2d,#373737,#3d3d3e
W_QT_BUTTON_BG=#464646,#4b4b4b,#505050,#555,#5a5a5a
W_QT_TOOLTIP_BG=#5f5f5f,#636363,#646464,#666

# ── Borders / disabled / secondary ────────────────────────────────────────────
W_QT_INACTIVE=#6e6e6e,#707070,#717171,#737373,#787878,#7b7b7b,#7d7d7d,#828282,#969696,#a5a5a5,#aaa

# ── Foreground text (light → white) ───────────────────────────────────────────
W_QT_WINDOW_FG=#c8c8c8,#d2d2d2,#e6e6e6
W_QT_SELECTION_FG=#f0f0f0,#fff

# ── Accents: selection fills vs bright focus/handles ──────────────────────────
W_QT_SELECTION_BG=#233a5d,#253d61,#29436b,#2e4c7a,#345588,#35588d,#395e97,#3e67a6,#3f67a5,#517bbb,#5f86c1
W_QT_ACCENT=#006edc,#0582ff,#1270a2,#1376ab,#147cb4,#148acc,#1688c6,#1689c6,#3daee9,#5abff4,#b74aff
