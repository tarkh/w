# W Linux — Kvantum KDE colour-scheme map. Mirrors the INI structure of
# default.colors (a KDE .colors scheme; Kvantum Manager reads it to recognise the
# theme). w-style re-tokenises every mapped value from the active theme, emitting
# decimal "R,G,B" (kde_rgb). Section-scoped keys disambiguate the keys repeated in
# every [Colors:*] block. Unmapped keys pass through verbatim — that deliberately
# keeps KDE's fixed semantic accents (ForegroundNeutral/Positive) and the
# [ColorEffects:*] tuning literals as-is; only brand roles are themed.

[Colors:Window]
BackgroundNormal=W_QT_WINDOW_BG
BackgroundAlternate=W_QT_WINDOW_BG
ForegroundNormal=W_QT_WINDOW_FG
ForegroundInactive=W_QT_INACTIVE
ForegroundActive=W_QT_ACCENT
ForegroundLink=W_QT_ACCENT
ForegroundVisited=W_QT_INACTIVE
ForegroundNegative=W_QT_NEGATIVE
DecorationFocus=W_QT_ACCENT
DecorationHover=W_QT_ACCENT

[Colors:View]
BackgroundNormal=W_QT_VIEW_BG
BackgroundAlternate=W_QT_WINDOW_BG
ForegroundNormal=W_QT_VIEW_FG
ForegroundInactive=W_QT_INACTIVE
ForegroundActive=W_QT_ACCENT
ForegroundLink=W_QT_ACCENT
ForegroundVisited=W_QT_INACTIVE
ForegroundNegative=W_QT_NEGATIVE
DecorationFocus=W_QT_ACCENT
DecorationHover=W_QT_ACCENT

[Colors:Button]
BackgroundNormal=W_QT_BUTTON_BG
BackgroundAlternate=W_QT_WINDOW_BG
ForegroundNormal=W_QT_BUTTON_FG
ForegroundInactive=W_QT_INACTIVE
