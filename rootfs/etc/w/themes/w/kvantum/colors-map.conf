ForegroundLink=W_QT_ACCENT
ForegroundVisited=W_QT_INACTIVE
ForegroundNegative=W_QT_NEGATIVE
DecorationFocus=W_QT_ACCENT
DecorationHover=W_QT_ACCENT

[Colors:Selection]
