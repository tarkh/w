# W Linux — Kvantum kvconfig colour map. Mirrors the INI structure of
# default.kvconfig: [Section] + key = W_QT_* token. w-style re-tokenises every
# colour value below from the active theme; nothing is hardcoded in the renderer.
# Section-scoped keys disambiguate repeated keys (e.g. text.focus.color).

[GeneralColors]
window.color=W_QT_WINDOW_BG
base.color=W_QT_VIEW_BG
alt.base.color=W_QT_WINDOW_BG
button.color=W_QT_BUTTON_BG
light.color=W_QT_BUTTON_BG
mid.light.color=W_QT_BUTTON_BG
dark.color=W_QT_WINDOW_BG
mid.color=W_QT_WINDOW_BG
highlight.color=W_QT_SELECTION_BG
inactive.highlight.color=W_QT_SELECTION_BG
tooltip.base.color=W_QT_TOOLTIP_BG
text.color=W_QT_VIEW_FG
window.text.color=W_QT_WINDOW_FG
button.text.color=W_QT_BUTTON_FG
disabled.text.color=W_QT_INACTIVE
tooltip.text.color=W_QT_TOOLTIP_FG
highlight.text.color=W_QT_SELECTION_FG
link.color=W_QT_ACCENT
link.visited.color=W_QT_INACTIVE
progress.indicator.text.color=W_QT_SELECTION_FG

[PanelButtonCommand]
text.normal.color=W_QT_BUTTON_FG
text.focus.color=W_QT_SELECTION_BG
text.press.color=W_QT_BUTTON_FG
text.toggle.color=W_QT_BUTTON_FG
text.shadow.color=W_QT_VIEW_BG

[DockTitle]
text.focus.color=W_QT_SELECTION_FG

[Tab]
text.press.color=W_QT_SELECTION_FG
text.toggle.color=W_QT_SELECTION_FG

[Progressbar]
text.focus.color=W_QT_SELECTION_FG
text.press.color=W_QT_SELECTION_FG
text.toggle.color=W_QT_SELECTION_FG

[MenuItem]
text.focus.color=W_QT_SELECTION_BG

[TitleBar]
text.normal.color=W_QT_WINDOW_FG
text.focus.color=W_QT_SELECTION_FG
