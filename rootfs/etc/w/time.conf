# /etc/w/time.conf — W Linux time: the ADMIN layer.
#
# DEVIATIONS ONLY. W's own defaults live one layer below, in
# /usr/share/w/defaults/time.conf, which every update overwrites freely because
# nobody's edits are in it — that is how improved defaults and new keys reach an
# installed machine. Anything set here wins over them, and the update never
# touches this file (ownership class `override`).
#
#   vendor  /usr/share/w/defaults/time.conf   W-owned, overwritten by updates
#   admin   THIS FILE                        this machine's decisions
#
# See the effective result and where each value came from:  w-conf cat time
# Which keys a user may override: /usr/share/w/defaults/time.schema
#
# Switch the server set with `sudo w-time servers <name>` (it re-renders timesyncd).
# Add a site-specific set as NTP_<name>="host …" here — it merges with the vendor
# catalog instead of replacing it, and survives every update.
