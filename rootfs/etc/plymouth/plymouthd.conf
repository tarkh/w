[Daemon]
# W boot splash. This file is read by plymouthd from INSIDE the initramfs (the
# mkinitcpio plymouth hook bundles it), so an edit here needs `apply.sh --plymouth`
# — a plain file drop reaches /etc but not the boot that uses it.
Theme=w
ShowDelay=0
# Real pixels for the theme, no per-head HiDPI guess.
#
# Left to itself plymouth derives a device scale from the connector's DPI (Mutter's
# constants, via ply_get_device_scale: perfect scale > 1.625 → 2). On a retina panel
# that halves the canvas the theme sees and draws every sprite through a bilinear 2x
# upscale — so the brand logo lands at twice the size the wallpapers give it, and
# blurred, while a mixed-DPI setup gets differently sized canvases per head.
#
# The W theme has no use for that: it sizes everything as a fraction of the panel,
# and its logo is rendered for this machine's resolution when the initramfs is built
# (lib/w/plymouth-logo.sh), so the mark keeps its size when the splash hands over to
# the greeter's wallpaper. See package-plymouth.md.
DeviceScale=1
