# W: parallel makepkg builds.
# Sourced by makepkg after /etc/makepkg.conf. Stock Arch ships MAKEFLAGS commented
# out (single-threaded make), which drags out the on-target AUR/DKMS compiles during
# install — worst on the weak machines W targets. Build make-based packages (notably
# broadcom-wl-dkms and the legacy nvidia-*-dkms modules) on every core instead.
#
# NOTE: this only affects `make`-based builds. The GraalVM native-image packages
# (limine-mkinitcpio-hook / limine-snapper-sync) ignore MAKEFLAGS — those are handled
# by pre-building them into w-repo (build-iso.sh), not here.
#
# BUILDDIR is left on disk on purpose (no tmpfs): W targets are often low on RAM, and
# a tmpfs build dir risks OOM for no meaningful gain on these small DKMS builds.
MAKEFLAGS="-j$(nproc)"

# Drop `*-debug` split packages. Arch enables `debug` in the default OPTIONS (feeds
# debuginfod), but W builds almost nothing compilable-with-symbols via makepkg on the
# target — the on-target AUR builds are DKMS modules (broadcom-wl/nvidia) whose debug
# splits are noise. Symbols for official packages come from Arch's debuginfod service,
# unaffected by this. `!debug` after the stock `debug` wins. If a future locally-
# compiled W package ever needs symbols, override per-build (temporary `debug`)
# rather than reversing this default.
OPTIONS+=(!debug)
