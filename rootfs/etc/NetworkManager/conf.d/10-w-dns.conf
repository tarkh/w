# W Linux — route DNS through systemd-resolved so DNS-over-TLS actually applies.
# Without this NetworkManager writes /etc/resolv.conf itself and bypasses resolved
# (DoT never happens). With dns=systemd-resolved, NM pushes per-link DHCP/VPN DNS
# into resolved (split-DNS preserved) while resolved enforces the W DoT policy.
# See security.md (point Е) and /etc/w/dns.conf.
[main]
dns=systemd-resolved
