# W: make the vendor's "you are running from a snapshot" notification survive login.
#
# limine-snapper-sync ships /etc/xdg/autostart/limine-restore-notify.desktop — the
# ONLY thing that tells a user their machine is booted from a snapshot and offers
# the one-click restore. systemd-xdg-autostart-generator starts it as soon as the
# session target is reached, which on W is before Quickshell has claimed
# org.freedesktop.Notifications, so it died every time with
#   GDBus.Error:org.freedesktop.DBus.Error.ServiceUnknown: The name is not activatable
# and the user was left inside a snapshot with no indication of it. Verified on the
# encrypted VM, 2026-09-02: the same call succeeds once the shell is up, and the
# server does advertise 'actions', so the Restore button works — it was only ever
# a start-order race.
#
# Quickshell is spawned by Hyprland as an app scope, not a unit, so there is no
# unit to order After=; the bus name is the only signal available.
[Service]
ExecStartPre=/usr/lib/w/w-wait-notifications 45
