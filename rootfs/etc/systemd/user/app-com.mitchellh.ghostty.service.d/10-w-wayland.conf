# W: don't pre-warm Ghostty in a user manager that has no display.
#
# mod_hyprland `--global enable`s the vendor's app-com.mitchellh.ghostty.service so
# the GTK process is warm by the time the session finishes coming up and
# `ghostty +new-window` costs ~20ms instead of ~300ms (package-ghostty.md). That
# hangs the unit off graphical-session.target — and in W that target has a
# NON-graphical activation path the vendor never had to think about:
#
#   mod_nightlight → `w-nightlight --user <u> apply` → reload() → `systemctl --user
#   --machine=<u>@.host restart hyprsunset.service` in a user manager that
#   systemd-run just spawned for a user with no session at all (firstboot), and
#   hyprsunset.service carries `Requires=graphical-session.target` → the target is
#   pulled → every unit wanted by it gets a start job.
#
# Every other unit under that target — hypridle, hyprpaper, hyprsunset,
# w-nightlight-tick.{timer,service}, w-session-save, w-authd — carries
# ConditionEnvironment=WAYLAND_DISPLAY and correctly steps aside with one
# "skipped, unmet condition check" line. The vendor's Ghostty unit is the only one
# in the list without it, so it really started, GTK found no display, and firstboot
# logged (encrypted VM, 2026-09-02 20:53:59, reproduced on both install paths):
#
#   ghostty[55730]: warning(glib): WARNING: Gtk: Failed to open display
#   systemd[55472]: Failed to start Ghostty.
#
# Harmless — there is no session to warm, so nothing was lost — but it was the one
# unexplained line in the first-boot log (audit.md §4.6), and an unexplained error
# on someone else's machine is a defect of its own. The fix is the idiom W already
# requires of everything under this target, applied to the one unit that came from
# outside. `After=graphical-session.target` is already in the vendor unit, so the
# condition is evaluated after uwsm finalize has exported WAYLAND_DISPLAY into the
# user manager — the ordering trap documented at the top of w-nightlight-tick.timer
# does not apply here.
[Unit]
ConditionEnvironment=WAYLAND_DISPLAY
