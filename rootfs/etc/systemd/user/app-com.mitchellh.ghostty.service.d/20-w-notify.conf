# W: start Ghostty as plain Type=notify — a workaround for a Ghostty ≤1.3.1 startup race.
#
# The vendor unit is Type=notify-reload + ReloadSignal=SIGUSR2. Since systemd 262 a
# notify-reload service is refused at READY=1 unless its main process already has a
# handler for the reload signal (service.c: "lacks handler for reload signal USR2,
# refusing service startup" → Failed with result 'protocol'). Ghostty 1.3.1 syncs the
# color scheme during startup on a dark desktop, which is a config reload that sends
# RELOADING=1 + READY=1 before startupSignals() installs the SIGUSR2 handler. So the
# D-Bus activation behind `ghostty +new-window` intermittently fails and no window
# opens — on the dev host after systemd 262 landed, 9 dead Super+Enter presses in
# one evening (2026-09-30). Upstream: ghostty-org/ghostty#14398, fixed by #14399.
#
# Under Type=notify systemd skips that check and the rest of the protocol is shared:
# READY=1 still ends startup, and the live reload W actually uses — `pkill -USR2 -x
# ghostty` from w-theme/w-style, never `systemctl reload` — still goes RELOADING=1 →
# READY=1 on a running unit. The only thing lost is `systemctl --user reload` for
# this unit, which nothing in W calls. Harmless to keep after the fix; remove it once
# the packaged ghostty is newer than 1.3.1 (or carries #14399) — package-ghostty.md.
[Service]
Type=notify
