[Service]
StandardOutput=null
StandardError=null
# The login screen's half of the black-screen rescue that /etc/xdg/uwsm/env-hyprland
# runs for the user session: if every connected output starts disabled, re-enable one
# before the greeter compositor parses /etc/w/monitors-greeter.lua (see w-monitor).
# `-` so this can never keep greetd from starting. It re-checks when greetd starts,
# i.e. at boot — which is when a monitor unplugged while the machine was off first
# matters; greetd respawns the greeter internally after a logout without coming
# through here. The explicit systemd-cat is because StandardError=null above applies
# to every Exec* of this unit, and a rescue nobody can see afterwards is half a fix.
ExecStartPre=-/usr/bin/sh -c '/usr/bin/w-monitor greeter sanity 2>&1 | systemd-cat -t w-monitor-sanity'
