[Service]
# Deterministic Plymouth → greetd handoff. The same unit that quits Plymouth
# also triggers the theme outro, then waits exactly its duration — so the
# fade-out can never be cut off mid-animation (no race with progress estimate).
#   1. signal the theme to play its outro (fill→100% → bar fade → logo fade)
#   2. wait the outro length (~0.95s) + margin
#   3. quit, retaining the final (black) frame until the compositor takes over
ExecStartPre=/usr/bin/plymouth message --text=w-outro
ExecStartPre=/usr/bin/sleep 1.5
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
