[Service]
# Deterministic Plymouth → greetd handoff. The same unit that quits Plymouth
# also triggers the theme outro, then waits exactly its duration — so the
# fade-out can never be cut off mid-animation (no race with progress estimate).
#   1. NVIDIA only: blacken the fbdev buffer (see below)
#   2. signal the theme to play its outro (fill→100% → bar fade → logo fade)
#   3. wait the outro length (~0.95s) + margin
#   4. quit; nothing holds the final frame on screen once plymouthd exits, so the
#      kernel shows the fbdev buffer until the compositor's first modeset
#
# Why step 1: nvidia-drm never clears that buffer and, with fbcon's takeover deferred,
# nothing ever draws to it — so that gap showed raw VRAM (coloured stripes for 1-2s).
# Matched by the buffer's own name: elsewhere /dev/fb0 can be the very surface on
# screen (simpledrm/efifb). The write is blitted asynchronously; the sleep covers it.
# See package-plymouth.md.
ExecStartPre=-/usr/bin/sh -c 'for f in /sys/class/graphics/fb[0-9]*; do [ "$$(cat "$$f/name")" = nvidia-drmdrmfb ] && cat /dev/zero > "/dev/$${f##*/}" 2>/dev/null; done'
ExecStartPre=/usr/bin/plymouth message --text=w-outro
ExecStartPre=/usr/bin/sleep 1.5
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
