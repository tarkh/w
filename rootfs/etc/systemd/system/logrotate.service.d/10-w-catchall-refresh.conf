# W Linux — refresh the orphan-log catch-all right before each rotation, so
# /var/log/*.log from software installed after setup (with no logrotate snippet of
# its own) gets picked up automatically. w-logs enumerates true orphans to avoid a
# fatal duplicate-entry collision with package snippets; this keeps that list fresh.
# refresh-catchall never fails the service (it exits 0 even on error).
[Service]
# logrotate.service is sandboxed (ProtectSystem) → /etc is read-only; let the
# refresh write just our catch-all file's directory, nothing else.
ReadWritePaths=/etc/logrotate.d
ExecStartPre=/usr/bin/w-logs refresh-catchall
