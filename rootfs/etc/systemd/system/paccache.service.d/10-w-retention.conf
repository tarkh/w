# W Linux — package cache retention for the weekly paccache.timer (enabled by
# mod_update). Upstream keeps the last 3 versions of everything, uninstalled
# packages included, so a removed bundle's multi-GB CUDA/torch stay forever.
# W keeps 2 (the installed version + one to `pacman -U` back to offline — whole-system
# rollback is the root snapshots' job, not the cache's) and drops packages that are
# no longer installed. A drop-in, not /etc/conf.d/pacman-contrib: that file belongs to
# the package and is not a backup file, so an upgrade would silently revert it.
[Service]
ExecStart=
ExecStart=/usr/bin/paccache -rk2
ExecStart=/usr/bin/paccache -ruk0
