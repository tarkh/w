[Service]
# Stop the boot-progress clock while the LUKS passphrase prompt is up.
#
# Plymouth's progress is a pure wall-clock estimate (ply_progress_get_time() =
# now - start_time, DEFAULT_BOOT_DURATION 60s), so it keeps advancing while the
# prompt sits idle waiting for a human. Plymouth's own client knows this and pauses
# the clock around a password request — that is exactly what its
# `--dont-pause-progress` flag turns off. But our passphrase is asked by systemd's
# agent (systemd-tty-ask-password-agent --watch --plymouth), which speaks the boot
# protocol directly and never sends that command, and the daemon only pauses when
# told to. Result: walk away for a few minutes and the estimate eats most of its
# scale on nothing, so after unlocking, the theme's loading bar surfaces already
# part-filled — the longer the wait, the further along it starts.
#
# ply_progress_unpause() subtracts the paused span from start_time, so the estimate
# resumes where it left off and a slow unlock looks exactly like an instant one.
# It also keeps /var/lib/plymouth/boot-duration honest: that cache stores each
# message as message_time/total_boot_time, so an unpaused wait pins every service
# at ~0.998 and poisons the estimate for subsequent boots too.
#
# Reaches the initramfs on its own: mkinitcpio's add_systemd_unit copies
# /etc/systemd/system/<unit>.d/*.conf for every unit a hook adds, and the plymouth
# hook adds systemd-ask-password-plymouth.service.
#
# `-` prefix on both: a missing or dead daemon must never fail the password agent.
ExecStartPre=-/usr/bin/plymouth pause-progress
ExecStopPost=-/usr/bin/plymouth unpause-progress
