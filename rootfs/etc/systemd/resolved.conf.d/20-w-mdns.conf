# W Linux — single mDNS responder policy.
#
# W uses avahi-daemon as its sole mDNS/DNS-SD responder (LAN discovery of
# NAS/TimeCapsule/SMB hosts via gvfs-dnssd, and *.local resolution via nss-mdns).
# systemd-resolved ships its own mDNS stack which, left enabled, runs a SECOND
# responder on the same host: avahi logs "Detected another mDNS stack", mDNS turns
# unreliable, and resolved answers avahi's own probe for <host>.local so avahi thinks
# the name is taken and renames itself to <host>-2. Disabling mDNS in resolved leaves
# avahi as the single responder and keeps the hostname stable.
#
# This is a fixed W policy (independent of the DNS provider managed by w-dns in
# 10-w-dns.conf), hence a separate drop-in. LLMNR is left untouched (port 5355, a
# different protocol that avahi does not contend with).
[Resolve]
MulticastDNS=no
