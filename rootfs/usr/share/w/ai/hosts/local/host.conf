# W host manifest — local/offline (goose bound to Ollama). Field rationale is in
# hosts/claude/host.conf; this file only states the local path's own answers.

BIN="goose"

# Closed to one entry: HOST=local forces PROVIDER=ollama in launch_host anyway,
# so the Hub should not offer a choice that the launcher would override.
AUTH_MODES="ollama"

AUTH_NATIVE=""
AUTH_CHECK=""
LOGIN_CMD=""

# The goose binary comes from `apply.sh --ai`; the model server is the opt-in
# half (`w-pack install ai-extra` / `pacman -S ollama`), documented in README.md.
INSTALL_CMD=""
INSTALL_SCOPE="system"

NEEDS_MODEL="yes"

CAPABILITIES="chat recipes"
