# W host manifest — goose (the default host). See hosts/claude/host.conf for the
# field-by-field rationale; this file only states goose's own answers.

BIN="goose"

# Empty = no closed list: goose speaks to every provider in the ai.conf catalog
# (openrouter/anthropic/openai/google/ollama), so the Hub offers the catalog.
AUTH_MODES=""

# No native login — W owns the key for goose (keyring -> PROVIDER_ENV_<provider>).
AUTH_NATIVE=""
AUTH_CHECK=""
LOGIN_CMD=""

# Installed system-wide by `apply.sh --ai` (upstream prebuilt CLI), so `w-ai host
# install goose` just points at the module rather than running a second installer.
INSTALL_CMD=""
INSTALL_SCOPE="system"

# W never runs `goose configure`, so GOOSE_MODEL is the only source of a model —
# an empty MODEL fails at launch for every provider, not just ollama.
NEEDS_MODEL="yes"

CAPABILITIES="chat recipes"
