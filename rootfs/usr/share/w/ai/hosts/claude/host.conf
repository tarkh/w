# W host manifest — Claude Code (opt-in, provider-native auth).
#
# The declarative half of W's host contract (ai-integration.md §4): every fact
# about a host that w-ai, `w-ai status`, `w-ai ready`, `w-ai host` and the Hub's
# AI panel would otherwise each hardcode. The imperative half — how to build the
# host's argv — stays in launch_host(), because the flags of goose and Claude Code
# differ in kind, not in value, and pretending otherwise would only hide it.
#
# Shell-sourced field by field in an isolated subshell (host_field() in w-ai, the
# same idiom as w-pack's meta_field) — every multi-word value MUST be quoted.

BIN="claude"

# Which PROVIDER values this host accepts. A closed list means the Hub offers
# exactly these; empty (goose) means "anything in the ai.conf provider catalog".
# First entry is the sane default for a new profile.
AUTH_MODES="subscription anthropic"

# The PROVIDER value that means "the host CLI owns its own login" — W passes no
# key at all for it. Its catalog entry (PROVIDER_ENV_subscription) is declared
# empty in the vendor ai.conf, which is what makes export_provider_key a no-op:
# the same "declared but empty = no key needed" rule that already covers ollama.
AUTH_NATIVE="subscription"

# Exit 0 = the native login is live. Used by `w-ai ready` (the Super+W gate) and
# `w-ai host status` so an un-logged-in CLI is caught BEFORE a terminal opens.
AUTH_CHECK="claude auth status"
LOGIN_CMD="claude auth login"

# Anthropic's recommended install: the native binary, per-user under ~/.local/bin.
# Deliberately not the AUR package — Claude Code updates itself (`claude update`),
# and a pacman-managed binary both fights that and lags behind. Per-user is also
# the honest scope: its auth is per-account anyway. Run by `w-ai host install`.
INSTALL_CMD="curl -fsSL https://claude.ai/install.sh | bash"
INSTALL_SCOPE="user"

# MODEL is optional here: Claude Code picks its own model interactively (/model).
# Set it in a profile only to pin one — launch_host then passes --model.
NEEDS_MODEL="no"

# chat = usable as the interactive assistant; coding = its primary strength.
# Note the absence of `recipes`: W's unattended automation is goose-specific
# (`goose run --recipe`, ai-integration.md §9), so a claude profile never becomes
# the recipe runner — `w-ai run-recipe` keeps going through goose regardless.
CAPABILITIES="chat coding"
