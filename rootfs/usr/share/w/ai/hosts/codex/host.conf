# W host manifest — Codex CLI (opt-in, provider-native auth). Field rationale is
# in hosts/claude/host.conf; this file only states Codex's own answers.
#
# Codex gets W's layers the way Claude Code does — as launch flags built by
# launch_host's codex branch (`-c mcp_servers.w-mcp…` for actions, `-c
# developer_instructions=…` for identity), so nothing is ever written into the
# user's ~/.codex and a bare `codex` stays a plain Codex. Knowledge rides w-mcp
# (MCP resources + w_search_knowledge), as it does under goose: Codex has no
# per-launch skill root, only fixed discovery paths. See README.md next to this.

BIN="codex"

AUTH_MODES="subscription openai"
AUTH_NATIVE="subscription"

# `codex login status` exits 0 when credentials are present. Kept conservative:
# if a future Codex renames it, the gate degrades to "binary present", never to
# a false negative that would block the Super+W palette.
AUTH_CHECK="codex login status"
LOGIN_CMD="codex login"

# OpenAI's standalone installer: a static binary, per-user under ~/.local/bin
# (CODEX_INSTALL_DIR). Same reasoning as Claude Code and not the AUR package:
# Codex updates itself (`codex update`), a pacman-managed binary fights that and
# lags, and the login is per-account anyway. Run by `w-ai host install codex`.
INSTALL_CMD="curl -fsSL https://chatgpt.com/codex/install.sh | sh"
INSTALL_SCOPE="user"

# MODEL is optional: Codex picks its own model in the session (/model). Set it
# in a profile only to pin one — launch_host then passes --model.
NEEDS_MODEL="no"

CAPABILITIES="chat coding"
