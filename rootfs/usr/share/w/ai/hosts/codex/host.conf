# W host manifest — Codex CLI (opt-in, provider-native auth). Field rationale is
# in hosts/claude/host.conf; this file only states Codex's own answers.
#
# Codex reaches W's layers through ~/.codex/config.toml (the [mcp_servers.w-mcp]
# block in config.toml next to this file) plus its native AGENTS.md support — it
# needs no launch-time flags, which is why launch_host's codex branch stays bare.

BIN="codex"

AUTH_MODES="subscription openai"
AUTH_NATIVE="subscription"

# `codex login status` exits non-zero when signed out. Kept conservative: if a
# future Codex renames it, the gate degrades to "binary present", never to a
# false negative that would block the Super+W palette.
AUTH_CHECK="codex login status"
LOGIN_CMD="codex login"

# Upstream ships Codex through npm/Homebrew and the AUR carries a package; W does
# not pick for the user here (unlike Claude Code, there is no vendor-recommended
# single-command native installer to mirror). Left empty on purpose: `w-ai host
# install codex` then points at the preset README instead of guessing.
INSTALL_CMD=""
INSTALL_SCOPE="user"

NEEDS_MODEL="no"

CAPABILITIES="chat coding"
