# W host manifest — OpenCode (opt-in, provider-native auth). Field rationale is
# in hosts/claude/host.conf; this file only states OpenCode's own answers.
#
# OpenCode is a hybrid: it carries its own subscription (Zen) like Claude Code/
# Codex, but — unlike them — also speaks to the full models.dev provider catalog
# (Anthropic/OpenAI/Google/OpenRouter/Ollama/dozens more), like goose. So unlike
# claude/codex, AUTH_MODES is left OPEN (empty) rather than closed to a fixed
# list: effective_provider() then passes PROVIDER through unchanged instead of
# folding an unrecognised value back to the first entry. The 5 providers W's own
# catalog (PROVIDER_ENV_*) knows get a keyring-managed key exactly like under
# goose; `subscription` gets AUTH_NATIVE's no-key treatment; anything else W has
# never heard of is left entirely to OpenCode's OWN auth store
# (`opencode auth login -p <provider>` -> ~/.local/share/opencode/auth.json) —
# see launch_host's opencode branch, which only calls export_provider_key for a
# provider actually declared in ai.conf's catalog. See README.md next to this.

BIN="opencode"

AUTH_MODES=""
AUTH_NATIVE="subscription"

# `opencode auth list` has no documented exit-code contract for one provider's
# state (unlike `codex login status`/`claude auth status`) — this is the one
# unverified field in this manifest. Confirm on the VM: does grepping the Zen
# entry out of `auth list` reliably track being logged in/out? If it does not,
# drop this to an empty string — the existing rule ("no AUTH_CHECK = counts as
# logged in, never blocks") degrades gracefully, exactly as it would for a
# renamed upstream subcommand.
AUTH_CHECK="opencode auth list | grep -qi zen"
LOGIN_CMD="opencode auth login"

# Official standalone installer: a shell script, per-user, lands the real
# binary in ~/.opencode/bin (NOT ~/.local/bin like claude/codex) and adds its
# own `export PATH=...` line to ~/.zshrc — confirmed on the VM (2026-09-16):
# that line is invisible to anything that isn't an INTERACTIVE zsh (a plain
# shell, a login shell run non-interactively, and critically a Quickshell
# Process spawn all miss it — `command -v opencode` fails in every one of
# those, so Super+W would report no-host-bin right after a successful
# install). `~/.local/bin` is already on PATH session-wide via env-hyprland
# (the same channel claude/codex ride), so the fix is a symlink into that
# existing channel rather than a second, installer-specific one — done here,
# not in w-ai, because it is this installer's own quirk, not a general host
# concern. OpenCode updates itself (`opencode upgrade`, also auto-checks at
# startup) — same reasoning as claude/codex for staying off the AUR.
INSTALL_CMD="curl -fsSL https://opencode.ai/install | bash && mkdir -p $HOME/.local/bin && ln -sf $HOME/.opencode/bin/opencode $HOME/.local/bin/opencode"
INSTALL_SCOPE="user"

# MODEL is optional: OpenCode picks a model interactively on first run/when
# unset. Set it in a profile only to pin one (provider-prefixed, OpenCode's own
# convention, e.g. "anthropic/claude-sonnet-5" or "zen/<model>") — launch_host
# then passes --model.
NEEDS_MODEL="no"

CAPABILITIES="chat coding"
