# W AI profile: codex — Codex CLI on its own ChatGPT login. See hosts/codex/.
#
# PROVIDER=subscription is not a model vendor, it is an auth mode: the CLI owns
# its login (`w-ai host login codex`) and W passes no API key. Switch it to
# `openai` to pay per token against an API key instead (`w-ai key set openai`).
# MODEL stays empty on purpose — Codex picks its model in the session (/model);
# set it only to pin one.
HOST=codex
PROVIDER=subscription
MODEL=
MODE=auto
MCP_PROFILE=full
