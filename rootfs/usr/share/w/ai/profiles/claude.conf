# W AI profile: claude — Claude Code on its own subscription. See hosts/claude/.
#
# PROVIDER=subscription is not a model vendor, it is an auth mode: the CLI owns
# its login (`w-ai host login claude`) and W passes no API key. Switch it to
# `anthropic` to pay per token against an API key instead (`w-ai key set
# anthropic`). MODEL stays empty on purpose — Claude Code picks its model in the
# session (/model); set it only to pin one.
HOST=claude
PROVIDER=subscription
MODEL=
MODE=auto
MCP_PROFILE=full
