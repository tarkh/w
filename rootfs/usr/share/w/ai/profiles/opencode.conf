# W AI profile: opencode — OpenCode on its own Zen subscription. See hosts/opencode/.
#
# PROVIDER=subscription is not a model vendor, it is an auth mode: the CLI owns
# its login (`w-ai host login opencode`, an interactive picker covering Zen and
# every other provider it knows) and W passes no API key. Switch it to one of
# `anthropic`/`openai`/`google`/`openrouter`/`ollama` to pay per token against a
# W-managed key instead (`w-ai key set <provider>`) — or to any other provider
# OpenCode itself supports (mistral, groq, deepseek, …), configured directly in
# OpenCode (`opencode auth login -p <provider>`), which W does not manage at
# all. MODEL stays empty on purpose — OpenCode picks its model in the session;
# set it only to pin one (provider-prefixed, e.g. "anthropic/claude-sonnet-5").
HOST=opencode
PROVIDER=subscription
MODEL=
MODE=auto
MCP_PROFILE=full
