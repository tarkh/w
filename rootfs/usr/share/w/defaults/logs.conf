# /usr/share/w/defaults/logs.conf — W Linux logs: the VENDOR layer.
#
# W's own defaults. Do NOT edit: every update overwrites this file wholesale.
# Machine-specific decisions belong in /etc/w/logs.conf (the admin layer), which
# the update never touches — put ONLY the keys you actually change there.
# `w-conf cat logs` shows the merged result with the origin of every value.
#
# Retention policy W applies to the journal, /var/log/* and /var/log/w.
# Change the DISTRO default here; change ONE MACHINE with `sudo w-logs keep <days>`.

RETENTION_DAYS=30

# Optional size ceiling. Empty = no size limit (time-based retention only).
# Semantics differ per node (documented in w-logs.md):
#   • journal   -> SystemMaxUse : a TOTAL budget for the whole journal directory.
#   • logrotate -> maxsize      : a per-file rotate TRIGGER (rotates a log early
#                                 once it reaches this size, before the daily run).
# Accepts a number plus a unit: K / M / G (e.g. 500M, 2G). w-logs rewrites this
# line on `w-logs limit <size>`; `w-logs limit off` clears it.
MAX_SIZE=
