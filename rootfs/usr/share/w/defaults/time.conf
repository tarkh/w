# /usr/share/w/defaults/time.conf — W Linux time: the VENDOR layer.
#
# W's own defaults. Do NOT edit: every update overwrites this file wholesale.
# Machine-specific decisions belong in /etc/w/time.conf (the admin layer), which
# the update never touches — put ONLY the keys you actually change there.
# `w-conf cat time` shows the merged result with the origin of every value.
#
# NTP server catalog + the default selection. The catalog MERGES per key: an
# NTP_<name> added by the admin coexists with these, and new entries shipped by a
# later W release arrive on their own.

SERVERS=arch

# Space-separated fallbacks used when none of the primary servers are reachable.
FALLBACK="time.cloudflare.com time.google.com"

# Server catalog — NTP_<name>="host host ..." (hostnames or IPs; NTS-capable hosts
# are fine, systemd-timesyncd uses plain SNTP). Pick one with `w-time servers`.
NTP_arch="0.arch.pool.ntp.org 1.arch.pool.ntp.org 2.arch.pool.ntp.org 3.arch.pool.ntp.org"
NTP_cloudflare="time.cloudflare.com"
NTP_google="time.google.com time2.google.com time3.google.com time4.google.com"
NTP_pool="0.pool.ntp.org 1.pool.ntp.org 2.pool.ntp.org 3.pool.ntp.org"
NTP_systemd="time1.google.com time2.google.com time3.google.com time4.google.com"
