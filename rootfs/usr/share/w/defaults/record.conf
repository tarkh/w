# /usr/share/w/defaults/record.conf — W Linux screen recording: the VENDOR layer.
#
# W's own defaults. Do NOT edit: every update overwrites this file wholesale.
# This machine's decisions belong in /etc/w/record.conf (the admin layer) and
# personal ones in ~/.config/w/record.conf — neither is ever touched by an
# update. `w-conf cat record` shows the merged result and where each value
# came from.
#
# Read by /usr/bin/w-record when a recording STARTS, so a change takes effect on
# the very next keypress — no reload, no relogin, no render step. A recording
# already running keeps the settings it started with: they are baked into the
# encoder's command line, and there is no way to renegotiate a muxer mid-file.

# Which backend does the capturing.
#
#   wf    wf-recorder — W's default and the only backend in the base system. It
#         captures through wlr-screencopy, the same protocol grim and hyprlock
#         already use, so it needs no portal, no PipeWire session and no
#         privileged helper of its own.
#   gsr   gpu-screen-recorder — GPU-side capture with a replay buffer. NOT in
#         the base system: its `gsr-kms-server` ships with a cap_sys_admin file
#         capability, which does not belong on every W machine, so it arrives
#         with an optional W-Pack. Setting this without that pack installed is a
#         clean error, never a silent fallback.
RECORDER=wf

# Where the encoding happens.
#
#   auto  use the GPU (VAAPI) when this machine actually has a render node and
#         the encoder accepts it, else fall back to the CPU and say so in a
#         notification. Never a silent failure: a recording that produced no
#         file is worse than a recording that cost some CPU.
#   cpu   always libx264 on the CPU. Slower and hotter, but works everywhere and
#         is the safe answer when a driver lies about what it supports.
#   vaapi always the GPU, no fallback. For a machine whose VAAPI is known good
#         and where a CPU encode would drop frames.
ENCODER=auto

# What lands on the audio track.
#
#   system  the default output's monitor — everything you can hear. This is what
#           a screencast is almost always for, so it is the default.
#   mic     the default input instead: narration without the desktop's own noise.
#   none    video only.
#
# One track, one source: the backend takes a single device, and mixing a monitor
# with a microphone would mean standing up a PipeWire loopback node for the
# lifetime of the recording. Not worth the moving parts for a keybind.
AUDIO=system

# Container for the recording. mp4/h264 because it plays everywhere and every
# editor imports it; mkv (also h264) survives a crash mid-recording better; webm
# is the one to pick for the web — VP9 + Opus, always encoded on the CPU, since
# h264 is not a WebM codec and hardware VP9 encode is rarely there.
FORMAT=mp4

# Frame rate, in frames per second, held CONSTANT: frames are duplicated to reach
# it. Variable frame rate makes a smaller file, but editors and browsers handle
# VFR mp4 unevenly — a screencast that will be cut or uploaded is worth the
# bytes. 30 is the screencast default; raise it for anything with motion.
FRAMERATE=30

# Paint the corners of a `window` recording black instead of showing whatever
# lies behind the rounded corners (wallpaper, other windows). A video has no
# alpha channel, so black is the best a recording can do.
#
#   no   the window's bounding rectangle, as captured  <- W's default
#   yes  the corners are masked. This needs a filter on the encoder, which only
#        the CPU path can run: `window` recordings then ALWAYS encode on the CPU,
#        whatever ENCODER says (a hardware encoder stays in use for the other
#        modes). Costs CPU on large windows.
#
# Only `window` is affected, and only with a theme whose windows are rounded
# (W_GEO_WINDOW_ROUNDING > 0): square windows have nothing behind their corners, so
# no mask is built and the encoder is left alone. A translucent window still shows what is behind it:
# the capture is the composited monitor, not the window's own surface.
WINDOW_MASK=no
