# /usr/share/w/defaults/ai-models.conf — W Linux AI model store: the VENDOR layer.
#
# W's own defaults. Do NOT edit: every update overwrites this file wholesale.
# Machine-specific decisions belong in /etc/w/ai-models.conf (the admin layer),
# which the update never touches — put ONLY the keys you actually change there.
# `w-conf cat ai-models` shows the merged result with the origin of every value.
#
# ONE store, shared by every AI application on the machine. Diffusion weights are
# the largest files a desktop ever downloads (a single checkpoint is 2-25 GB) and
# the front-ends use the SAME files: ComfyUI, InvokeAI, Forge and the rest each
# default to a private `models/` tree of their own, so installing two of them
# means downloading everything twice. No cross-application standard for this
# exists (checked September 2026; third-party launchers solve it with symlink
# farms), so W is the standard here: one directory in ComfyUI's canonical layout
# — checkpoints/, diffusion_models/, loras/, vae/, clip/, controlnet/, … — and
# every pack points its own application at it with that application's native
# switch (ComfyUI: --models-directory). Nothing is symlinked, nothing is copied.
#
# The subsystem is named after the DIRECTION, not after whichever engine is
# installed today — that is what lets a second AI pack read the same key instead
# of reaching into a neighbour's config.
#
# This key is declared in the base system even though only packs consume it, for
# the same reason ai.conf carries the W_AI_TOOL_* switches: the contract has to be
# answerable BEFORE the pack exists, so the path can be chosen first and the pack
# installed into it:
#
#   sudo w-conf set ai-models DIR /Apps/Models
#   sudo w-pack install comfyui
#
# Changing it afterwards is the same command plus a re-run of the packs that use
# it (`sudo w-pack refresh comfyui`), which re-points the service and restarts it.
# W never moves the data for you — the packs print the rsync line and leave tens
# of gigabytes where they are until a human says otherwise.
#
# Weights are downloads, not state: the directory is carved out of the snapshots
# (a nested btrfs subvolume on btrfs, a plain directory anywhere else) so hundreds
# of gigabytes never ride along in a rollback point.
DIR=/var/lib/w/ai-models
