# /usr/share/w/defaults/ai.conf — W Linux AI assistant: the VENDOR layer.
#
# W's own defaults for the assistant (see ai-integration.md §4-6). Do NOT edit:
# every update overwrites this file wholesale — which is how a NEW per-tool switch
# shipped with a new Tier-2 tool, or an improved default, reaches an installed
# machine. Machine-wide decisions belong in /etc/w/ai.conf, a user's in
# ~/.config/w/ai.conf (and ~/.config/w/ai-features.conf for the ai-extra toggles,
# which survive `w-ai profile use`). `w-conf cat ai` shows the merged result.
#
# Secrets NEVER live in any of these files. Provider API keys are stored in
# gnome-keyring and exported by w-ai at launch (`w-ai key set <provider>`).
#
HOST=goose
PROVIDER=openrouter
MODEL=
MODE=auto

# MCP_PROFILE  how much of the w-mcp tool surface is offered to the model:
#          full     — every tool (frontier/provider models tool-call reliably).
#          minimal  — Tier-0 reads + memory + a couple safe Tier-1 actions. A
#                     smaller surface that small local models (e.g. Qwen3 4B via
#                     Ollama) drive far more reliably — their tool-calling degrades
#                     sharply past ~15-20 tools. Privileged (Tier-2) tools are off.
#          Empty = auto: HOST=local resolves to 'minimal', everything else to 'full'.
#          Set explicitly to override the auto choice. The security boundary is
#          unchanged either way — it is the OS (polkit), not the tool count.
MCP_PROFILE=

# ── Provider catalog ──────────────────────────────────────────────────────────
# PROVIDER_ENV_<name> — the environment variable the host expects the API key in.
# w-ai looks up the key for the active PROVIDER in the keyring (attribute
# w-ai-provider=<name>) and exports it under this name before launching. Add your
# own OpenAI-compatible provider by giving it an entry here plus a key.
#
# An entry declared EMPTY means "this provider needs no key from W" — w-ai then
# passes nothing and never nags about a missing one. Two cases use it: `ollama`
# (a local server) and `subscription` (a provider-native CLI login, e.g. Claude
# Code Pro / Codex — the host owns its own auth). That distinction matters: with
# ANTHROPIC_API_KEY exported, Claude Code bills the API instead of the
# subscription, so a subscription profile must export nothing at all.
PROVIDER_ENV_openrouter=OPENROUTER_API_KEY
PROVIDER_ENV_anthropic=ANTHROPIC_API_KEY
PROVIDER_ENV_openai=OPENAI_API_KEY
PROVIDER_ENV_google=GOOGLE_API_KEY
PROVIDER_ENV_ollama=              # local, no key required
PROVIDER_ENV_subscription=        # host's own login (claude/codex), no key required

# OLLAMA_HOST — where the local model server listens (HOST=local / PROVIDER=ollama).
# Exported as-is when set; empty leaves goose's default (127.0.0.1:11434).
OLLAMA_HOST=

# ── Tier-2 privileged tools (phase 6) ─────────────────────────────────────────
# w-mcp's Tier-2 tools mutate privileged system state. They never gain privilege
# themselves: each call execs the w-ai-actuate dispatcher through pkexec + the
# com.w.ai.actuate polkit action, so the polkit agent (w-authd) prompts you (fingerprint or
# password) and journald audits every run (tag: w-ai-actuate). The model cannot
# bypass this. See ai-integration.md §3.
#
# These switches decide which Tier-2 tools w-mcp *offers*. A disabled tool is
# still advertised to the assistant but refuses to run, telling it to flip the
# switch here — so the model can explain what it needs instead of failing quietly.
# Values: on | off.
W_AI_TOOL_DNS=on          # w_dns_provider + w_dns_mode — DoT resolver / mode (w-dns)
W_AI_TOOL_FIREWALL=on     # w_firewall_zone  — home/public default zone (w-firewall)
W_AI_TOOL_FWUPD=on        # w_fwupd_refresh  — refresh firmware metadata (fwupdmgr)
W_AI_TOOL_PACMAN=on       # w_pacman_install — install repo packages (pacman -S)
W_AI_TOOL_APPLY=on        # w_apply_module   — re-run a W apply.sh module
W_AI_TOOL_PACKS=on        # w_pack_install   — install an optional W-Pack bundle
W_AI_TOOL_UPDATE=on       # w_system_update  — full repo upgrade (pacman -Syu; AUR stays manual)
W_AI_TOOL_LOCALE=on       # w_locale_set     — set the system locale / LANG
W_AI_TOOL_MAINTAIN=on     # w_service_restart/w_service_enable/w_logs_vacuum — curated,
                          #   frequent, narrowly-validated maintenance actions
                          #   (w_pacman_remove reuses W_AI_TOOL_PACMAN above)
W_AI_TOOL_HOSTNAME=on     # w_hostname_set   — set the machine hostname (hostnamectl)
W_AI_TOOL_TIMEZONE=on     # w_timezone_set   — set the system timezone (w-time)
W_AI_TOOL_NTP=on          # w_ntp_set        — enable/disable network time sync (w-time)
W_AI_TOOL_POWER=on        # w_power_charge_limit/w_power_lid/w_power_mode — charge
                          #   threshold / lid action / laptop-desktop mode (w-power)
W_AI_TOOL_SYNC=on         # w_sync_update    — edge-channel update (w-sync; no-op on stable)
W_AI_TOOL_RUN=off         # w_run            — arbitrary command as root (dangerous; off)

# ── Web access (w_web_fetch / w_web_search, Tier 0 — no polkit, no switch above) ─
# W_AI_SEARCH_PROVIDER decides which w_web_search provider to try, in order:
#   auto  (default) — `ddgs` CLI if installed (`uv tool install ddgs`, free, no
#         key) then the Brave Search API (key via `w-ai key set brave`, same
#         keyring scheme as the LLM providers above).
#   ddgs | brave     — force one provider, skip the other.
#   off              — disable w_web_search entirely.
# w_web_fetch needs no config: it is always the stdlib fetcher with the SSRF
# guard, optionally upgraded to `trafilatura` for extraction quality if that CLI
# is installed (`uv tool install trafilatura`) — never required.
W_AI_SEARCH_PROVIDER=auto

# ── Advanced features (ai-extra pack) ─────────────────────────────────────────
# Opt-in semantic (vector) recall layered on top of the FTS5 memory store — see
# ai-integration.md §8 / modules/memory.py. Needs the `ai-extra` W-Pack (ollama +
# python-numpy). These toggles ALSO live in ~/.config/w/ai-features.conf (read
# after this file and after ~/.config/w/ai.conf — last wins), specifically so
# `w-ai profile use` — which overwrites the whole user ai.conf — never wipes
# them; feature toggles are a separate concern from provider/model selection.
#
# W_AI_EMBED        off (default) | ollama — off means FTS5-only, bit-for-bit the
#                   pre-Stage-3 behavior. Provider-hosted embedding is deliberately
#                   not offered here: it would leak private memory facts off-box.
# W_AI_EMBED_MODEL  ollama model tag used for embedding.
# W_AI_EMBED_URL    ollama HTTP endpoint (same daemon `HOST=local`/OLLAMA_HOST
#                   would use).
# W_AI_EMBED_KEEPALIVE  Ollama `keep_alive` sent with every embed request —
#                   scoped to W_AI_EMBED_MODEL only (Ollama ties keep_alive to
#                   the `model` field of that same request; any other model the
#                   user runs, e.g. a HOST=local chat model, keeps its own
#                   independent lifecycle). Keeps the embedder OUT of VRAM except
#                   while actually in use: "30s"/"0" for a GPU shared with other
#                   workloads (games), "30m" for a machine that embeds often.
W_AI_EMBED=off
W_AI_EMBED_MODEL=qllama/bge-m3:q8_0
W_AI_EMBED_URL=http://127.0.0.1:11434
W_AI_EMBED_KEEPALIVE=5m
