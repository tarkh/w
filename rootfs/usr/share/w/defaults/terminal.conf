# /usr/share/w/defaults/terminal.conf — W Linux terminal: the VENDOR layer.
#
# W's own defaults. Do NOT edit: every update overwrites this file wholesale.
# Machine-specific decisions belong in /etc/w/terminal.conf (the admin layer), which
# the update never touches — put ONLY the keys you actually change there.
# `w-conf cat terminal` shows the merged result with the origin of every value.
#
# Terminal W launches from every surface (binds, bar, hub, launcher) via `w-term`.

TERMINAL=ghostty
