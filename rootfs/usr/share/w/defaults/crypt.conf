# /usr/share/w/defaults/crypt.conf — W Linux crypt: the VENDOR layer.
#
# W's own defaults. Do NOT edit: every update overwrites this file wholesale.
# Machine-specific decisions belong in /etc/w/crypt.conf (the admin layer), which
# the update never touches — put ONLY the keys you actually change there.
# `w-conf cat crypt` shows the merged result with the origin of every value.
#
# Disk-encryption defaults. Re-enrolling is required after changing the PCR set:
# `sudo w-crypt enroll-tpm` (see package-limine.md / security.md).

W_CRYPT_TPM2_PCRS=7
