# /usr/share/w/defaults/mirrors.conf — W Linux package mirrors: the VENDOR layer.
#
# W's own defaults. Do NOT edit: every update overwrites this file wholesale.
# Machine-specific decisions belong in /etc/w/mirrors.conf (the admin layer), which
# the update never touches — put ONLY the keys you actually change there.
# `w-conf cat mirrors` shows the merged result with the origin of every value.
#
# Change one machine with `sudo w-mirrors set <key> <value>`; re-rank now with
# `sudo w-mirrors rank`. See w-mirrors.md.
#
# WHY THESE NUMBERS ARE THESE NUMBERS. They are not tuning taste — they were
# measured against reflector's actual rating mechanic during Ф.1 of the package-
# delivery work (installer.md §5), and modules/base.sh passes the same values to
# the same tool at install time. `check.sh --landmines` compares the two sides and
# fails on divergence: a mirrorlist that is ranked one way by the installer and
# another way by the monthly job would make every field report ambiguous.

# Country filter for the Arch mirror status API. EMPTY = worldwide, which is the
# right default for a distro with no fleet assumption: reflector sorts by measured
# rate anyway, so a nearby mirror wins on its own merits, while a country filter on
# a machine that travels (or sits behind a VPN) narrows the pool to a handful of
# hosts — and pool depth IS the fallback pacman runs on. Set it (e.g. "Germany",
# or a comma-separated list) only when the network genuinely cannot reach abroad.
COUNTRY=

# https only. http mirrors still exist and rate fine; they also let anything on the
# path serve a package, and W has no reason to accept that for a background job
# nobody is watching.
PROTOCOL=https

# Maximum hours since the mirror last synced. A stale mirror is not a slow one —
# its database is accepted while the packages that database lists are not on it
# yet, so it 404s in the MIDDLE of a transaction, which is far worse than being
# excluded up front.
AGE=12

# Pre-filter by the central Arch mirror score before rating anything. This is a
# budget knob as much as a quality one: reflector's rate probe DOWNLOADS
# extra/os/x86_64/extra.db (~8.8 MB) from every candidate, so the pool size is the
# traffic bill (30 × 8.8 MB worst case ≈ 260 MB).
SCORE=30

# How many mirrors end up in the list. Depth is not cosmetic — pacman's own "too
# many errors from X, skipping for the remainder of this transaction" fallback (and
# w_pac's demotion) only work while there is somewhere left to go.
COUNT=20

# Parallel rate probes. 30 serial probes take ~2 minutes; measured 24-28 s at 4-5
# threads. Shared bandwidth compresses the absolute rates, which is acceptable:
# the job is excluding the dead, not benchmarking the live.
THREADS=4

# Seconds to establish the connection before a mirror is written off.
CONNECT_TIMEOUT=3

# Seconds the rate probe is allowed to run before SIGALRM cuts it short. This one
# is the least obvious and the most load-bearing: reflector's default of 5 s scores
# EVERY mirror slower than ~1.8 MB/s as zero, so on an ordinary link the whole pool
# ties at zero and the "ranking" degenerates into API order. 12 s covers a link down
# to ~0.75 MB/s; a stalled host still burns at most 12 s and sorts last.
DOWNLOAD_TIMEOUT=12

# How old the list may get before the daily timer re-ranks it. The timer ticks
# daily and does nothing until the list is older than this, so the policy is this
# ONE number whether the machine runs 24/7 or is booted twice a month.
# 30 days is a deliberate floor, not caution: a run costs up to ~260 MB (see SCORE),
# mirrors rot on a scale of months, and the day-scale failure — a mirror that goes
# bad after it was chosen — is already covered by the retry seam (w_pac), which
# reorders the list for free. Re-ranking is the slow, expensive answer to a slow,
# gradual problem.
INTERVAL_DAYS=30

# Skip the scheduled run while the connection is metered (NetworkManager's own
# per-device verdict, including its "guessed" one for mobile broadband). A manual
# `w-mirrors rank` always runs — an explicit request is an explicit decision.
SKIP_METERED=yes
