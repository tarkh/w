# /usr/share/w/defaults/nightlight.conf — W Linux night light: the VENDOR layer.
#
# W's own defaults. Do NOT edit: every update overwrites this file wholesale.
# This machine's decisions belong in /etc/w/nightlight.conf (the admin layer) and
# personal ones in ~/.config/w/nightlight.conf — neither is ever touched by an
# update. `w-conf cat nightlight` shows the merged result and where each value
# came from.
#
# Nothing here is applied by hand: `w-nightlight` renders these keys into
# ~/.config/hypr/hyprsunset.conf (the only file hyprsunset itself reads) and
# restarts the daemon. Editing hyprsunset.conf directly is pointless — the next
# render overwrites it.

# What the night light does at all:
#
#   off       no filter, ever. hyprsunset still runs (one identity profile), so
#             the toggle and the live preview keep working with no daemon dance.
#   schedule  warm between NIGHT_START and NIGHT_END, neutral the rest of the day.
#   always    warm around the clock — for people who never want the blue back,
#             and for rooms that are dark at any hour.
#
# Ships as `off`: a distro that tints the screen orange before being asked reads
# as a broken display, not a feature. Turning it on is one click in
# W Hub -> Displays -> Night light.
MODE=off

# Colour temperature during the night window, in kelvin. Lower is warmer:
#   6600  as close to an untouched screen as a kelvin value gets (see DAY_TEMP)
#   4300  noticeable but still comfortable for reading and photos  <- W's default
#   3000  clearly amber, the classic "evening" look
#   2000  candlelight; text stays fine, colour work does not
# Accepted range: 1000-20000.
NIGHT_TEMP=4300

# Colour temperature during the DAY — the other end of the transition, i.e. what
# the screen eases back to when the night window closes.
#
# 6600 is the default because that is the value whose colour matrix comes closest
# to leaving the screen alone: measured against hyprsunset's own conversion, 6600
# is 0.97% off an untouched screen while 6000 — which W used to treat as
# "neutral" — is a 7.1% cut on blue, i.e. a filter you can see. At exactly 6600
# the daytime state is sent as `identity`, dropping the colour matrix outright.
#
# Two reasons to change it:
#   • your panel's own white point is not what 6600 assumes, and the start of a
#     transition is visible as a small step;
#   • you actually want a tinted day — 5900 for a permanently warmer screen,
#     7100 for a cooler one. Any value other than 6600 is applied as a real
#     temperature and stays on all day.
#
# This is NOT the off switch: MODE=off always means an untouched screen, whatever
# is set here. Accepted range: 1000-20000.
DAY_TEMP=6600

# When the night window opens and closes, HH:MM in 24-hour local time. Crossing
# midnight is normal and needs no special syntax — 21:00 to 07:00 is simply the
# time outside the day profile.
#
# These are wall-clock times, not sunset/sunrise: hyprsunset has no notion of a
# location, and W does not ship one. A fixed schedule also never surprises you
# with a filter that moves by an hour between seasons.
NIGHT_START=21:00
NIGHT_END=07:00

# How long the change between day and night takes, in minutes. 0 = instant.
#
# With the default 30, the window opening at 21:00 means the screen starts
# warming at 21:00 and reaches NIGHT_TEMP at 21:30; at NIGHT_END it eases back
# over the same span. Spread out like this the change stays below the threshold
# where the eye notices it happening at all — which is the point.
#
# hyprsunset itself cannot do this (its profiles are instant switches at a time),
# so w-nightlight owns the schedule and pushes the intermediate value in over
# IPC. A ramp is automatically shortened if it would not fit between the two
# boundaries — a 12-hour transition across a 1-hour window is a contradiction,
# not a configuration.
#
# This setting only paces the SCHEDULED change. Anything else the night light has
# to do — turning on or off, a setting changed halfway through a transition,
# catching up after a suspend — eases across in a couple of seconds instead, so
# nothing ever jumps and nothing ever makes you wait half an hour for a switch
# you just flipped. That short ease and the rest of the engine's mechanics are
# tunables at the top of /usr/bin/w-nightlight, not settings.
RAMP_MINUTES=30
