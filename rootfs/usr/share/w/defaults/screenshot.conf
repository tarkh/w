# /usr/share/w/defaults/screenshot.conf — W Linux screen capture: the VENDOR layer.
#
# W's own defaults. Do NOT edit: every update overwrites this file wholesale.
# This machine's decisions belong in /etc/w/screenshot.conf (the admin layer) and
# personal ones in ~/.config/w/screenshot.conf — neither is ever touched by an
# update. `w-conf cat screenshot` shows the merged result and where each value
# came from.
#
# Read by /usr/bin/w-screenshot at the moment of the capture, so a change takes
# effect on the very next keypress — no reload, no relogin, no render step.

# Which annotation UI opens when a capture is taken with `--annotate` (the
# default action, and what all three screenshot keybinds do):
#
#   flameshot  the capture happens under a frozen full-screen overlay: you drag
#              the region and draw on it in the same surface, with the toolbar
#              next to the selection. Nothing else opens. Flameshot reaches the
#              screen through the XDG screenshot portal, which on W is
#              xdg-desktop-portal-hyprland calling grim — the same wlr-screencopy
#              path everything else here uses.  <- W's default
#   satty      the older two-step stack: slurp selects the region, grim captures
#              it, and satty opens the result in its own floating GTK4 window to
#              draw on. Kept as the rollback for anything Flameshot gets wrong on
#              a given machine — both are installed, both are themed by w-style.
#
# `full --annotate` (a single canvas across ALL monitors) always goes to satty:
# Flameshot's overlay is one window on one monitor by construction, so it has no
# equivalent. Every other mode honours this key. The non-annotating actions
# (--copy, --save) never involve either tool.
ANNOTATOR=flameshot
