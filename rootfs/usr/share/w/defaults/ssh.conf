# ssh.conf — W's SSH agent catalog + the default selection (see w-ssh.md).
#
# W ships gcr-ssh-agent as the default agent (package-gnome-keyring.md), but the
# SSH agent is a slot, not a fixture: a password manager that carries SSH keys
# (Bitwarden, 1Password, …) replaces it wholesale. `w-ssh use <name>` performs
# that swap, and everything it needs to know about a backend is one line here —
# where that agent listens. Nothing else in W hardcodes an agent path.
#
# Path specifiers, systemd-style:
#   %t  $XDG_RUNTIME_DIR   %h  the user's home
#
# Adding an agent W does not know about is a single SOCKET_<name>= line in
# /etc/w/ssh.conf (machine-wide) or ~/.config/w/ssh.conf (just you) — the catalog
# merges key-wise across the layers, so your entry appears in `w-ssh list`
# beside these with no code change. The reserved name `none` is not a backend:
# it removes the stable socket link and leaves SSH with no agent at all.

# Active backend. `both` scope: the admin sets what the machine defaults to,
# each user may pick their own (an agent is a per-session, per-person thing).
AGENT=gcr

# gcr-ssh-agent (gcr-4) — W's default. Its own socket unit exports SSH_AUTH_SOCK
# too, which is why `w-ssh use` masks the unit when handing SSH to another agent:
# two agents racing over one variable is the failure this indirection removes.
SOCKET_gcr=%t/gcr/ssh

# Bitwarden desktop. Default path; the app also honours BITWARDEN_SSH_AUTH_SOCK,
# which the `bitwarden` bundle sets to exactly this value so the two agree.
SOCKET_bitwarden=%h/.bitwarden-ssh-agent.sock

# 1Password desktop (Settings → Developer → "Use the SSH agent").
SOCKET_onepassword=%h/.1password/agent.sock

# A plain ssh-agent run as a user unit listening on a fixed path — the escape
# hatch for "no password manager at all", and the shape any hand-rolled agent
# should copy (a random /tmp/ssh-XXXX path cannot be named here, by definition).
SOCKET_openssh=%t/ssh-agent.sock
