# /usr/share/w/defaults/userdirs.conf — W Linux standard home folders: the VENDOR
# layer.
#
# W's own defaults. Do NOT edit: every update overwrites this file wholesale.
# This machine's decisions belong in /etc/w/userdirs.conf (the admin layer) and
# personal ones in ~/.config/w/userdirs.conf — neither is ever touched by an
# update. `w-conf cat userdirs` shows the merged result and where each value
# came from.
#
# What this subsystem is: the standard folders of a home directory (Documents,
# Downloads, Pictures, …) as xdg-user-dirs manages them — created in the user's
# language at the first login, looked up by programs through `xdg-user-dir`
# rather than by name. W adds the one step upstream leaves to a GNOME dialog:
# when the system language changes, the folders follow it. See w-userdirs.md.

# Whether the standard folders are renamed when the system language changes.
#
#   yes   at the first login after the change, every folder that still carries
#         its default name in the OLD language is renamed to its name in the
#         new one (~/Pictures -> ~/Изображения). A rename is exactly that — the
#         contents are not touched, copied or merged. A folder the user moved
#         or renamed themselves (the path in ~/.config/user-dirs.dirs no longer
#         matches the default) is left alone, and so is one whose new name is
#         already taken by a non-empty folder: both stay, nothing is lost.
#   no    the folders keep their names whatever the language. The anchor
#         (~/.config/user-dirs.locale) is kept as it is, so switching to `yes`
#         later still renames at the next login.
#
# Ships as `yes`: a system that says «Изображения» in every menu and has a
# ~/Pictures is speaking two languages at once. Switch it in
# W Hub -> System -> System language.
LOCALIZE=yes
