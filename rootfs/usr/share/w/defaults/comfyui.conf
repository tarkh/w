# /usr/share/w/defaults/comfyui.conf — W Linux ComfyUI service: the VENDOR layer.
#
# W's own defaults. Do NOT edit: every update overwrites this file wholesale.
# Machine-specific decisions belong in /etc/w/comfyui.conf (the admin layer),
# which the update never touches — put ONLY the keys you actually change there.
# `w-conf cat comfyui` shows the merged result with the origin of every value.
#
# The engine itself ships in the OPTIONAL `comfyui` W-Pack; these keys are
# declared in the base system so the paths can be chosen BEFORE the pack is
# installed (same reason as ai-models.conf, same reason ai.conf carries the
# W_AI_TOOL_* switches for tools that arrive later):
#
#   sudo w-conf set comfyui   ROOT /Apps/Programs/ComfyUI
#   sudo w-conf set ai-models DIR  /Apps/Models
#   sudo w-pack install comfyui
#
# Read by the pack's setup.sh, which renders them into the service's drop-in
# (/etc/systemd/system/comfyui.service.d/10-w.conf). Changing a key later takes
# effect on `sudo w-pack refresh comfyui`.
#
# There is deliberately NO autostart key here: whether the service runs at boot
# is systemd's own state (`systemctl enable comfyui`), and a W key mirroring it
# would be a second truth that fights the user on every refresh. W ships it
# installed but not enabled — it is a heavy optional service, started when
# wanted (the launcher entry starts it on demand).

# Where the engine lives: the git checkout, its virtualenv (PyTorch with the CUDA
# or ROCm runtime inside — 7-10 GB), the service account's own state, and the
# runtime data. Relocatable precisely because that adds up: a small system SSD is
# a real constraint, and this whole tree is reproducible from the network.
#
#   $ROOT/app     the ComfyUI checkout + .venv   (comfy-cli's workspace)
#   $ROOT/data    --base-directory: input, output, user, temp, custom_nodes
#   $ROOT/.cache, $ROOT/.local, $ROOT/.config    the service account's home
#
# Splitting `app` from `data` is what lets the checkout be updated — or deleted
# and reinstalled — without taking generated images and installed custom nodes
# with it. Models are NOT here: they are shared machine-wide, see ai-models.conf.
ROOT=/var/lib/w/comfyui

# Loopback by default. ComfyUI has no authentication of its own and its API can
# read and write files and install code, so exposing it to a network is a
# deliberate act: set 0.0.0.0 only behind a firewall rule you wrote yourself.
#
# ComfyUI-Manager reads this same address and draws its own line from it: at its
# default security level, installing a custom node is allowed only while the
# engine answers on loopback. Move off 127.0.0.1 and the node-install buttons
# stop working — not a W restriction, and not something a W key can lift.
LISTEN=127.0.0.1
PORT=8188

# Which PyTorch build the pack installs: auto|nvidia|amd|intel|cpu. `auto` reads
# the GPU off lspci: [10de: NVIDIA, [1002: AMD, and for Intel a DISCRETE card only
# — Arc/Battlemage by device id (4f8x/56xx/e2xx), because the card's name is not
# where lspci keeps a contract. An Intel iGPU is not a match and falls back to cpu
# with a warning — generation on a CPU is technically functional and practically
# unusable; set intel by hand if you want the XPU build on an iGPU anyway.
# Only consulted at install time; changing it later needs a reinstall of the
# virtualenv, which the pack's SKILL documents.
GPU=auto

# Extra arguments appended to ComfyUI's command line, one line, shell-word split
# (e.g. "--lowvram" on a small card, "--cuda-device 0" to pin one GPU of two).
# Environment-level tuning (HIP_VISIBLE_DEVICES, CUDA_VISIBLE_DEVICES,
# PYTORCH_HIP_ALLOC_CONF …) belongs in a drop-in of your own —
# /etc/systemd/system/comfyui.service.d/20-local.conf (sorts after this pack's
# own 10-w.conf, so its Environment= lines ADD to ours instead of replacing
# them) — which W renders nothing into and never overwrites. Put ONLY
# Environment= lines there: an ExecStart= in that file collides with the one
# this pack renders into 10-w.conf ("Service has more than one ExecStart") —
# extra flags belong in ARGS below, not in a second drop-in.
ARGS=
