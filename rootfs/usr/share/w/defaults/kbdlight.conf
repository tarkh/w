# /usr/share/w/defaults/kbdlight.conf — W Linux keyboard backlight: the VENDOR layer.
#
# W's own defaults. Do NOT edit: every update overwrites this file wholesale.
# Machine-specific decisions belong in /etc/w/kbdlight.conf (the admin layer),
# which the update never touches — put ONLY the keys you actually change there.
# `w-conf cat kbdlight` shows the merged result with the origin of every value.
#
# Machines without a keyboard backlight ignore all of this: w-kbdlight, the bar
# block and the initramfs hook all key off the presence of a `*kbd_backlight*`
# led-class device, so a desktop or a VM simply has nothing to drive.

# Level (percent) the initramfs sets before the disk-encryption prompt, so the
# password can be typed in the dark. 0 (or "off") leaves the keyboard dark at boot.
#
# This value is BAKED INTO THE INITRAMFS at build time — the boot prompt has no
# other filesystem to read it from. Editing this file (or /etc/w/kbdlight.conf) by
# hand therefore changes nothing until the image is rebuilt; use
# `sudo w-kbdlight boot <N|off>`, which does both.
#
# After the root filesystem is mounted, systemd-backlight restores the level the
# machine was shut down with — so this is specifically about the boot window, not
# about the level you get once you are logged in.
BOOT_LEVEL=50

# How much one press of the keyboard-backlight keys changes the level, in percent.
# Devices with a very coarse range (ThinkPads expose 0..2) step by one unit
# instead — a percentage of a three-step range rounds to "nothing happened".
STEP=10

# Which led-class device is the keyboard backlight. Empty = auto-detect, which is
# right on every machine with one built-in keyboard: the first `*kbd_backlight*`
# device, preferring the platform LED over one exposed by an input driver (a
# plugged-in lit USB keyboard registers as `*::kbd_backlight` too, and the media
# keys mean the built-in one). Set a device name here only to override that.
DEVICE=
