# /usr/share/w/defaults/fingerprint.conf — W Linux fingerprint reader: the VENDOR layer.
#
# W's own defaults. Do NOT edit: every update overwrites this file wholesale.
# Machine-specific decisions belong in /etc/w/fingerprint.conf (the admin layer),
# which the update never touches — put ONLY the keys you actually change there.
# `w-conf cat fingerprint` shows the merged result with the origin of every value.
#
# Enrolment itself is fprintd's (w-fingerprint enroll/delete); what lives here is
# how the reader behaves UNDER THE LOCK SCREEN. Machines without a reader ignore
# all of it — nothing arms when no finger is enrolled.

# Who verifies the finger while hyprlock is up.
#   native — hyprlock talks to fprintd itself; the sensor stays lit for the whole
#            lock. Simplest, and what hyprlock ships.
#   wake   — w-authd verifies instead, only for LOCK_SENSOR_ARM seconds after the
#            lock, a wake-up from sleep, or any activity while locked (a hypridle
#            tick), then the sensor sleeps; hyprlock's own fingerprint is switched
#            off (~/.config/hypr/hyprlock-auth.conf). For readers that overheat
#            under a continuous verify (libfprint's thermal guard —
#            verify-disconnected after ~4 minutes, e.g. the uru4000) this is the
#            mode in which the finger keeps working after the first minutes.
# Set with `w-fingerprint lock-sensor mode <native|wake>` or the Hub (Input →
# Fingerprint); takes effect at the next lock.
LOCK_SENSOR=native

# wake mode: how many seconds the sensor stays armed after a lock, a wake-up or
# an activity tick. 10..300.
LOCK_SENSOR_ARM=30
