# /usr/share/w/defaults/dns.conf — W Linux dns: the VENDOR layer.
#
# W's own defaults. Do NOT edit: every update overwrites this file wholesale.
# Machine-specific decisions belong in /etc/w/dns.conf (the admin layer), which
# the update never touches — put ONLY the keys you actually change there.
# `w-conf cat dns` shows the merged result with the origin of every value.
#
# DoT resolver catalog + the default selection. The catalog MERGES per key: a
# DNS_<name> added by the admin coexists with these, and new resolvers shipped by a
# later W release arrive on their own.

PROVIDER=quad9
DOT=opportunistic                  # opportunistic | strict | off

# Provider catalog — DNS_<name>="IP#tls-hostname ..." (the #hostname is required
# for DNS-over-TLS certificate/SNI validation). All entries are DoT endpoints;
# systemd-resolved speaks DoT only (no DoH). v4 + v6 listed for dual-stack.
DNS_quad9="9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net 2620:fe::9#dns.quad9.net"
DNS_cloudflare="1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com 2606:4700:4700::1111#cloudflare-dns.com 2606:4700:4700::1001#cloudflare-dns.com"
DNS_mullvad="194.242.2.2#dns.mullvad.net 2a07:e340::2#dns.mullvad.net"
DNS_google="8.8.8.8#dns.google 8.8.4.4#dns.google 2001:4860:4860::8888#dns.google 2001:4860:4860::8844#dns.google"
DNS_adguard="94.140.14.14#dns.adguard-dns.com 94.140.15.15#dns.adguard-dns.com 2a10:50c0::ad1:ff#dns.adguard-dns.com 2a10:50c0::ad2:ff#dns.adguard-dns.com"
