# /usr/share/w/defaults/invokeai.conf — W Linux InvokeAI service: the VENDOR layer.
#
# W's own defaults. Do NOT edit: every update overwrites this file wholesale.
# Machine-specific decisions belong in /etc/w/invokeai.conf (the admin layer),
# which the update never touches — put ONLY the keys you actually change there.
# `w-conf cat invokeai` shows the merged result with the origin of every value.
#
# The engine itself ships in the OPTIONAL `invokeai` W-Pack; these keys are
# declared in the base system so the paths can be chosen BEFORE the pack is
# installed (same reason as comfyui.conf and ai-models.conf):
#
#   sudo w-conf set invokeai  ROOT /Apps/InvokeAI
#   sudo w-conf set ai-models DIR  /Apps/Models
#   sudo w-pack install invokeai
#
# Read by the pack's setup.sh, which renders them into the service's drop-in
# (/etc/systemd/system/invokeai.service.d/10-w.conf). Changing a key later takes
# effect on `sudo w-pack refresh invokeai`.
#
# There is deliberately NO autostart key (whether it runs at boot is systemd's
# own state: `systemctl enable invokeai`) and NO extra-arguments key: unlike
# ComfyUI, `invokeai-web` takes no tuning flags at all — only --root/--config.
# Engine tuning (ram, vram, attention_type, enable_partial_loading, …) lives in
# the engine's own $ROOT/data/invokeai.yaml, which W never writes; environment
# tuning in a drop-in of your own,
# /etc/systemd/system/invokeai.service.d/20-local.conf.

# Where the engine lives: the virtualenv (PyTorch with the CUDA or ROCm runtime
# inside — 5-10 GB), the uv-managed Python it runs on, and the runtime root.
#
#   $ROOT/app/.venv   the invokeai package + torch   (rebuildable: rm + refresh)
#   $ROOT/data        INVOKEAI_ROOT: invokeai.yaml, databases/, outputs/, nodes/
#   $ROOT/.local, $ROOT/.cache                       the service account's home
#
# Splitting `app` from `data` is what makes an upgrade harmless: delete the venv
# and refresh, and the gallery, boards and model registry stay where they were.
# Models are NOT here: they are shared machine-wide, see ai-models.conf.
ROOT=/var/lib/w/invokeai

# Loopback by default. In its default single-user mode InvokeAI has no
# authentication, and its API installs models from arbitrary URLs and reads
# local paths, so exposing it to a network is a deliberate act: set 0.0.0.0 only
# behind a firewall rule you wrote yourself.
LISTEN=127.0.0.1
PORT=9090

# Which PyTorch build the pack installs: auto|nvidia|amd|intel|cpu — the torch
# backend of the official manual install (cu128 | rocm7.1 | xpu | cpu). `auto`
# reads the GPU off lspci exactly like the comfyui pack: NVIDIA, AMD, and for
# Intel a DISCRETE Arc/Battlemage only; an Intel iGPU falls back to cpu with a
# warning. Only consulted when the virtualenv is built; changing it later needs
# the venv rebuilt (rm -rf $ROOT/app && w-pack refresh invokeai).
GPU=auto

# Which InvokeAI release the pack installs and `w-pack upgrade invokeai` moves to: `latest`
# (the newest stable release on PyPI) or one version to hold at, e.g. 6.14.2 — a
# held version is also how you go back to an older one. Nothing moves on its
# own: neither w-update nor refresh touches the engine, only
# `sudo w-pack upgrade invokeai` does, after showing what it is about to do
# (including whether the upgrade brings a new PyTorch — a multi-GB download).
VERSION=latest
