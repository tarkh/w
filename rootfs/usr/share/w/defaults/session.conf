# /usr/share/w/defaults/session.conf — W Linux session memory: the VENDOR layer.
#
# W's own defaults. Do NOT edit: every update overwrites this file wholesale.
# This machine's decisions belong in /etc/w/session.conf (the admin layer) and
# personal ones in ~/.config/w/session.conf — neither is ever touched by an
# update. `w-conf cat session` shows the merged result and where each value
# came from.
#
# What this subsystem is: the snapshot of your graphical session — which windows
# were open, on which workspace and monitor, where the floating ones sat, which
# one had focus — and reopening it at the next login. Wayland has no session
# management of its own that would do this: the `xdg-session-management-v1`
# protocol exists (Qt 6.10, Mutter, SDL all speak it) but Hyprland does not
# implement it, so W reconstructs the session from `hyprctl clients` and
# /proc/<pid>/{cmdline,cwd} instead. See w-session.md.

# What the session memory does at all:
#
#   off      nothing is recorded and nothing is reopened. Every login is a
#            clean session.
#   save     the snapshot is kept up to date, but the session is NOT reopened
#            automatically — `w-session restore` does it on demand. For people
#            who want the safety net without the automatic login storm.
#   restore  the snapshot is kept AND replayed at every login: windows come
#            back on their workspaces, floating geometry and all.
#
# Ships as `off`. A distribution that reopens a dozen windows before being asked
# reads as a runaway machine, not as a feature — the same reasoning that keeps
# the night light off by default. Turning it on is one click in
# W Hub -> System -> Session.
MODE=off

# How often the background snapshot is refreshed, in seconds. The daemon is
# event-driven (it subscribes to Hyprland's socket2 and reacts to windows
# opening, closing, moving, going fullscreen), so this is not a polling
# interval — it is the floor on how often those events may hit the disk, i.e.
# how much a crash or a held power button can cost you.
#
#   0    never write on a timer: the snapshot is taken ONLY on a graceful exit
#        (`w-session-exit`, i.e. the Power Menu). Zero background writes, but a
#        power cut loses the whole session.
#   60   W's default — at most a minute stale, a handful of writes an hour.
#
# A graceful logout/reboot/shutdown always takes an exact snapshot regardless of
# this value: `w-session-exit` saves BEFORE it starts closing windows, which is
# the last instant the window list is still whole.
AUTOSAVE_SEC=60

# Window classes never to record, as space-separated regexes matched against the
# window's `initialClass` (anchored: `foot` matches only `foot`, not `footclient`
# — write `foot.*` if you mean the prefix).
#
# Empty by default. What belongs here is anything whose reopening is worse than
# useless: installers and one-shot wizards, a password prompt, a game you do not
# want relaunched on every boot. Windows W itself owns are not a concern — the
# shell (bar, launcher, Hub, notifications) draws on layer-shell surfaces, which
# are not windows and never appear in `hyprctl clients` at all.
EXCLUDE_CLASSES=

# Safety cap on how many windows one snapshot may carry. Restoring is the risky
# direction: every entry is a process launch, and a session that somehow grew to
# hundreds of windows would meet the next login with a fork storm. On reaching
# the cap the snapshot keeps the windows with the most recent focus (Hyprland's
# own focusHistoryID) and drops the rest, so what you were actually working in
# survives the trim.
MAX_WINDOWS=40

# Whether to reopen the program that was RUNNING INSIDE a terminal window, or
# just the terminal.
#
# Without this, a workspace full of work comes back as a workspace full of empty
# shells: the window belongs to the terminal, and the editor or monitor inside it
# is a child process the compositor knows nothing about. W finds it structurally
# — a terminal is a process with a child on a pty — and reopens it with
# `w-term -e <program>` in the directory it was running in.
#
#   off        never look inside a terminal; reopen the terminal alone.
#   allowlist  reopen only programs named in
#              /usr/share/w/defaults/session-terminal.list (plus your own
#              ~/.config/w/session-terminal.list).  <- W's default
#   all        reopen whatever was in the foreground, whatever it was.
#
# `allowlist` is the default and the asymmetry is deliberate: reopening a
# program means RE-EXECUTING it. An editor or a system monitor is safe to bring
# back; a half-finished build, a deploy script, or anything behind `sudo` is not,
# and neither is anything W has never heard of. Programs off the list still get
# their terminal back, in the right directory — which loses nothing except the
# program itself, and cannot act on its own.
#
# `all` is for a machine where you know what you run. It will re-execute the
# last foreground command of every terminal window at login.
#
# One limitation worth knowing, because it is a property of the terminal and not
# of this setting: a terminal that serves every window from ONE process (ghostty,
# W's default, runs `--gtk-single-instance`) gives no way to tell which child
# belongs to which window. W matches them by window title, which terminals set
# from the running program. Two windows running the SAME program are genuinely
# indistinguishable, and W then reopens neither rather than guessing.
TERMINAL_APPS=allowlist
