# W Linux — runtime directories
# /run/w/       W namespace, root-controlled (only root creates subdirs via tmpfiles.d)
# /run/w/wallpaper/  world-writable so any user/service can update the wallpaper symlink
#                    (/run/w/wallpaper/wallpaper → active theme's webp/png, extension-agnostic;
#                     /run/w/wallpaper/manifest.json → per-tier resolved paths for the greeter)
d /run/w            0755 root root -
d /run/w/wallpaper  0777 root root -
