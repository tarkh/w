# W Linux — runtime directories
# /run/w/       W namespace, root-controlled (only root creates subdirs via tmpfiles.d)
# /run/w/wallpaper/  world-writable so any user/service can update the wallpaper symlink
#                    (/run/w/wallpaper/wallpaper → active theme's webp/png, extension-agnostic;
#                     /run/w/wallpaper/manifest.json → per-tier resolved paths for the greeter)
# /run/w/fp/    per-user "skip the reader this time" flags (fp-skip-<uid>), written by
#               w-authd and read by w-fp-gate. It lives here rather than in the user's
#               own $XDG_RUNTIME_DIR because the gate runs inside polkit-agent-helper@
#               .service, whose ProtectHome=yes makes /run/user invisible — the flag
#               would never be seen (see quickshell-auth.md). STICKY like /tmp: anyone
#               may drop their own flag, nobody may remove someone else's, and the gate
#               additionally ignores a flag whose owner is not the authenticating user.
d /run/w            0755 root root -
d /run/w/wallpaper  0777 root root -
d /run/w/fp         1777 root root -
